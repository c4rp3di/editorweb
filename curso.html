<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1116">
<title>🇧🇷 Portugués · Curso personal</title>
<style>
  /* ====== Tokens de tema ====== */
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --panel3:#232b36;
    --border:#2a3340; --border2:#3a4454;
    --text:#e6edf3; --dim:#8b949e; --dim2:#6b7280;
    --accent:#00c896; --accent-dark:#00a37a;
    --blue:#3d8bfd; --purple:#8c82ff; --warn:#ffb020; --bad:#ff5c5c;
    --shadow:0 8px 24px rgba(0,0,0,.5);
    --radius:14px; --radius-sm:10px;
  }
  [data-theme="light"]{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef1f7; --panel3:#e2e7f0;
    --border:#d8dde6; --border2:#b8c0ce;
    --text:#1a1f2e; --dim:#5b6478; --dim2:#8b94a8;
    --accent:#00a37a; --accent-dark:#008a68;
    --blue:#2563eb; --purple:#6366f1; --warn:#c87f00; --bad:#dc2626;
    --shadow:0 8px 24px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    padding-bottom:calc(env(safe-area-inset-bottom,0) + 8px);
    transition:background .25s ease, color .25s ease;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,textarea{font-family:inherit}

  /* ====== Header ====== */
  header{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top,0);
  }
  .header-top{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px 8px;
  }
  .logo{font-size:.95rem;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .logo em{font-style:normal;font-size:.55rem;font-weight:600;background:var(--accent);color:#04170f;padding:2px 8px;border-radius:99px;letter-spacing:.3px}
  .storage-mini{
    font-size:.6rem;color:var(--dim);background:var(--panel);padding:4px 9px;
    border-radius:99px;border:1px solid var(--border);white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .storage-mini b{color:var(--accent);font-weight:700}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;background:var(--panel);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:.95rem;transition:.15s;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.92);background:var(--panel2)}

  .tabs{
    display:flex;gap:3px;padding:0 10px 8px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:1;min-width:0;padding:8px 12px;border-radius:99px;
    font-size:.72rem;font-weight:600;color:var(--dim);
    white-space:nowrap;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .tab.active{background:var(--panel2);color:var(--text)}
  .tab:active{transform:scale(.96)}

  /* ====== Layout ====== */
  main{max-width:760px;margin:0 auto;padding:16px 14px 40px}

  /* ====== Catálogo ====== */
  .unit{margin-bottom:24px}
  .unit-head{
    display:flex;align-items:baseline;gap:10px;margin-bottom:10px;
    padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .unit-head h2{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
  .unit-head .unit-count{font-size:.66rem;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}

  .lessons{display:grid;gap:10px}
  @media(min-width:560px){ .lessons{grid-template-columns:1fr 1fr} }

  .lesson-card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;display:flex;flex-direction:column;gap:10px;
    transition:.18s;position:relative;overflow:hidden;
  }
  .lesson-card.ready{border-color:color-mix(in srgb, var(--accent) 40%, var(--border))}
  .lesson-card.ready::before{
    content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);
  }
  .lesson-top{display:flex;align-items:flex-start;gap:10px}
  .lesson-icon{font-size:1.5rem;line-height:1;flex-shrink:0}
  .lesson-meta{flex:1;min-width:0}
  .lesson-title{font-size:.88rem;font-weight:600;line-height:1.25;margin-bottom:2px}
  .lesson-sub{font-size:.68rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .level-badge{
    font-size:.55rem;font-weight:700;padding:2px 7px;border-radius:5px;
    background:var(--panel2);color:var(--dim);border:1px solid var(--border);
    flex-shrink:0;letter-spacing:.3px;
  }
  .level-badge.a1{background:rgba(61,139,253,.15);color:#87b8ff;border-color:rgba(61,139,253,.3)}
  .level-badge.a2{background:rgba(140,130,255,.15);color:#b8b2ff;border-color:rgba(140,130,255,.3)}
  [data-theme="light"] .level-badge.a1{color:#1d4ed8}
  [data-theme="light"] .level-badge.a2{color:#4338ca}

  .lesson-status{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .status-tag{
    font-size:.6rem;font-weight:600;padding:3px 9px;border-radius:99px;
    background:var(--panel2);color:var(--dim);border:1px solid var(--border);
  }
  .status-tag.ready{background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
  .status-tag.dl{background:color-mix(in srgb, var(--blue) 15%, transparent);color:var(--blue);border-color:color-mix(in srgb, var(--blue) 35%, transparent)}
  .status-tag.err{background:color-mix(in srgb, var(--bad) 15%, transparent);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 35%, transparent)}
  .enrich-badge{
    font-size:.55rem;font-weight:600;padding:2px 7px;border-radius:99px;
    background:color-mix(in srgb, var(--purple) 15%, transparent);
    color:var(--purple);border:1px solid color-mix(in srgb, var(--purple) 30%, transparent);
  }
  [data-theme="light"] .enrich-badge{color:#5b21b6}

  .lesson-action{display:flex;gap:8px;margin-top:auto}
  .lesson-action button{
    flex:1;padding:11px 12px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;
    transition:.15s;min-height:42px;
  }
  .lesson-action button:active{transform:scale(.97)}
  .btn-download{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  .btn-download:active{border-color:var(--accent);color:var(--accent)}
  .btn-play{background:var(--accent);color:#04170f}
  .btn-play:active{background:var(--accent-dark)}
  .btn-retry{background:color-mix(in srgb, var(--bad) 15%, transparent);color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 30%, transparent)}

  .dl-progress{
    height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;
    margin-top:2px;
  }
  .dl-progress .bar{
    height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));
    width:0;transition:width .3s ease;
  }
  .dl-status{font-size:.62rem;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between;gap:6px}
  .dl-status span:last-child{font-variant-numeric:tabular-nums}

  /* ====== Jugador ====== */
  .player-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .player-back{
    width:38px;height:38px;border-radius:50%;background:var(--panel);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:1rem;transition:.15s;flex-shrink:0;
  }
  .player-back:active{background:var(--panel2);transform:scale(.94)}
  .player-prog{
    flex:1;height:8px;background:var(--panel);border-radius:99px;overflow:hidden;
    border:1px solid var(--border);
  }
  .player-prog .bar{
    height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));
    transition:width .35s ease;
  }
  .hearts{display:flex;gap:1px;font-size:.85rem;flex-shrink:0;letter-spacing:-2px}

  .exercise{animation:fadeIn .28s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .ex-type{
    font-size:.62rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--dim);margin-bottom:10px;
  }
  .ex-prompt{
    font-size:1.15rem;font-weight:600;line-height:1.4;margin-bottom:20px;
    word-break:break-word;
  }
  .ex-prompt .pt{color:var(--accent)}
  .ex-hint{font-size:.75rem;color:var(--dim);margin-top:-10px;margin-bottom:18px;font-weight:400}

  .speaker-btn{
    width:84px;height:84px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;margin:0 auto 22px;transition:.15s;
    box-shadow:0 8px 24px color-mix(in srgb, var(--blue) 35%, transparent);
  }
  .speaker-btn:active{transform:scale(.94)}
  .speaker-btn.playing{animation:speakerPulse .8s ease}
  @keyframes speakerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .options{display:grid;gap:8px}
  .options.grid2{grid-template-columns:1fr 1fr}
  @media(max-width:480px){ .options.grid2{grid-template-columns:1fr} }
  .option{
    background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 15px;font-size:.88rem;text-align:left;transition:.12s;
    font-weight:500;line-height:1.35;min-height:48px;
    display:flex;align-items:center;gap:8px;
  }
  .option:active:not(:disabled){transform:scale(.98)}
  .option.selected{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 10%, transparent)}
  .option.correct{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent)}
  .option.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad)}
  .option:disabled{cursor:default}

  /* Order words */
  .order-answer{
    min-height:56px;padding:10px;background:var(--panel);border:1.5px dashed var(--border);
    border-radius:var(--radius-sm);display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    margin-bottom:14px;transition:.15s;
  }
  .order-answer.filled{border-style:solid}
  .word-chip{
    background:var(--panel2);border:1px solid var(--border);border-radius:9px;
    padding:9px 13px;font-size:.85rem;font-weight:500;transition:.12s;
    min-height:38px;display:inline-flex;align-items:center;
  }
  .word-chip:active{transform:scale(.96)}
  .word-chip.in-answer{
    background:color-mix(in srgb, var(--blue) 15%, transparent);
    border-color:var(--blue);color:var(--blue);
  }
  .word-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;min-height:40px}

  /* Speak */
  .mic-area{display:flex;flex-direction:column;align-items:center;gap:12px;margin:20px 0}
  .mic-btn{
    width:100px;height:100px;border-radius:50%;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    display:flex;align-items:center;justify-content:center;font-size:2.5rem;
    box-shadow:0 10px 30px color-mix(in srgb, var(--purple) 40%, transparent);
    transition:.15s;
  }
  .mic-btn:active{transform:scale(.94)}
  .mic-btn.rec{
    background:linear-gradient(135deg,var(--bad),#b91c1c);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 10px 30px color-mix(in srgb, var(--bad) 35%, transparent)}
    50%{box-shadow:0 10px 44px color-mix(in srgb, var(--bad) 60%, transparent)}
  }
  .mic-hint{font-size:.75rem;color:var(--dim);text-align:center;max-width:280px}

  .speak-result{
    padding:12px 14px;border-radius:var(--radius-sm);font-size:.82rem;line-height:1.5;
    margin-top:8px;
  }
  .speak-result.ok{background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);color:var(--accent)}
  .speak-result.mid{background:color-mix(in srgb, var(--warn) 12%, transparent);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);color:var(--warn)}
  .speak-result.bad{background:color-mix(in srgb, var(--bad) 12%, transparent);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);color:var(--bad)}

  /* Footer del ejercicio */
  .ex-footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
  .feedback{
    padding:12px 14px;border-radius:var(--radius-sm);font-size:.82rem;line-height:1.5;
    margin-bottom:12px;
  }
  .feedback.ok{background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);color:var(--accent)}
  .feedback.bad{background:color-mix(in srgb, var(--bad) 12%, transparent);border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);color:var(--bad)}
  .feedback b{font-weight:700}

  .btn-primary{
    width:100%;padding:15px;border-radius:12px;font-size:.9rem;font-weight:700;
    background:var(--accent);color:#04170f;transition:.15s;min-height:50px;
  }
  .btn-primary:active{background:var(--accent-dark);transform:scale(.98)}
  .btn-primary:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed;transform:none}
  [data-theme="light"] .btn-primary{color:#fff}

  /* Fin de lección */
  .finish{text-align:center;padding:30px 16px}
  .finish h2{font-size:1.5rem;margin-bottom:8px}
  .finish .stars{font-size:2.2rem;letter-spacing:4px;margin:16px 0}
  .finish .score{font-size:.95rem;color:var(--dim);margin-bottom:24px}
  .finish .actions{display:flex;gap:10px;max-width:340px;margin:0 auto}
  .finish .actions button{flex:1;padding:14px;border-radius:12px;font-size:.85rem;font-weight:700;min-height:48px}
  .btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
  .btn-ghost:active{background:var(--panel2)}

  /* ====== Gestión ====== */
  .manage h2{font-size:1.1rem;margin-bottom:14px}
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;
    margin-bottom:18px;
  }
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
  .stat .label{font-size:.63rem;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .stat .value{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .value.accent{color:var(--accent)}
  .stat .value.blue{color:var(--blue)}
  .stat .value.purple{color:var(--purple)}

  .stored-list{display:flex;flex-direction:column;gap:6px}
  .stored-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
  }
  .stored-item .ico{font-size:1.4rem;flex-shrink:0}
  .stored-item .info{flex:1;min-width:0}
  .stored-item .name{font-size:.83rem;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stored-item .meta{font-size:.63rem;color:var(--dim)}
  .stored-item .size{font-size:.7rem;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
  .stored-item .del{
    width:34px;height:34px;border-radius:9px;
    background:color-mix(in srgb, var(--bad) 12%, transparent);
    color:var(--bad);display:flex;align-items:center;justify-content:center;
    font-size:.9rem;transition:.15s;flex-shrink:0;
  }
  .stored-item .del:active{background:color-mix(in srgb, var(--bad) 25%, transparent);transform:scale(.94)}

  .danger-zone{margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
  .danger-zone button{
    width:100%;padding:13px;border-radius:12px;
    background:color-mix(in srgb, var(--bad) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--bad) 30%, transparent);
    color:var(--bad);font-size:.82rem;font-weight:600;min-height:48px;
  }
  .danger-zone button:active{background:color-mix(in srgb, var(--bad) 20%, transparent)}

  /* ====== Ajustes ====== */
  .settings-section{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;
  }
  .settings-section h3{
    font-size:.82rem;font-weight:700;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;
  }
  .settings-section .sub{font-size:.68rem;color:var(--dim);line-height:1.45;margin-bottom:12px}

  .field{margin-bottom:10px}
  .field label{font-size:.7rem;font-weight:600;color:var(--dim);display:block;margin-bottom:5px}
  .field input{
    width:100%;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:11px 13px;color:var(--text);
    font-size:.85rem;outline:none;transition:.15s;min-height:44px;
  }
  .field input:focus{border-color:var(--accent);background:var(--panel3)}

  .btn-row{display:flex;gap:8px;margin-top:10px}
  .btn-row button{
    flex:1;padding:11px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;
    transition:.15s;min-height:42px;
  }
  .btn-row button:active{transform:scale(.97)}
  .btn-save{background:var(--accent);color:#04170f}
  [data-theme="light"] .btn-save{color:#fff}
  .btn-del{background:color-mix(in srgb, var(--bad) 12%, transparent);color:var(--bad);border:1px solid color-mix(in srgb, var(--bad) 30%, transparent)}

  .key-status{
    display:inline-flex;align-items:center;gap:5px;
    font-size:.63rem;font-weight:600;padding:3px 8px;border-radius:99px;
    background:var(--panel2);color:var(--dim);border:1px solid var(--border);
    margin-left:auto;
  }
  .key-status.ok{background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
  .key-status.no{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn);border-color:color-mix(in srgb, var(--warn) 35%, transparent)}

  details.howto{
    margin-top:10px;background:var(--panel2);border:1px solid var(--border);
    border-radius:var(--radius-sm);overflow:hidden;
  }
  details.howto summary{
    padding:11px 13px;font-size:.73rem;font-weight:600;cursor:pointer;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
    color:var(--text);
  }
  details.howto summary::-webkit-details-marker{display:none}
  details.howto summary::after{content:"▾";color:var(--dim);transition:.2s}
  details.howto[open] summary::after{transform:rotate(180deg)}
  details.howto .body{
    padding:4px 13px 13px;font-size:.72rem;color:var(--dim);line-height:1.6;
  }
  details.howto ol{padding-left:18px;margin:4px 0 8px}
  details.howto ol li{margin-bottom:5px}
  details.howto code{
    background:var(--panel3);padding:1px 5px;border-radius:4px;
    font-family:ui-monospace,monospace;font-size:.68rem;color:var(--text);
  }
  details.howto a{
    color:var(--accent);text-decoration:none;font-weight:600;
  }

  .source-row{
    display:flex;align-items:center;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .source-row:last-child{border-bottom:none}
  .source-row .ico{font-size:1.1rem;flex-shrink:0;width:24px;text-align:center}
  .source-row .info{flex:1;min-width:0}
  .source-row .info .nm{font-size:.8rem;font-weight:600}
  .source-row .info .ds{font-size:.65rem;color:var(--dim);margin-top:1px}

  /* ====== Vacíos / toast ====== */
  .empty{
    text-align:center;padding:40px 20px;color:var(--dim);font-size:.85rem;
    line-height:1.5;
  }
  .empty .big{font-size:2.4rem;margin-bottom:10px;opacity:.5}

  .toast{
    position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0));left:50%;
    transform:translateX(-50%) translateY(80px);
    background:var(--panel3);border:1px solid var(--border2);color:var(--text);
    padding:11px 18px;border-radius:99px;font-size:.78rem;font-weight:500;
    box-shadow:var(--shadow);opacity:0;transition:.3s ease;
    z-index:100;pointer-events:none;max-width:calc(100vw - 32px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ====== Modal confirmación ====== */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center;

   2. UTILIDADES

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normalizar(s){
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
}
function similitud(a, b){
  a = normalizar(a); b = normalizar(b);
  if(!a || !b) return 0;
  if(a === b) return 1;
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = Math.min(
        dp[i-1][j] + 1, dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
    }
  }
  return 1 - dp[m][n] / Math.max(m, n);
}
function bytesFmt(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

/* =====================================================================
   5. INDEXEDDB
   ===================================================================== */
const DB_NAME = 'pt-curso';
const DB_VERSION = 1;
const STORE = 'lecciones';
let db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    if(!db) return resolve([]);
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(id){
  return new Promise((resolve, reject) => {
    if(!db) return resolve(null);
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(obj){
  return new Promise((resolve, reject) => {
    if(!db) return reject(new Error('Sin DB'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(obj);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    if(!db) return reject(new Error('Sin DB'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
function dbClear(){
  return new Promise((resolve, reject) => {
    if(!db) return reject(new Error('Sin DB'));
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

let vozPT = null;
function cargarVoz(){

       || null;
}
if(typeof speechSynthesis !== 'undefined'){

}
function hablarTTS(texto, onend){
  if(!texto || typeof speechSynthesis === 'undefined'){ if(onend) onend(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR';
  u.rate = 0.9;
  if(vozPT) u.voice = vozPT;
  if(onend) u.onend = onend;
  speechSynthesis.speak(u);
}

    const audio = new Audio(url);

    audio.play().then(resolve).catch(reject);
  });
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function reconocerVoz(){
  return new Promise((resolve, reject) => {
    if(!SR){ reject(new Error('no-soportado')); return; }
    const rec = new SR();
    rec.lang = 'pt-BR';
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    const alts = [];
    rec.onresult = e => {
      for(let i = 0; i < e.results[0].length; i++){
        alts.push(e.results[0][i].transcript);
      }
    };
    rec.onerror = e => reject(new Error(e.error || 'error'));
    rec.onend = () => resolve(alts);
    try{ rec.start(); }catch(err){ reject(err); }
  });
}

/* =====================================================================
   7. CONECTORES DE FUENTES
   ===================================================================== */
async function fetchJSON(url, timeoutMs = 5000){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, { signal: ctrl.signal });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(t);
  }
}

/* --- Tatoeba (frases paralelas, sin clave) --- */
async function fuenteTatoeba(seeds){
  const out = [];
  for(const seed of seeds){
    try{
      const url = `https://api.tatoeba.org/unstable/sentences?lang=por&trans=spa&q=${encodeURIComponent(seed)}&limit=3`;
      const data = await fetchJSON(url, 4000);
      const arr = Array.isArray(data?.data) ? data.data : [];
      for(const s of arr){
        if(!s.text || !Array.isArray(s.translations)) continue;
        const trad = [];
        const rec = x => {
          if(Array.isArray(x)) x.forEach(rec);
          else if(x && typeof x === 'object' && x.lang === 'spa' && x.text){
            trad.push(x.text);
          }
        };
        s.translations.forEach(rec);
        trad.slice(0, 1).forEach(es => {
          out.push({ pt: s.text, es, fuente: 'tatoeba' });
        });
      }
    }catch(_){}
  }
  return out;
}

/* --- Wiktionary (IPA, género, categoría; sin clave) --- */
async function fuenteWiktionary(palabra){
  const limpio = palabra.replace(/^(o|a|os|as)\s+/i, '').trim();
  if(!limpio) return null;
  try{
    const url = `https://pt.wiktionary.org/w/api.php?action=query&titles=${encodeURIComponent(limpio)}&prop=extracts&explaintext=1&format=json&origin=*&redirects=1`;
    const data = await fetchJSON(url, 4500);
    const pages = data?.query?.pages || {};
    const page = Object.values(pages)[0];
    if(!page || !page.extract) return null;
    const txt = page.extract.slice(0, 600);
    let genero = null;
    if(/\bmasculino\b/i.test(txt)) genero = 'm';
    else if(/\bfeminino\b/i.test(txt)) genero = 'f';
    let categoria = null;
    if(/\bsubstantivo\b/i.test(txt)) categoria = 'sustantivo';
    else if(/\bverbo\b/i.test(txt)) categoria = 'verbo';
    else if(/\badjetivo\b/i.test(txt)) categoria = 'adjetivo';
    else if(/\badvérbio\b/i.test(txt)) categoria = 'adverbio';
    let ipa = null;
    const ipaMatch = txt.match(/\/[^\/\n]{2,40}\//);
    if(ipaMatch) ipa = ipaMatch[0];
    return { genero, categoria, ipa, fuente: 'wiktionary' };
  }catch(_){ return null; }
}

/* --- Free Dictionary API (pt-BR, sin clave) --- */
async function fuenteFreeDict(palabra){
  const limpio = palabra.replace(/^(o|a|os|as)\s+/i, '').trim();
  if(!limpio) return null;
  try{
    const url = `https://api.dictionaryapi.dev/api/v2/entries/pt-BR/${encodeURIComponent(limpio)}`;
    const data = await fetchJSON(url, 4000);
    if(!Array.isArray(data) || !data[0]) return null;
    const entry = data[0];
    const meanings = entry.meanings || [];
    const m = meanings[0];
    if(!m) return null;
    let categoria = null;
    const pos = (m.partOfSpeech || '').toLowerCase();
    if(pos.includes('noun') || pos.includes('substantivo')) categoria = 'sustantivo';
    else if(pos.includes('verb') || pos.includes('verbo')) categoria = 'verbo';
    else if(pos.includes('adjective') || pos.includes('adjetivo')) categoria = 'adjetivo';
    else if(pos.includes('adverb') || pos.includes('adverbio')) categoria = 'adverbio';
    const def = m.definitions?.[0]?.definition || null;
    return { categoria, definicion: def, fuente: 'freedict' };
  }catch(_){ return null; }
}

/* --- Forvo (audio nativo, requiere clave) --- */
async function fuenteForvo(palabra){
  if(!tieneForvo()) return null;
  const limpio = palabra.replace(/^(o|a|os|as)\s+/i, '').trim();
  if(!limpio) return null;
  try{
    const url = `https://apifree.forvo.com/key/${encodeURIComponent(settings.forvoKey.trim())}/format/json/action/word-pronunciations/word/${encodeURIComponent(limpio)}/language/pt/order/rate-desc/limit/1`;
    const data = await fetchJSON(url, 4500);
    const items = data?.items;
    if(!Array.isArray(items) || !items[0]) return null;
    const it = items[0];
    return { audio: it.pathmp3 || null, fuente: 'forvo' };
  }catch(_){ return null; }
}

/* =====================================================================
   8. GENERADOR DE EJERCICIOS
   ===================================================================== */
function elegirDistractores(items, item, campo, n, rng){
  const otros = items.filter(x => x !== item && normalizar(x[campo]) !== normalizar(item[campo]));
  const orden = shuffle(otros, rng);
  const out = [];
  const vistos = new Set([normalizar(item[campo])]);
  for(const o of orden){
    const k = normalizar(o[campo]);
    if(vistos.has(k)) continue;
    vistos.add(k);
    out.push(o);
    if(out.length >= n) break;
  }
  return out;
}
function construirEjercicio(tipo, item, todos, rng){
  if(tipo === 'pt_to_es' || tipo === 'listen'){
    const d = elegirDistractores(todos, item, 'es', 3, rng);
    const opciones = shuffle([item.es, ...d.map(x => x.es)], rng);
    return { tipo, item, opciones, correcta: opciones.indexOf(item.es) };
  }
  if(tipo === 'es_to_pt'){
    const d = elegirDistractores(todos, item, 'pt', 3, rng);
    const opciones = shuffle([item.pt, ...d.map(x => x.pt)], rng);
    return { tipo, item, opciones, correcta: opciones.indexOf(item.pt) };
  }
  if(tipo === 'order'){
    const palabras = item.pt.split(/\s+/).filter(Boolean);
    const mezcladas = shuffle(palabras, rng);
    return { tipo, item, palabras: mezcladas, correcta: item.pt };
  }
  return { tipo, item };
}
function generarEjercicios(items, semilla){
  const rng = mulberry32(semilla);
  const orden = shuffle([...items], rng);
  const ciclo = ['pt_to_es','es_to_pt','listen','order','speak','pt_to_es','order','es_to_pt','speak','listen'];
  const out = [];
  orden.forEach((item, i) => {
    const tipo = ciclo[i % ciclo.length];
    out.push(construirEjercicio(tipo, item, orden, rng));
  });
  return out;
}

/* =====================================================================
   9. PIPELINE DE DESCARGA
   ===================================================================== */
async function descargarLeccion(id, onProgress){
  const leccion = buscarLeccion(id);
  if(!leccion) throw new Error('Lección no encontrada');

  onProgress(4, 'Preparando…');
  await sleep(150);

  onProgress(15, 'Consultando Tatoeba…');
  let externas = [];
  try{ externas = await fuenteTatoeba(leccion.seeds); }catch(_){}

  onProgress(35, 'Combinando fuentes…');
  await sleep(120);
  const mapa = new Map();
  leccion.fallback.forEach(x => {
    const k = normalizar(x.pt);
    if(!mapa.has(k)) mapa.set(k, { pt: x.pt, es: x.es, fuente: 'local' });
  });
  externas.forEach(x => {
    const k = normalizar(x.pt);
    if(!mapa.has(k)) mapa.set(k, { pt: x.pt, es: x.es, fuente: 'tatoeba' });
  });
  let items = [...mapa.values()].slice(0, 20);

  // Enriquecimiento con Wiktionary + FreeDict (paralelo, limitado)
  onProgress(50, 'Enriqueciendo vocabulario…');
  const enriquecidos = await Promise.all(items.map(async (it) => {
    const [wiki, dict] = await Promise.all([
      fuenteWiktionary(it.pt).catch(() => null),
      fuenteFreeDict(it.pt).catch(() => null)
    ]);
    const enriq = { ...it };
    if(wiki){
      if(wiki.genero) enriq.genero = wiki.genero;
      if(wiki.categoria) enriq.categoria = wiki.categoria;
      if(wiki.ipa) enriq.ipa = wiki.ipa;
    }
    if(dict){
      if(!enriq.categoria && dict.categoria) enriq.categoria = dict.categoria;
      if(dict.definicion) enriq.definicion = dict.definicion;
    }
    return enriq;
  }));
  items = enriquecidos;

  // Forvo (solo si hay clave, y solo para los primeros 6 items)
  if(tieneForvo()){
    onProgress(72, 'Buscando audio nativo…');
    const muestra = items.slice(0, 6);
    const audios = await Promise.all(muestra.map(async (it) => {
      const f = await fuenteForvo(it.pt).catch(() => null);
      return f?.audio || null;
    }));
    audios.forEach((url, i) => { if(url) items[i].audio = url; });
  }

  onProgress(86, 'Generando ejercicios…');
  await sleep(120);
  const semilla = id.split('').reduce((a, c) => a + c.charCodeAt(0), 0) + Date.now();
  const ejercicios = generarEjercicios(items, semilla);

  onProgress(96, 'Guardando…');
  await sleep(100);
  const conAudio = items.filter(x => x.audio).length;
  const conIpa = items.filter(x => x.ipa).length;
  const registro = {
    id,
    items,
    ejercicios,
    fuentes: externas.length ? 'Tatoeba + Wiktionary + FreeDict' + (tieneForvo() ? ' + Forvo' : '') : 'Local + Wiktionary',
    conAudio,
    conIpa,
    descargada: Date.now(),
    tamano: 0,
  };
  registro.tamano = bytesOf(registro);
  await dbPut(registro);

  onProgress(100, 'Lista');
  return registro;
}

function buscarLeccion(id){
  for(const u of CATALOG) for(const l of u.lessons) if(l.id === id) return l;
  return null;
}
function unidadDe(id){
  for(const u of CATALOG) if(u.lessons.some(l => l.id === id)) return u.unit;
  return '';
}

const app = document.getElementById('app');
const toastEl = document.getElementById('toast');
const storageMini = document.getElementById('storageMini');

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('visible'), 2400);
}

function confirmar(titulo, mensaje){
  return new Promise(resolve => {
    document.getElementById('modalTitle').textContent = titulo;
    document.getElementById('modalMsg').textContent = mensaje;
    const bg = document.getElementById('modalBg');
    bg.classList.add('visible');
    const cleanup = (val) => {
      bg.classList.remove('visible');
      document.getElementById('modalOk').onclick = null;
      document.getElementById('modalCancel').onclick = null;
      resolve(val);
    };
    document.getElementById('modalOk').onclick = () => cleanup(true);
    document.getElementById('modalCancel').onclick = () => cleanup(false);
  });
}

  if(state.view === 'catalog') renderCatalogo();

function renderCatalogo(){
  let html = '';

function renderCardLeccion(l, st){
  const ready = st.status === 'ready';
  const dl = st.status === 'downloading';
  const err = st.status === 'error';

  let actionHtml = '';
  if(ready){

    actionHtml = `<div style="flex:1">

      <div class="dl-status"><span>${esc(st.msg || 'Descargando…')}</span><span>${st.progress || 0}%</span></div>
    </div>`;
  } else if(err){
    actionHtml = `<button class="btn-retry" data-dl="${l.id}">↻ Reintentar</button>`;
  } else {
    actionHtml = `<button class="btn-download" data-dl="${l.id}">⬇ Descargar</button>`;
  }

  return `<article class="lesson-card ${ready ? 'ready' : ''}">
    <div class="lesson-top">
      <div class="lesson-icon">${l.icon}</div>
      <div class="lesson-meta">

}

function renderPlayer(){
  const l = state.lesson;
  if(!l){ state.view = 'catalog'; render(); return; }
  if(state.idx >= l.ejercicios.length){ renderFin(); return; }

  const ex = l.ejercicios[state.idx];
  const total = l.ejercicios.length;
  const pct = Math.round((state.idx / total) * 100);
  let cuerpo = '';

  const metaHtml = (it) => {
    const partes = [];
    if(it.categoria) partes.push(it.categoria);
    if(it.genero) partes.push(it.genero === 'm' ? 'masculino' : 'femenino');
    if(it.ipa) partes.push(it.ipa);
    return partes.length ? `<div class="ex-hint">${esc(partes.join(' · '))}</div>` : '';
  };

  if(ex.tipo === 'pt_to_es'){
    cuerpo = `
      <div class="ex-type">Traduce al español</div>
      <div class="ex-prompt"><span class="pt">${esc(ex.item.pt)}</span></div>

        `<button class="option ${state.seleccion === i ? 'selected' : ''} ${state.feedback ? (i === ex.correcta ? 'correct' : (state.seleccion === i ? 'wrong' : '')) : ''}" data-opt="${i}" ${state.feedback ? 'disabled' : ''}>${esc(o)}</button>`
      ).join('')}</div>`;
  } else if(ex.tipo === 'es_to_pt'){
    cuerpo = `
      <div class="ex-type">Traduce al portugués</div>
      <div class="ex-prompt">${esc(ex.item.es)}</div>
      <div class="options">${ex.opciones.map((o, i) =>
        `<button class="option ${state.seleccion === i ? 'selected' : ''} ${state.feedback ? (i === ex.correcta ? 'correct' : (state.seleccion === i ? 'wrong' : '')) : ''}" data-opt="${i}" ${state.feedback ? 'disabled' : ''}>${esc(o)}</button>`
      ).join('')}</div>`;
  } else if(ex.tipo === 'listen'){
    cuerpo = `
      <div class="ex-type">Escucha y elige</div>
      <button class="speaker-btn" id="replayBtn">🔊</button>
      ${ex.item.audio ? '<div class="ex-hint" style="text-align:center;margin-top:-14px;margin-bottom:14px">🎵 Audio nativo</div>' : ''}
      <div class="options">${ex.opciones.map((o, i) =>
        `<button class="option ${state.seleccion === i ? 'selected' : ''} ${state.feedback ? (i === ex.correcta ? 'correct' : (state.seleccion === i ? 'wrong' : '')) : ''}" data-opt="${i}" ${state.feedback ? 'disabled' : ''}>${esc(o)}</button>`
      ).join('')}</div>`;
  } else if(ex.tipo === 'order'){
    const usadas = new Set(state.orden);
    cuerpo = `
      <div class="ex-type">Ordena las palabras</div>
      <div class="ex-prompt">${esc(ex.item.es)}</div>
      <div class="order-answer ${state.orden.length ? 'filled' : ''}" id="orderAnswer">
        ${state.orden.map(i => `<button class="word-chip in-answer" data-remove="${i}" ${state.feedback ? 'disabled' : ''}>${esc(ex.palabras[i])}</button>`).join('')}
      </div>
      <div class="word-pool">
        ${ex.palabras.map((w, i) =>
          usadas.has(i) ? '' : `<button class="word-chip" data-add="${i}" ${state.feedback ? 'disabled' : ''}>${esc(w)}</button>`
        ).join('')}
      </div>`;
  } else if(ex.tipo === 'speak'){
    cuerpo = `
      <div class="ex-type">Pronuncia en portugués</div>
      <div class="ex-prompt"><span class="pt">${esc(ex.item.pt)}</span></div>
      ${metaHtml(ex.item)}

      </div>
      ${state.speakResult && state.speakResult.texto !== undefined ? `
        <div class="speak-result ${state.speakResult.clase}">
          <b>${state.speakResult.pct}% de coincidencia</b><br>

          Esperado: «${esc(ex.item.pt)}»
        </div>
      ` : ''}`;
  }

  let footer = '';
  if(state.feedback){
    footer = `
      <div class="feedback ${state.feedback.ok ? 'ok' : 'bad'}">${state.feedback.msg}</div>
      <button class="btn-primary" id="nextBtn">Continuar</button>`;
  } else {

    footer = `<button class="btn-primary" id="checkBtn" ${puede ? '' : 'disabled'}>Comprobar</button>`;

    <div class="player-head">

    </div>
    <div class="exercise">${cuerpo}</div>
    <div class="ex-footer">${footer}</div>
  `;

  if(ex.tipo === 'listen' && !state.feedback){
    setTimeout(() => reproducirAudio(ex.item.audio || '').catch(() => hablarTTS(ex.item.pt)), 220);
  }
}
function puedeComprobar(ex){
  if(ex.tipo === 'order') return state.orden.length === ex.palabras.length;
  if(ex.tipo === 'speak') return !!state.speakResult && state.speakResult.texto !== undefined;
  return state.seleccion !== null;
}
function renderFin(){
  const l = state.lesson;
  const total = l.ejercicios.length;
  const aciertos = state.aciertos;
  const pct = Math.round((aciertos / total) * 100);
  const estrellas = state.corazones >= 5 ? 3 : state.corazones >= 3 ? 2 : state.corazones >= 1 ? 1 : 0;
  const stars = '⭐'.repeat(estrellas) + '☆'.repeat(3 - estrellas);
  app.innerHTML = `
    <div class="finish">
      <h2>¡Lección completada!</h2>
      <div class="stars">${stars}</div>
      <div class="score">${aciertos} de ${total} correctas · ${pct}%</div>
      <div class="actions">
        <button class="btn-ghost" id="backCatalogBtn">Catálogo</button>
        <button class="btn-primary" id="retryBtn">Repetir</button>
      </div>

}

async function onDescargar(id){
  if(state.estados[id]?.status === 'downloading') return;
  state.estados[id] = { status:'downloading', progress:0, msg:'Iniciando…' };
  render();
  try{
    const reg = await descargarLeccion(id, (p, msg) => {
      state.estados[id] = { status:'downloading', progress:p, msg };
      const card = document.querySelector(`[data-dl="${id}"]`)?.closest('.lesson-card');
      if(card){
        const bar = card.querySelector('.dl-progress .bar');
        const st = card.querySelector('.dl-status');
        if(bar) bar.style.width = p + '%';
        if(st){ st.children[0].textContent = msg; st.children[1].textContent = p + '%'; }
      }
    });
    state.estados[id] = { status:'ready' };
    state.descargadas.add(id);
    state.totalBytes += reg.tamano || 0;
    const extras = [];
    if(reg.conIpa) extras.push(`${reg.conIpa} IPA`);
    if(reg.conAudio) extras.push(`${reg.conAudio} 🎵`);
    toast('✓ Descargada' + (extras.length ? ' · ' + extras.join(' · ') : ''));
  }catch(e){
    console.error(e);
    state.estados[id] = { status:'error' };
    toast('❌ Error al descargar');
  }
  render();
}
async function onJugar(id){
  const reg = await dbGet(id);
  if(!reg){ toast('⚠️ Descarga la lección primero'); return; }
  state.lesson = reg;
  state.idx = 0;
  state.corazones = 5;
  state.seleccion = null;
  state.orden = [];
  state.speakResult = null;
  state.feedback = null;
  state.aciertos = 0;
  state.view = 'player';
  render();
}
function onComprobar(){
  const l = state.lesson;
  const ex = l.ejercicios[state.idx];
  let ok = false;
  let msg = '';

  if(ex.tipo === 'pt_to_es' || ex.tipo === 'es_to_pt' || ex.tipo === 'listen'){
    ok = state.seleccion === ex.correcta;
    if(ok) msg = '✅ ¡Correcto!';
    else msg = `❌ Incorrecto. Respuesta: <b>${esc(ex.tipo === 'pt_to_es' || ex.tipo === 'listen' ? ex.item.es : ex.item.pt)}</b>`;
  } else if(ex.tipo === 'order'){
    const intento = state.orden.map(i => ex.palabras[i]).join(' ');
    ok = normalizar(intento) === normalizar(ex.correcta);
    if(ok) msg = '✅ ¡Perfecto!';
    else msg = `❌ Incorrecto. Respuesta: <b>${esc(ex.correcta)}</b>`;
  } else if(ex.tipo === 'speak'){
    const pct = state.speakResult?.pct ?? 0;
    ok = pct >= 70;
    if(ok) msg = `✅ ¡Buena pronunciación! (${pct}%)`;
    else msg = `🟡 Cerca (${pct}%). Objetivo: <b>${esc(ex.item.pt)}</b>`;
  }

  if(ok) state.aciertos++;
  else {
    if(ex.tipo === 'speak' && (state.speakResult?.pct ?? 0) >= 40){
      // No resta corazón en speak flojo pero no nulo
    } else {
      state.corazones = Math.max(0, state.corazones - 1);
    }
  }

  state.feedback = { ok, msg };
  if(state.corazones === 0){
    state.feedback.msg = '💔 Te has quedado sin corazones. Vuelve a intentarlo.';
  }
  render();
}
function onSiguiente(){
  state.idx++;
  state.seleccion = null;
  state.orden = [];
  state.speakResult = null;
  state.feedback = null;
  render();
}
async function onEliminar(id){
  if(!await confirmar('Eliminar lección', '¿Eliminar esta lección descargada? Podrás volver a descargarla cuando quieras.')) return;
  const reg = await dbGet(id);
  await dbDelete(id);
  state.descargadas.delete(id);
  state.totalBytes = Math.max(0, state.totalBytes - (reg?.tamano || 0));
  delete state.estados[id];
  toast('🗑 Lección eliminada');
  render();
}
async function onEliminarTodo(){
  if(!await confirmar('Eliminar todo', '¿Eliminar TODAS las lecciones descargadas?')) return;
  await dbClear();
  state.descargadas.clear();
  state.totalBytes = 0;
  state.estados = {};
  toast('🗑 Todo eliminado');
  render();
}

/* =====================================================================
   13. EVENTOS
   ===================================================================== */
document.getElementById('themeBtn').addEventListener('click', toggleTema);

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  state.view = tab.dataset.view;
  if(state.view !== 'player') state.lesson = null;
  render();
});

app.addEventListener('click', async (e) => {
  const t = e.target;

  // Navegación player
  if(t.id === 'backBtn' || t.id === 'backCatalogBtn'){
    state.view = 'catalog';
    state.lesson = null;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === 'catalog'));
    render();
    return;
  }
  if(t.id === 'retryBtn'){
    if(state.lesson) onJugar(state.lesson.id);
    return;
  }

  // Catálogo
  const dl = t.closest('[data-dl]');
  if(dl){ await onDescargar(dl.dataset.dl); return; }
  const play = t.closest('[data-play]');
  if(play){ await onJugar(play.dataset.play); return; }
  const del = t.closest('[data-del]');
  if(del){ await onEliminar(del.dataset.del); return; }
  if(t.id === 'clearAll'){ await onEliminarTodo(); return; }

  // Ajustes: tema
  if(t.id === 'setThemeDark'){ aplicarTema('dark'); try{localStorage.setItem(THEME_KEY,'dark')}catch(_){}; render(); return; }
  if(t.id === 'setThemeLight'){ aplicarTema('light'); try{localStorage.setItem(THEME_KEY,'light')}catch(_){}; render(); return; }

  // Ajustes: Forvo
  if(t.id === 'saveForvo'){
    const val = (document.getElementById('forvoInput')?.value || '').trim();
    settings.forvoKey = val;
    guardarSettings();
    toast(val ? '✓ Clave guardada' : '✓ Clave borrada');
    renderSettings();
    return;
  }
  if(t.id === 'delForvo'){
    settings.forvoKey = '';
    guardarSettings();
    toast('🗑 Clave borrada');
    renderSettings();
    return;
  }

  // Reproductor
  if(t.closest('#replayBtn')){
    const ex = state.lesson.ejercicios[state.idx];
    if(ex.item.audio){
      reproducirAudio(ex.item.audio).catch(() => hablarTTS(ex.item.pt));
    } else {
      hablarTTS(ex.item.pt);
    }
    return;
  }
  const opt = t.closest('[data-opt]');
  if(opt && !state.feedback){
    state.seleccion = parseInt(opt.dataset.opt, 10);
    render();
    return;
  }
  const add = t.closest('[data-add]');
  if(add && !state.feedback){
    state.orden.push(parseInt(add.dataset.add, 10));
    render();
    return;
  }
  const rm = t.closest('[data-remove]');
  if(rm && !state.feedback){
    const i = parseInt(rm.dataset.remove, 10);
    state.orden = state.orden.filter(x => x !== i);
    render();
    return;
  }
  if(t.closest('#micBtn')){
    const ex = state.lesson.ejercicios[state.idx];
    if(state.speakResult?.grabando) return;
    state.speakResult = { grabando: true };
    render();
    try{
      const alts = await reconocerVoz();
      let mejor = '', mejorPct = 0;
      alts.forEach(a => {
        const p = Math.round(similitud(a, ex.item.pt) * 100);
        if(p > mejorPct){ mejorPct = p; mejor = a; }
      });
      state.speakResult = {
        grabando: false,
        texto: mejor,
        pct: mejorPct,
        clase: mejorPct >= 70 ? 'ok' : mejorPct >= 45 ? 'mid' : 'bad',
      };
    }catch(err){
      state.speakResult = null;
      const m = String(err.message || err);
      if(m === 'no-soportado') toast('⚠️ Sin reconocimiento de voz en este navegador');
      else if(m === 'not-allowed') toast('🚫 Permiso de micrófono denegado');
      else if(m === 'no-speech') toast('🔇 No se detectó voz');
      else toast('⚠️ Error: ' + m);
    }
    render();
    return;
  }
  if(t.id === 'checkBtn'){ onComprobar(); return; }
  if(t.id === 'nextBtn'){ onSiguiente(); return; }
});

/* =====================================================================
   14. INIT
   ===================================================================== */
(async function init(){
  initTema();
  cargarSettings();
  try{
    db = await openDB();
    const todos = await dbGetAll();
    todos.forEach(l => {
      state.descargadas.add(l.id);
      state.estados[l.id] = { status:'ready' };
      state.totalBytes += l.tamano || 0;
    });
  }catch(e){
    console.warn('IndexedDB no disponible:', e);
  }
  render();
})();
</script>
