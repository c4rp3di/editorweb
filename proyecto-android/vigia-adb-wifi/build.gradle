plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vigia.adbwifi'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api project(':vigia-adb')

    // Cliente ADB con emparejamiento (SPAKE2) y TLS. Se publica en JitPack (primera descarga: puede tardar minutos).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.0'
    // TLS 1.3 con exportación de claves, necesario para el emparejamiento.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Genera el certificado autofirmado de la clave ADB. IMPORTANTE: misma familia (jdk15to18) y versión que usa
    // libadb-android; mezclarla con jdk18on duplica todas las clases de Bouncy Castle y el build falla.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
}
