plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vigia.adb'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api project(':vigia-core')

    // Shizuku: shell (ADB) o root sin PC. Verificadas en Maven Central (13.1.5).
    api 'dev.rikka.shizuku:api:13.1.5'
    api 'dev.rikka.shizuku:provider:13.1.5'
}
