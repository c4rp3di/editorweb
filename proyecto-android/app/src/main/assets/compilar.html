                '<br><small>' + esc((EVENTO_RUN[r.event] || r.event || '') + ' · ' + (r.head_branch || '') + ' · ' + String(r.head_sha || '').slice(0, 7) + ' · ' + ((r.actor && r.actor.login) || (r.triggering_actor && r.triggering_actor.login) || '') + ' · ' + fmtFecha(r.created_at) + (dur ? ' · ' + dur : '') + ' · id ' + r.id) + '</small>' +
                '<div class="botones"><button class="primario" data-a="run-ver" data-i="' + i + '">🧾 Registro</button><button data-a="abrir" data-u="' + esc(r.html_url || '') + '">🗗 GitHub</button></div></div>';
        }).join('');
        pantalla('actions', `
            <div class="bloque">
                <h2>📜 Ejecuciones de GitHub Actions</h2>
                <p><small>${esc(A.cfg.owner + '/' + A.cfg.repo)} · todas las ejecuciones del repositorio, se hayan lanzado desde Compila, Fusion o GitHub.</small></p>
                <div class="chips">${chips.map(c => '<button data-a="actions-filtro" data-v="' + c[0] + '"' + (A.filtro === c[0] ? ' class="sel"' : '') + '>' + c[1] + '</button>').join('')}</div>
                ${items || '<p class="suave">' + (A.runs.length ? 'Ninguna ejecución con este filtro.' : 'Este repositorio aún no tiene ejecuciones.') + '</p>'}
                ${A.fin ? '' : '<div class="botones"><button data-a="actions-mas">⬇️ Cargar más</button></div>'}
                ${botones(['inicio'])}
            </div>`, A.nombre);
    }

    // ---------- Informe de la compilación (errores, avisos y registro; copiar y guardar) ----------
    const RE_ANSI = /\x1b\[[0-9;]*[A-Za-z]/g;
    const limpiarLineaLog = l => l.replace(RE_ANSI, '').replace(/^\d{4}-\d{2}-\d{2}T[\d:.]+Z ?/, '');
    const rutaCorta = r => String(r || '').replace(/^.*\/proyecto-android\//, '').replace(/^file:\/\//, '');
    // Tipo de una línea de registro: 'e' error, 'w' aviso, 'g' grupo/paso, 'ok' éxito, null normal.
    function tipoLinea(l) {
        if (/^e: |##\[error\]|^\* What went wrong|AAPT: error|error: (resource|attribute|style|failed linking)|Manifest merger failed|Execution failed for task|Could not (resolve|find|download|get)|Unresolved reference|Duplicate class|OutOfMemoryError|FAILURE: Build failed|^BUILD FAILED/.test(l)) return 'e';
        if (/^w: |##\[warning\]|warning:|WARNING:|Deprecated Gradle features|is deprecated|will be removed/.test(l)) return 'w';
        if (/##\[group\]|^> Task |^Run /.test(l)) return 'g';
        if (/BUILD SUCCESSFUL|^✔|✔ /.test(l)) return 'ok';
        return null;
    }
    const spanLinea = (cls, txt) => cls ? '<span class="l-' + cls + '">' + esc(txt) + '</span>' : esc(txt);
    // Registro en bruto -> HTML con colores (cuenta cada línea tal cual; no altera el texto).
    function colorearLog(texto) { return String(texto).split('\n').map(l => { const c = limpiarLineaLog(l); return spanLinea(tipoLinea(c), c); }).join('\n'); }
    // Informe -> HTML con colores según la sección (el texto plano sigue siendo el mismo para copiar y guardar).
    function colorearInforme(texto) {
        let sec = 'c';
        return texto.split('\n').map((l, i) => {
            if (/^ERRORES\b/.test(l)) { sec = 'e'; return spanLinea('e', l).replace('l-e', 'l-e l-b'); }
            if (/^AVISOS\b/.test(l)) { sec = 'w'; return spanLinea('w', l).replace('l-w', 'l-w l-b'); }
            if (/^PASOS\b/.test(l)) { sec = 'p'; return spanLinea('g', l).replace('l-g', 'l-g l-b'); }
            if (/^REGISTRO\b/.test(l)) { sec = 'r'; return spanLinea('g', l).replace('l-g', 'l-g l-b'); }
            if (/^INFORME DE COMPILACIÓN/.test(l)) return '<span class="l-b">' + esc(l) + '</span>';
            if (sec === 'c') return /^Resultado: FALLÓ/.test(l) ? spanLinea('e', l) : /^Resultado: correcto/.test(l) ? spanLinea('ok', l) : /^Nota:/.test(l) ? spanLinea('w', l) : spanLinea('d', l);
            if (sec === 'e') return l.trim() ? spanLinea('e', l) : esc(l);
            if (sec === 'w') return l.trim() ? spanLinea('w', l) : esc(l);
            if (sec === 'p') return /✘/.test(l) ? spanLinea('e', l) : /✔/.test(l) ? spanLinea('ok', l) : spanLinea('d', l);
            return spanLinea(tipoLinea(limpiarLineaLog(l)), l);
        }).join('\n');
    }
    // Clasifica las líneas del registro de GitHub Actions / Gradle / Kotlin / AAPT en errores y avisos.
    function analizarLog(texto) {
        const lineas = String(texto || '').split(/\r?\n/).map(limpiarLineaLog);
        const errores = [], avisos = [], vistos = new Set();
        const add = (arr, o) => { const k = (arr === errores ? 'e|' : 'w|') + o.texto + '|' + (o.ruta || '') + (o.linea || ''); if (vistos.has(k)) return; vistos.add(k); arr.push(o); };
        for (let i = 0; i < lineas.length; i++) {
            const l = lineas[i]; if (!l.trim()) continue;
            let m;
            if (/^\* What went wrong:/.test(l)) {
                const bl = [];
                for (let j = i + 1; j < lineas.length && !/^\* Try:|^\* Get more help|^BUILD FAILED/.test(lineas[j]) && bl.length < 15; j++) if (lineas[j].trim()) bl.push(lineas[j].trim());
                add(errores, { n: i + 1, tipo: 'gradle', texto: bl.join('\n') });
                continue;
            }
            if ((m = /^([ew]): (?:file:\/\/)?(\S+?):(\d+):(\d+)\s*:?\s*(.*)$/.exec(l))) {
                add(m[1] === 'e' ? errores : avisos, { n: i + 1, tipo: 'kotlin', ruta: rutaCorta(m[2]), linea: Number(m[3]), texto: m[5] || l });
                continue;
            }
            if (/^e: /.test(l)) { add(errores, { n: i + 1, tipo: 'kotlin', texto: l.slice(3) }); continue; }
            if (/^w: /.test(l)) { add(avisos, { n: i + 1, tipo: 'kotlin', texto: l.slice(3) }); continue; }
            if (/##\[error\]/.test(l)) { add(errores, { n: i + 1, tipo: 'actions', texto: l.replace(/^.*##\[error\]/, '') }); continue; }
            if (/##\[warning\]/.test(l)) { add(avisos, { n: i + 1, tipo: 'actions', texto: l.replace(/^.*##\[warning\]/, '') }); continue; }
            if (/AAPT: error|error: (resource|attribute|style|failed linking)|Manifest merger failed|Execution failed for task|Could not (resolve|find|download|get)|Unresolved reference|Duplicate class|OutOfMemoryError|Task .* not found|Plugin .* was not found|No matching (variant|client)/.test(l)) { add(errores, { n: i + 1, tipo: 'build', texto: l.trim() }); continue; }
            if (/warning:|WARNING:|Deprecated Gradle features|is deprecated|will be removed/.test(l)) { add(avisos, { n: i + 1, tipo: 'build', texto: l.trim() }); continue; }
        }
        // Limpieza: lo ya contenido en un bloque «What went wrong» no se repite, y «Process completed» solo vale si no hay nada más.
        const bloques = errores.filter(e => e.tipo === 'gradle').map(e => e.texto);
        let util = errores.filter(e => !(e.tipo === 'build' && bloques.some(b => b.includes(e.texto))));
        if (util.some(e => !(e.tipo === 'actions' && /^Process completed/.test(e.texto)))) util = util.filter(e => !(e.tipo === 'actions' && /^Process completed/.test(e.texto)));
        return { errores: util, avisos, lineas };
    }
    function lineaInforme(e) {
        const ub = e.ruta ? e.ruta + (e.linea ? ':' + e.linea : '') + ' — ' : '';
        return '[' + e.tipo + '] ' + ub + e.texto + (e.n ? '  (línea ' + e.n + ' del registro)' : '');
    }
    // Texto del informe según la vista elegida. Es el mismo que se ve, se copia y se guarda.
    function textoInforme(R, vista) {
        const A = R.analisis;
        const cab = ['INFORME DE COMPILACIÓN', 'Proyecto: ' + (R.nombre || '—') + (R.paquete ? ' (' + R.paquete + ')' : ''), 'Resultado: ' + (R.ok ? 'correcto' : 'FALLÓ' + (R.conclusion ? ' (' + R.conclusion + ')' : '')) + (R.pasoFallido ? ' · paso: ' + R.pasoFallido : ''),
            'Ejecución: ' + (R.run && (R.run.html_url || R.run.id) || '—') + (R.run && R.run.created_at ? ' · ' + R.run.created_at : ''), 'Errores: ' + A.errores.length + ' · Avisos: ' + A.avisos.length, ''];
        if (R.nota) cab.push('Nota: ' + R.nota, '');
        const pasos = R.pasos.length ? ['PASOS', ...R.pasos.map(s => ' ' + (s.conclusion === 'success' ? '✔' : s.conclusion === 'failure' ? '✘' : s.conclusion === 'skipped' ? '–' : '·') + ' ' + s.name + (s.conclusion && s.conclusion !== 'success' ? ' [' + s.conclusion + ']' : '')), ''] : [];
        const bloque = (tit, arr) => arr.length ? [tit + ' (' + arr.length + ')', ...arr.map((e, i) => (i + 1) + '. ' + lineaInforme(e)), ''] : [tit + ': ninguno', ''];
        if (vista === 'errores') return cab.concat(bloque('ERRORES', A.errores)).join('\n');
        if (vista === 'avisos') return cab.concat(bloque('AVISOS', A.avisos)).join('\n');
        if (vista === 'registro') {
            const cola = A.lineas.slice(-400);
            return cab.concat(pasos, [A.lineas.length > 400 ? 'REGISTRO (últimas 400 de ' + A.lineas.length + ' líneas)' : 'REGISTRO', ''], cola).join('\n');
        }
        return cab.concat(pasos, bloque('ERRORES', A.errores), bloque('AVISOS', A.avisos)).join('\n');
    }

    // Descarga del registro de una ejecución (jobs, pasos, anotaciones y texto del job).
    async function cargarInforme(cfg, run, meta) {
        const R = Object.assign({ run, pasos: [], anotaciones: [], log: '', nota: '', ok: run.conclusion === 'success', conclusion: run.conclusion, pasoFallido: '' }, meta);
        let job = null;
        try {
            const rj = await contentsApiGitHub(cfg, 'actions/runs/' + run.id + '/jobs');
            if (rj.ok) { const dj = await rj.json(); const jobs = dj.jobs || []; job = jobs.find(j => j.conclusion === 'failure') || jobs[jobs.length - 1] || null; }
        } catch (_) {}
        if (job) {
            R.pasos = (job.steps || []).map(s => ({ name: s.name, conclusion: s.conclusion }));
            const pf = R.pasos.find(s => s.conclusion === 'failure'); R.pasoFallido = pf ? pf.name : '';
            try { const ra = await contentsApiGitHub(cfg, 'check-runs/' + job.id + '/annotations'); if (ra.ok) R.anotaciones = await ra.json(); } catch (_) {}
            try { const rl = await contentsApiGitHub(cfg, 'actions/jobs/' + job.id + '/logs'); if (rl.ok) R.log = (await rl.text()).slice(-1500000); else R.nota = 'GitHub no dejó leer el registro completo (HTTP ' + rl.status + '); se usan los pasos y las anotaciones.'; }
            catch (_) { R.nota = 'El navegador bloqueó la descarga del registro completo; se usan los pasos y las anotaciones. Ábrelo en GitHub para verlo entero.'; }
        } else R.nota = 'No se pudieron leer los trabajos de la ejecución.';
        R.analisis = analizarLog(R.log);
        if (!R.analisis.errores.length && Array.isArray(R.anotaciones)) {
            R.anotaciones.filter(a => /failure|error/i.test(a.annotation_level || '') && !/^Process completed/i.test(a.message || '')).slice(0, 30).forEach(a => R.analisis.errores.push({ tipo: 'anotación', ruta: a.path && !String(a.path).startsWith('.github') ? rutaCorta(a.path) : '', linea: a.start_line || 0, texto: String(a.message || a.title || '').split('\n')[0].slice(0, 400) }));
        }
        if (!R.analisis.avisos.length && Array.isArray(R.anotaciones)) {
            R.anotaciones.filter(a => /warning/i.test(a.annotation_level || '')).slice(0, 30).forEach(a => R.analisis.avisos.push({ tipo: 'anotación', ruta: a.path && !String(a.path).startsWith('.github') ? rutaCorta(a.path) : '', linea: a.start_line || 0, texto: String(a.message || a.title || '').split('\n')[0].slice(0, 400) }));
        }
        return R;
    }
    function renderInforme() {
        const R = C.informe; if (!R) { renderInicio(); return; }
        const A = R.analisis;
        const vista = R.vista || (A.errores.length ? 'errores' : 'todo');
        R.vista = vista;
        const chips = [['errores', '❌ Errores (' + A.errores.length + ')'], ['avisos', '⚠️ Avisos (' + A.avisos.length + ')'], ['todo', 'Resumen'], ['registro', '🧾 Registro']];
        const volver = R.volver === 'compilacion' ? ['recepcion', 'inicio'] : R.volver === 'actions' ? ['actions', 'inicio'] : ['inicio'];
        pantalla('informe', `
            <div class="bloque">
                <h2>${R.run && R.run.status && R.run.status !== 'completed' ? '⏳ Compilación en curso' : R.ok ? '✅ Compilación correcta' : '❌ La compilación falló'}</h2>
                <p><small>${esc(R.nombre || '')}${R.pasoFallido ? ' · paso «' + esc(R.pasoFallido) + '»' : ''}</small></p>
                ${R.mensaje && !R.ok ? '<p class="mal"><small>' + esc(R.mensaje) + '</small></p>' : ''}
                ${R.nota ? '<p class="aviso"><small>ℹ️ ' + esc(R.nota) + '</small></p>' : ''}
                <div class="chips">${chips.map(c => '<button data-a="inf-vista" data-v="' + c[0] + '"' + (vista === c[0] ? ' class="sel"' : '') + '>' + c[1] + '</button>').join('')}</div>
                <pre class="log" id="infTexto" style="max-height:52vh;">${colorearInforme(textoInforme(R, vista))}</pre>
                <div class="botones"><button class="primario" data-a="inf-copiar">📋 Copiar</button><button data-a="inf-guardar">💾 Guardar .txt</button>${R.run && R.run.html_url ? '<button data-a="abrir" data-u="' + esc(R.run.html_url) + '">🗗 Abrir en GitHub</button>' : ''}</div>
                ${botones(volver)}
            </div>`, R.nombre || '');
    }
    // Copia o guarda lo que se está viendo.
    async function copiarTexto(texto) {
        try { if (P()) P().copiarAlPortapapeles(texto); else await navigator.clipboard.writeText(texto); return true; } catch (_) { return false; }
    }
    function guardarTextoComoArchivo(nombre, texto) {
        const bytes = new TextEncoder().encode(texto);
        const puente = P();
        if (puente) {
            if (typeof puente.guardarFinTipo !== 'function') { mostrarToast('ℹ️ Para guardar el .txt recompila la app; mientras, usa «Copiar»'); return false; }
            puente.guardarInicio();
            const TROZO = 3 * 128 * 1024;
            for (let o = 0; o < bytes.length; o += TROZO) {
                const fin = Math.min(bytes.length, o + TROZO); let b = '';
                for (let q = o; q < fin; q += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(q, Math.min(fin, q + 0x8000)));
                puente.guardarTrozo(btoa(b));
            }
            puente.guardarFinTipo(nombre, 'text/plain');
            return true;
        }
        const url = URL.createObjectURL(new Blob([bytes], { type: 'text/plain' }));
        const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return true;
    }
    // Abre el informe de una ejecución. volver: 'compilacion' (tras un fallo) o 'inicio'.
    async function mostrarInforme(cfg, run, meta) {
        pantalla('informe-cargando', '<div class="bloque"><p>🔎 Leyendo el registro de la compilación…</p></div>', (meta && meta.nombre) || '');
        try { C.informe = await cargarInforme(cfg, run, meta || {}); renderInforme(); }
        catch (e) { pantalla('error', '<div class="bloque"><p class="mal">❌ No se pudo leer el registro: ' + esc(e && e.message ? e.message : e) + '</p>' + botones(['inicio']) + '</div>'); }
    }
    async function informeUltimaEjecucion(nombre) {
        const p = proyectos[nombre]; if (!p) return;
        const cfg = (p.repoDedicado && p.repoDedicado.repo) ? cfgGitHubDeProyecto(p) : cargarConfigGitHub();
        if (!cfg.token) cfg.token = cargarConfigGitHub().token;
        if (!configGitHubCompleta(cfg)) { mostrarToast('⚠️ Configura GitHub primero'); return; }
        try {
            const res = await contentsApiGitHub(cfg, 'actions/workflows/build-apk-nativo.yml/runs?per_page=1');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const d = await res.json(); const run = (d.workflow_runs || [])[0];
            if (!run) { mostrarToast('ℹ️ Aún no hay compilaciones en ese repositorio'); return; }
            await mostrarInforme(cfg, run, { nombre, paquete: p.paquete, volver: 'inicio' });
        } catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); }
    }

    // ---------- Icono de la app ----------
    // Abre el selector de imágenes del dispositivo. Devuelve el File o null si se cancela.
    function elegirImagen() {
        return new Promise(resolve => {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
            let hecho = false;
            const fin = f => { if (hecho) return; hecho = true; inp.remove(); resolve(f); };
            inp.addEventListener('change', () => fin((inp.files && inp.files[0]) || null));
            inp.addEventListener('cancel', () => fin(null));
            document.body.appendChild(inp);
            inp.click();
        });
    }
    async function iconoDesdeImagen(file) {
        if (!window.IconoAndroid) throw new Error('No se puede procesar imágenes aquí');
        return await window.IconoAndroid.desdeArchivo(file, 192); // PNG 192x192 en base64, igual que Fusion
    }
    // Si el repositorio ya tiene un icono (compilaciones anteriores, p. ej. hechas desde Fusion) lo recupera para no perderlo.
    async function recuperarIconoDelRepo(cfg) {
        try {
            const r = await contentsApiGitHub(cfg, 'contents/' + APK_NATIVO_CARPETA + '/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png?ref=' + encodeURIComponent(cfg.branch || 'main'));
            if (!r.ok) return null;
            const d = await r.json().catch(() => null);
            const b64 = d && d.content ? String(d.content).replace(/\s/g, '') : null;
            if (!b64) return null;
            await window.IconoAndroid.desdeBase64(b64, 192, false); // valida que sea una imagen usable
            return b64;
        } catch (_) { return null; }
    }
    // Antes de compilar: asegura que el proyecto tenga icono. Devuelve false si el usuario cancela.
    async function asegurarIcono(nombre, p, c, repoElegido, cfg0) {
        if (p.icono) return true;
        if (c.iconoBytes && window.IconoAndroid) {
            try { p.icono = await window.IconoAndroid.desdeBytes(c.iconoBytes, 192); mostrarToast('🖼 Icono tomado del ZIP'); return true; } catch (_) {}
        }
        let cfgRepo = cfg0;
        if (repoElegido === 'dedicado' || (p.repoDedicado && p.repoDedicado.repo)) cfgRepo = (p.repoDedicado && p.repoDedicado.repo) ? cfgGitHubDeProyecto(p) : Object.assign({}, cfg0, { repo: 'fusion-' + (slugPublicar(nombre) || 'proyecto') });
        if (!cfgRepo.token) cfgRepo.token = cfg0.token;
        const delRepo = await recuperarIconoDelRepo(cfgRepo);
        if (delRepo) { p.icono = delRepo; mostrarToast('🖼 Icono recuperado del repositorio'); return true; }
        if (p.sinIconoOk) return true;
        const r = await pedirEleccionHtml('🖼 Sin icono', '<p>«' + esc(nombre) + '» no tiene icono: ni el ZIP ni el repositorio traen uno, y el icono que tuvieras en Fusion no viaja en el ZIP.</p><p>Sin icono, la app saldrá con el icono genérico de Android. ¿Quieres elegir una imagen de tu dispositivo?</p>', ['🖼 Elegir imagen', 'Compilar sin icono']);
        if (r === null) return false;
        if (r === 1) { p.sinIconoOk = true; return true; }
        const f = await elegirImagen();
        if (!f) { mostrarToast('Sin imagen: no se compila. Vuelve a pulsar «Mezclar y compilar».'); return false; }
        try { p.icono = await iconoDesdeImagen(f); delete p.sinIconoOk; mostrarToast('🖼 Icono listo'); return true; }
        catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); return false; }
    }

    // ---------- Compilación ----------
    // Repo dedicado: reutiliza el de la ficha; si no, adopta fusion-<nombre> si ya contiene un proyecto Android
    // (conserva su firma); si no, lo crea y copia la firma del repositorio compartido.
    async function obtenerRepoDedicado(nombre, p, cfg0) {
        if (p.repoDedicado && p.repoDedicado.repo) return cfgGitHubDeProyecto(p);
        const nombreRepo = 'fusion-' + (slugPublicar(nombre) || 'proyecto');
        const cfgCand = Object.assign({}, cfg0, { repo: nombreRepo });
        const resProy = await contentsApiGitHub(cfgCand, 'contents/' + APK_NATIVO_CARPETA);
        if (resProy.ok) {
            const resRepo = await fetch('https://api.github.com/repos/' + encodeURIComponent(cfg0.owner) + '/' + encodeURIComponent(nombreRepo), { headers: cabecerasApiGitHub(cfg0) });
            const dRepo = await resRepo.json().catch(() => null);
            p.repoDedicado = { owner: cfg0.owner, repo: nombreRepo, branch: (dRepo && dRepo.default_branch) || 'main' };
            await guardarProyectos();
            mostrarToast('♻️ Se reutiliza el repositorio ' + nombreRepo + ' (con su firma)');
            return cfgGitHubDeProyecto(p);
        }
        mostrarToast('🆕 Creando repositorio dedicado…');
        p.repoDedicado = await crearRepoDedicadoGitHub(cfg0, nombre);
        await guardarProyectos();
        const cfg = cfgGitHubDeProyecto(p);
        mostrarToast('✅ Repositorio creado: ' + cfg.owner + '/' + cfg.repo);
        try {
            const ks = await copiarKeystoreARepoDedicado(cfg0, cfg);
            if (ks === 'copiado') mostrarToast('🔑 Firma copiada del repositorio compartido');
            else if (ks === 'sin-origen') mostrarToast('ℹ️ El repositorio compartido no tenía firma: se generará una nueva');
        } catch (eKs) {
            const seguir = await pedirConfirmacion('⚠️ No se pudo copiar la firma', 'No se pudo copiar el keystore (' + (eKs && eKs.message ? eKs.message : eKs) + '). Si sigues, se generará una firma nueva y tendrás que desinstalar la versión anterior de la app una vez. ¿Compilar de todos modos?');
            if (!seguir) throw new Error('Compilación cancelada: no se copió la firma.');
        }
        return cfg;
    }

    // Si el ZIP no trae algún archivo de Gradle, se toma el del repositorio para no sobrescribirlo con la plantilla
    // y para poder inyectar el versionCode. Si el repo ya compiló antes, el versionCode siguiente es mayor que el suyo.
    async function completarDesdeRepo(cfg, p) {
        const mapa = [
            ['build.gradle', APK_NATIVO_CARPETA + '/app/build.gradle'],
            ['_raiz/settings.gradle', APK_NATIVO_CARPETA + '/settings.gradle'],
            ['_raiz/build.gradle', APK_NATIVO_CARPETA + '/build.gradle'],
            ['_raiz/gradle.properties', APK_NATIVO_CARPETA + '/gradle.properties']
        ];
        for (const [clave, ruta] of mapa) {
            const res = await contentsApiGitHub(cfg, 'contents/' + ruta.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
            if (!res.ok) continue;
            const d = await res.json().catch(() => null);
            if (!d || !d.content) continue;
            const texto = zipImpDecodificarTexto(base64ABytes(String(d.content).replace(/\s/g, '')));
            if (clave === 'build.gradle') {
                const vc = /versionCode\s*=?\s*(\d+)/.exec(texto);
                if (vc && Number(vc[1]) >= (p.versionCode || 1)) p.versionCode = Number(vc[1]) + 1;
            }
            if (!Object.prototype.hasOwnProperty.call(p.archivos, clave)) p.archivos[clave] = texto;
        }
    }

    async function compilar(params) {
        if (C.compilando) return;
        const c = C.construido; if (!c) return;
        const sel = params ? params.sel : (document.querySelector('input[name="dest"]:checked') || {}).value;
        const repoElegido = params ? params.repoElegido : ((document.querySelector('input[name="repo"]:checked') || {}).value || 'dedicado');
        const cfg0 = cargarConfigGitHub();
        if (!configGitHubCompleta(cfg0)) { mostrarToast('⚠️ Configura GitHub primero'); renderAjustes(); return; }
        if (!c.paquete) { mostrarToast('⚠️ No se pudo detectar el paquete del ZIP'); return; }

        let nombre = sel;
        if (!sel) { mostrarToast('⚠️ Elige un proyecto de destino'); return; }
        if (sel === '__nuevo__') {
            nombre = (($('inNombre') || {}).value || '').trim();
            if (!nombre) { mostrarToast('⚠️ Escribe un nombre para el proyecto'); return; }
            let base = nombre, n = 2; while (proyectos[nombre]) nombre = base + ' ' + n++;
        }
        const pr = prefs(); pr.repoPorDefecto = repoElegido; guardarPrefs(pr);
        if (pr.confirmar && !params) {
            const existe = sel !== '__nuevo__';
            const r = await pedirEleccionHtml('Mezclar y compilar',
                '<p>' + (existe ? 'Se añadirá el ZIP «' + esc(C.nombreZip) + '» a <b>' + esc(nombre) + '</b>.' : 'Se creará el proyecto <b>' + esc(nombre) + '</b> con «' + esc(C.nombreZip) + '».') + '</p>' +
                '<p>' + (repoElegido === 'dedicado' ? 'Repositorio dedicado: lo que no esté en el ZIP se conserva.' : 'Repositorio compartido: se sustituye todo proyecto-android/.') + '</p>', ['🔀 Mezclar y compilar']);
            if (r === null) return;
        }

        C.ultimaOrden = { sel: nombre, repoElegido }; // para «Reintentar»
        const existente = sel !== '__nuevo__';
        const p = existente ? proyectos[nombre] : { tipo: 'android', paquete: c.paquete, nombreApp: c.nombreApp, versionCode: Math.max(1, Number(c.versionCode) || 1), ultimaVersion: 'v1.0', fecha: '', creado: new Date().toISOString() };
        p.archivos = JSON.parse(JSON.stringify(c.archivos));
        p.nombreApp = p.nombreApp || c.nombreApp;
        p.versionCode = Math.max(Number(p.versionCode) || 1, existente ? 1 : Number(c.versionCode) || 1);
        p.fecha = new Date().toISOString().slice(0, 10);
        if (!(await asegurarIcono(nombre, p, c, repoElegido, cfg0))) return;
        if (!existente) proyectos[nombre] = p;
        await guardarProyectos();

        C.compilando = true;
        const FASES = ['Preparar repositorio', 'Subir archivos', 'Compilar en GitHub', 'Terminado'];
        let faseActual = 0, t0 = Date.now(), temporizador = null, seguimiento = null, lanzado = false; // lanzado: el workflow ya se disparó en GitHub
        const tInicio = Date.now();
        const pintarFases = () => {
            const e = $('fases'); if (!e) return;
            const seg = Math.floor((Date.now() - t0) / 1000);
            e.innerHTML = FASES.map((f, k) => '<div class="fase ' + (k < faseActual ? 'hecha' : k === faseActual ? 'activa' : '') + '">' + (k < faseActual ? '✅' : k === faseActual ? '⏳' : '⚪') + ' ' + f + (k === faseActual && k === 2 ? ' <small>· ' + Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0') + '</small>' : '') + '</div>').join('');
        };
        const irAFase = k => { if (k > faseActual) { faseActual = k; t0 = Date.now(); } pintarFases(); };
        pantalla('progreso', '<div class="bloque"><h2>⚙️ Compilando «' + esc(nombre) + '»</h2><div id="fases"></div><p class="suave"><small>Puedes salir de la app: la compilación sigue en GitHub.</small></p></div>' +
            '<div class="bloque" id="vivoBloque" style="display:none"><h2>⚙️ Pasos en GitHub</h2><div class="pasos" id="vivoPasos"></div></div>' +
            '<details class="col" id="vivoDet" style="display:none"><summary><span class="t">🧾 <b>Registro en directo</b></span><small id="vivoResumen">esperando…</small></summary><div class="cuerpo"><pre class="log" id="vivoLog" style="max-height:48vh;"></pre></div></details>' +
            '<details class="col"><summary><span class="t">🧾 Registro de Compila</span></summary><div class="cuerpo"><pre class="log" id="log"></pre></div></details>', nombre);
        pintarFases();
        temporizador = setInterval(pintarFases, 1000);
        C.logLineas = [];
        logHook = msg => {
            C.logLineas.push('[' + new Date().toLocaleTimeString('es-ES') + '] ' + msg);
            const l = $('log'); if (l) { l.textContent += '[' + new Date().toLocaleTimeString('es-ES') + '] ' + msg + '\n'; l.scrollTop = l.scrollHeight; }
            if (/Compilando…/.test(String(msg))) lanzado = true;
            if (/Compilando…|Workflow creado/.test(String(msg))) {
                irAFase(2);
                if (!seguimiento) { seguimiento = iniciarSeguimiento(cfg, tInicio); if ($('vivoBloque')) $('vivoBloque').style.display = ''; if ($('vivoDet')) $('vivoDet').style.display = ''; }
            }
        };
        let cfg = cfg0;
        try {
            let aditivo = false;
            if (repoElegido === 'dedicado' || (p.repoDedicado && p.repoDedicado.repo)) {
                cfg = await obtenerRepoDedicado(nombre, p, cfg0);
                aditivo = true;
                logHook('Repositorio dedicado: ' + cfg.owner + '/' + cfg.repo);
                await completarDesdeRepo(cfg, p);
            } else {
                logHook('Repositorio compartido: ' + cfg.owner + '/' + cfg.repo);
            }
            irAFase(1);
            p.ultimaVersion = 'v' + p.versionCode + '.0';
            let intento = 0, resultado = null;
            for (;;) {
                try { resultado = await compilarProyectoAndroidDirecto(nombre, p, cfg, { sinLimpiar: aditivo }); break; }
                catch (e1) {
                    // Antes de lanzar la compilación en GitHub (subida de archivos) un fallo puntual se reintenta solo; ya con la compilación
                    // en marcha no se vuelve a lanzar (se retomaría la espera, ver abajo).
                    if ((e1 && e1.runFallido) || lanzado || ++intento > 2) throw e1;
                    logHook('⚠️ ' + (e1 && e1.message ? e1.message : e1) + ' — reintento ' + intento + '/2 en 4 s (solo se vuelve a subir lo que falte)');
                    await esperar(4000);
                }
            }
            const url = resultado.url;
            clearInterval(temporizador); if (seguimiento) seguimiento.stop = true;
            C.compilando = false; logHook = null;
            C.construido = null; C.destinoPreferido = null;
            p.ultimaCompilacion = { fecha: new Date().toISOString(), ok: true, url, vc: p.versionCode };
            await guardarProyectos(); guardarUltimoLog(nombre, true);
            mostrarResultadoOk(nombre, p, url);
            return;
        } catch (e) {
            console.error(e);
            clearInterval(temporizador); if (seguimiento) seguimiento.stop = true;
            C.compilando = false; logHook = null;
            const msg = String(e && e.message ? e.message : e);
            const run = e && e.runFallido;
            const ctx = { cfg, nombre, p, tInicio };
            p.ultimaCompilacion = { fecha: new Date().toISOString(), ok: false, error: msg.slice(0, 200) };
            await guardarProyectos(); guardarUltimoLog(nombre, false, msg);
            if (run && run.id) { await mostrarInforme(cfg, run, { nombre, paquete: p.paquete, mensaje: msg, volver: 'compilacion' }); return; }
            // Conexión perdida con la compilación ya lanzada en GitHub: se retoma la espera en vez de dar la compilación por fallida.
            if (esErrorDeRed(e) && lanzado) { await reanudarEspera(ctx); return; }
            pantallaErrorCompilacion(nombre, msg, esErrorDeRed(e));
        }
    }

    function guardarUltimoLog(nombre, ok, error) {
        try { localStorage.setItem('compilaUltimoLog', JSON.stringify({ nombre, ok, fecha: new Date().toISOString(), error: error || '', texto: (C.logLineas || []).join('\n').slice(-60000) })); } catch (_) {}
    }
    function mostrarResultadoOk(nombre, p, url) {
        pantalla('resultado', `<div class="bloque"><h2>✅ APK listo</h2>
            <p><small>${esc(nombre)} · versionCode ${esc(p.versionCode)}</small></p>
            <p><a href="#" data-a="abrir" data-u="${esc(url)}">${esc(url)}</a></p>
            <div class="botones">
                <button class="primario" data-a="abrir" data-u="${esc(url)}">⬇️ Descargar APK</button>
                <button data-a="copiar" data-u="${esc(url)}">📋 Copiar</button>
                <button data-a="compartir" data-u="${esc(url)}">📤 Compartir</button>
                <button data-a="registro-ultimo" data-n="${esc(nombre)}">🧾 Ver registro</button>
                <button data-a="inicio">↩️ Inicio</button>
                <button data-a="cerrar">✕ Cerrar app</button>
            </div></div>`, nombre);
    }
    // Pantalla de error cuando la compilación falla sin que GitHub llegue a ejecutarla (subida, conexión, permisos…).
    function pantallaErrorCompilacion(nombre, msg, red) {
        pantalla('error', '<div class="bloque"><p class="mal">❌ ' + esc(msg) + '</p>' +
            (red ? '<p class="aviso"><small>Parece un problema de conexión (sin datos, cambio de red o la app estuvo en segundo plano). «Reintentar» solo vuelve a subir lo que falte; si GitHub ya había lanzado la compilación, se retoma.</small></p>' : '') +
            '<div class="botones"><button class="primario" data-a="reintentar">🔄 Reintentar</button><button data-a="registro-compila">🧾 Ver informe</button></div>' +
            botones(['recepcion', 'inicio']) + '</div>', nombre);
    }
    // Retoma la espera de una compilación ya lanzada (tras perder la conexión): busca su ejecución y espera a que termine.
    async function reanudarEspera(ctx) {
        C.reanudar = ctx; C.compilando = true;
        pantalla('progreso', '<div class="bloque"><h2>📶 Reconectando con GitHub</h2><p id="reanuda" class="suave">Buscando la ejecución…</p><p class="suave"><small>La compilación sigue en GitHub aunque la conexión se cortara.</small></p></div>', ctx.nombre);
        const { cfg, nombre, p, tInicio } = ctx;
        const t0 = Date.now(); let run = null;
        while (Date.now() - t0 < 25 * 60000) {
            try {
                if (!run) {
                    const r = await contentsApiGitHub(cfg, 'actions/workflows/build-apk-nativo.yml/runs?per_page=5');
                    if (r.ok) { const d = await r.json(); run = ((d.workflow_runs || []).filter(x => new Date(x.created_at).getTime() >= tInicio - 5000))[0] || null; }
                } else if (run.status !== 'completed') {
                    const r = await contentsApiGitHub(cfg, 'actions/runs/' + run.id);
                    if (r.ok) run = await r.json();
                }
                if (run && run.status === 'completed') break;
                if ($('reanuda')) $('reanuda').textContent = run ? 'GitHub sigue compilando… (' + (run.status === 'in_progress' ? 'en curso' : run.status) + ')' : 'Buscando la ejecución…';
            } catch (_) { if ($('reanuda')) $('reanuda').textContent = 'Sin conexión… reintentando'; }
            await esperar(6000);
        }
        C.compilando = false;
        if (!run || run.status !== 'completed') {
            pantalla('error', '<div class="bloque"><p class="mal">⚠️ No se pudo comprobar cómo terminó la compilación.</p><p class="suave"><small>Puede que siga en marcha o que la conexión no haya vuelto.</small></p><div class="botones"><button class="primario" data-a="reanudar">🔄 Verificar de nuevo</button><button data-a="registro-ultimo" data-n="' + esc(nombre) + '">🧾 Ver última ejecución</button></div>' + botones(['inicio']) + '</div>', nombre);
            return;
        }
        if (run.conclusion === 'success') {
            try {
                const url = await buscarUltimoApkPublicado(cfg);
                p.versionCode = (p.versionCode || 1) + 1;
                p.ultimaCompilacion = { fecha: new Date().toISOString(), ok: true, url, vc: p.versionCode - 1 };
                C.construido = null; C.destinoPreferido = null; C.reanudar = null;
                await guardarProyectos(); guardarUltimoLog(nombre, true);
                mostrarResultadoOk(nombre, p, url);
            } catch (e) {
                pantalla('error', '<div class="bloque"><p class="mal">⚠️ La compilación terminó bien pero no se pudo leer el APK: ' + esc(e && e.message ? e.message : e) + '</p><div class="botones"><button class="primario" data-a="reanudar">🔄 Verificar de nuevo</button></div>' + botones(['inicio']) + '</div>', nombre);
            }
        } else {
            p.ultimaCompilacion = { fecha: new Date().toISOString(), ok: false, error: 'La compilación falló (' + run.conclusion + ')' };
            await guardarProyectos();
            await mostrarInforme(cfg, run, { nombre, paquete: p.paquete, mensaje: 'La compilación falló (' + run.conclusion + ').', volver: 'compilacion' });
        }
    }
    // Informe con el registro propio de Compila del último intento (subida, errores de red, etc.).
    function informeLogCompila() {
        let L = null; try { L = JSON.parse(localStorage.getItem('compilaUltimoLog') || 'null'); } catch (_) {}
        if (!L) { mostrarToast('ℹ️ Aún no hay ningún intento registrado'); return; }
        const lineas = String(L.texto || '').split('\n');
        const errores = L.error ? [{ tipo: 'compila', texto: L.error }] : [];
        const avisos = lineas.filter(x => /⚠️|reintento|Sin conexión/.test(x)).map((x, i) => ({ tipo: 'compila', n: i + 1, texto: x }));
        C.informe = { nombre: L.nombre, ok: !!L.ok, conclusion: L.ok ? 'success' : 'error', pasos: [], anotaciones: [], run: null, nota: 'Registro propio de Compila (' + fmtFecha(L.fecha) + '), no el de GitHub Actions.', analisis: { errores, avisos, lineas }, volver: 'inicio', vista: 'registro' };
        renderInforme();
    }

    async function probarToken() {
        const cfg = guardarCamposGitHub();
        const est = $('ghEstado');
        est.textContent = '⏳ Comprobando…';
        try {
            const r = await fetch('https://api.github.com/user', { headers: cabecerasApiGitHub(cfg) });
            const d = await r.json().catch(() => null);
            if (!r.ok) { est.className = 'mal'; est.textContent = '❌ ' + ((d && d.message) || ('HTTP ' + r.status)); return; }
            let txt = '✅ Token válido (' + d.login + ')';
            if (cfg.repo) {
                const rr = await contentsApiGitHub(cfg, 'contents/');
                txt += rr.ok ? ' · repositorio accesible' : ' · ⚠️ no se pudo leer ' + cfg.owner + '/' + cfg.repo + ' (HTTP ' + rr.status + ')';
            }
            est.className = 'ok'; est.textContent = txt;
        } catch (e) { est.className = 'mal'; est.textContent = '❌ ' + (e && e.message ? e.message : e); }
    }
    function guardarCamposGitHub() {
        const cfg = { owner: $('gOwner').value.trim(), repo: $('gRepo').value.trim(), branch: ($('gBranch').value.trim() || 'main'), token: $('gToken').value.trim() };
        guardarConfigGitHub(cfg);
        return cfg;
    }

    // ---------- Eventos ----------
    document.addEventListener('click', async ev => {
        const menuAbierto = $('ordenMenu');
        if (menuAbierto && !menuAbierto.hidden && !(ev.target.closest && ev.target.closest('.menu'))) menuAbierto.hidden = true;
        const el = ev.target.closest && ev.target.closest('[data-a]');
        if (!el) return;
        ev.preventDefault();
        const a = el.dataset.a, u = el.dataset.u || '', i = el.dataset.i;
        if (a === 'filtro') { guardarUI({ filtro: el.dataset.v }); document.querySelectorAll('.chips button').forEach(b => b.classList.toggle('sel', b.dataset.v === el.dataset.v)); pintarLista(); }
        else if (a === 'registro-ultimo') informeUltimaEjecucion(el.dataset.n);
        else if (a === 'registro-compila') informeLogCompila();
        else if (a === 'actions') abrirActions(el.dataset.n);
        else if (a === 'actions-volver') renderActions();
        else if (a === 'actions-filtro') { if (C.actions) { C.actions.filtro = el.dataset.v; renderActions(); } }
        else if (a === 'actions-mas') { if (C.actions && !C.actions.fin) { el.disabled = true; el.textContent = '⏳ Cargando…'; try { await cargarMasRuns(); } catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); } renderActions(); } }
        else if (a === 'run-ver') { const A = C.actions; const r = A && A.runs[Number(el.dataset.i)]; if (r) mostrarInforme(A.cfg, r, { nombre: A.nombre, paquete: A.paquete, volver: 'actions' }); }
        else if (a === 'reintentar') { if (C.construido && C.ultimaOrden) compilar({ sel: C.ultimaOrden.sel, repoElegido: C.ultimaOrden.repoElegido }); else renderInicio(); }
        else if (a === 'reanudar') { if (C.reanudar) reanudarEspera(C.reanudar); else mostrarToast('ℹ️ Usa «Registro de la última compilación» en el proyecto'); }
        else if (a === 'inf-vista') { if (C.informe) { C.informe.vista = el.dataset.v; renderInforme(); } }
        else if (a === 'inf-copiar') { if (C.informe) { const tx = textoInforme(C.informe, C.informe.vista); const ok = await copiarTexto(tx.length > 400000 ? tx.slice(-400000) : tx); mostrarToast(ok ? '📋 Informe copiado' + (tx.length > 400000 ? ' (últimos 400 000 caracteres)' : '') : '⚠️ No se pudo copiar'); } }
        else if (a === 'inf-guardar') { if (C.informe) { const R = C.informe; guardarTextoComoArchivo('informe-' + (slugPublicar(R.nombre) || 'compilacion') + '-' + R.vista + '-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.txt', textoInforme(R, R.vista)); } }
        else if (a === 'icono-proy') {
            const n = el.dataset.n; const p = proyectos[n]; if (!p) return;
            const f = await elegirImagen(); if (!f) return;
            try { p.icono = await iconoDesdeImagen(f); delete p.sinIconoOk; await guardarProyectos(); C.abiertos.add(n); renderInicio(); const det = document.querySelector('details[data-sec="proys"]'); if (det) det.open = true; mostrarToast('🖼 Icono guardado: se usará en la próxima compilación'); }
            catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); }
        }
        else if (a === 'buscar-gh') buscarProyectosEnGitHub();
        else if (a === 'orden-menu') { const m = $('ordenMenu'); if (m) m.hidden = !m.hidden; }
        else if (a === 'orden-op') { guardarUI({ orden: el.dataset.v }); $('ordenMenu').hidden = true; $('ordenBtn').firstChild.textContent = ORDENES[el.dataset.v]; document.querySelectorAll('#ordenMenu button').forEach(b => b.classList.toggle('sel', b.dataset.v === el.dataset.v)); pintarLista(); }
        else if (a === 'orden-inv') { const inv = !ui().inv; guardarUI({ inv }); el.textContent = inv ? '⬆️' : '⬇️'; pintarLista(); }
        else if (a === 'inicio') { if (!C.compilando) renderInicio(); }
        else if (a === 'elegir-zip') $('selectorZip').click();
        else if (a === 'recepcion') renderRecepcion();
        else if (a === 'compilar') compilar();
        else if (a === 'cerrar' && P()) P().cerrarApp();
        else if (a === 'abrir' && u) { if (P()) P().abrirUrl(u); else window.open(u, '_blank'); }
        else if (a === 'copiar' && u) { if (P()) P().copiarAlPortapapeles(u); else navigator.clipboard && navigator.clipboard.writeText(u); mostrarToast('📋 Enlace copiado'); }
        else if (a === 'compartir' && u && P()) P().compartirUrl(u);
        else if (a === 'guardar-gh') { guardarCamposGitHub(); mostrarToast('💾 GitHub guardado'); }
        else if (a === 'probar-gh') probarToken();
        else if (a === 'ver-token') { const t = $('gToken'); const oculto = t.type === 'password'; t.type = oculto ? 'text' : 'password'; el.textContent = oculto ? '🙈 Ocultar token' : '👁 Mostrar token'; }
        else if (a === 'importar-fusion') $('selectorFusion').click();
        else if (a === 'guardar-prefs') { const rr = document.querySelector('input[name="pRepo"]:checked'); guardarPrefs({ confirmar: $('pConfirmar').checked, repoPorDefecto: rr ? rr.value : 'dedicado' }); mostrarToast('💾 Preferencias guardadas'); }
        else if (a === 'elegir-html' && P()) P().elegirHtml();
        else if (a === 'restaurar-html' && P()) { if (await pedirConfirmacion('↩️ Restaurar', 'Se volverá a la pantalla incluida en la app y se recargará. Tus proyectos y el token no se tocan. ¿Continuar?')) P().restaurarHtml(); }
        else if (a === 'abrir-repo') { const p = proyectos[el.dataset.n]; if (p && p.repoDedicado) { const url = 'https://github.com/' + p.repoDedicado.owner + '/' + p.repoDedicado.repo; if (P()) P().abrirUrl(url); else window.open(url, '_blank'); } }
        else if (a === 'exportar-fusion') { const n = el.dataset.n; if (n) exportarAFusion(n); }
        else if (a === 'apk-ultimo') { const n = el.dataset.n; mostrarToast('⏳ Buscando el último APK…'); try { const url = await urlUltimoApk(n); if (P()) P().abrirUrl(url); else window.open(url, '_blank'); } catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); } }
        else if (a === 'compilar-proy') { C.destinoPreferido = el.dataset.n; $('selectorZip').click(); }
        else if (a === 'olvidar') { const n = el.dataset.n; if (n && await pedirConfirmacion('Olvidar proyecto', '«' + n + '» se quitará de esta app. No se toca GitHub. ¿Continuar?')) { delete proyectos[n]; C.abiertos.delete(n); await guardarProyectos(); renderInicio(); } }
        else if (a === 'borrar-repo') {
            const p = proyectos[el.dataset.n]; if (!p || !p.repoDedicado) return;
            const rd = p.repoDedicado;
            const escrito = await pedirTexto('🗑 Borrar repositorio', 'Se borrará DEFINITIVAMENTE ' + rd.owner + '/' + rd.repo + ' de GitHub, con su código, releases y APK. No se puede deshacer. Para confirmar, escribe su nombre exacto:', '');
            if (escrito === null) return;
            if (String(escrito).trim() !== rd.repo) { mostrarToast('⚠️ El nombre no coincide: no se borró nada'); return; }
            try { mostrarToast('🗑 Borrando…'); await borrarRepoDedicadoGitHub(rd); delete p.repoDedicado; await guardarProyectos(); mostrarToast('✅ Repositorio borrado'); }
            catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); }
            renderInicio();
        }
    });
    // Paneles plegables: proyectos abiertos, releases bajo demanda y ajustes como acordeón (se recuerda el último abierto).
    document.addEventListener('toggle', ev => {
        const d = ev.target; if (!d || !d.matches || !d.matches('details')) return;
        if (d.dataset.sec === 'proys') guardarUI({ secProys: d.open });
        if (d.dataset.proy !== undefined) { if (d.open) C.abiertos.add(d.dataset.proy); else C.abiertos.delete(d.dataset.proy); }
        if (d.dataset.rel !== undefined && d.open) cargarReleases(d);
        if (d.dataset.aj !== undefined) {
            if (d.open) { document.querySelectorAll('details[data-aj]').forEach(o => { if (o !== d && o.open) o.open = false; }); guardarUI({ ajustes: [d.dataset.aj] }); }
            else if (ui().ajustes[0] === d.dataset.aj) guardarUI({ ajustes: [] });
        }
    }, true);
    $('btnAjustes').addEventListener('click', () => { if (C.compilando) return; if (C.pantalla === 'ajustes') (C.construido ? renderRecepcion() : renderInicio()); else renderAjustes(); });
    // Exporta el código actual del repositorio dedicado de un proyecto como .zip (disposición de Android Studio)
    // para importarlo en Fusion con «Importar .zip» como versión nueva del proyecto (no pisa nada).
    async function exportarAFusion(nombre) {
        const p = proyectos[nombre];
        if (!p || !p.repoDedicado || !p.repoDedicado.repo) { mostrarToast('⚠️ Solo se puede exportar un proyecto con repositorio dedicado'); return; }
        const cfg = cfgGitHubDeProyecto(p);
        const tokenGlobal = cargarConfigGitHub().token;
        if (!cfg.token) cfg.token = tokenGlobal;
        try {
            mostrarToast('⏳ Leyendo el repositorio…');
            const lista = (await listarArchivosEnRepo(cfg, APK_NATIVO_CARPETA))
                .filter(f => !/^(apk-build\/|build\/|\.gradle\/|local\.properties$)/.test(f.relativa) && !/(^|\/)build\//.test(f.relativa));
            if (!lista.length) { mostrarToast('⚠️ El repositorio no tiene proyecto-android'); return; }
            if (lista.truncado) mostrarToast('⚠️ El árbol del repositorio es muy grande: puede faltar algún archivo');
            const entradas = new Array(lista.length);
            let sig = 0, hechos = 0;
            const trabajador = async () => {
                while (sig < lista.length) {
                    const k = sig++;
                    const res = await contentsApiGitHub(cfg, 'git/blobs/' + lista[k].sha);
                    if (!res.ok) throw new Error('No se pudo leer ' + lista[k].relativa + ' (HTTP ' + res.status + ')');
                    const d = await res.json();
                    entradas[k] = { nombre: lista[k].relativa, bytes: base64ABytes(String(d.content || '').replace(/\s/g, '')) };
                    hechos++;
                }
            };
            await Promise.all([trabajador(), trabajador(), trabajador(), trabajador(), trabajador()]);
            const zip = new Uint8Array(await crearZip(entradas).arrayBuffer());
            const eg = entradas.find(e => e.nombre === 'app/build.gradle');
            const vcm = eg && /versionCode\s*=?\s*(\d+)/.exec(new TextDecoder().decode(eg.bytes));
            const nombreZip = (slugPublicar(nombre) || 'proyecto') + '-vc' + (vcm ? vcm[1] : (p.versionCode || 1)) + '-para-fusion.zip';
            const puente = P();
            if (puente && typeof puente.guardarInicio === 'function') {
                puente.guardarInicio();
                const TROZO = 3 * 128 * 1024; // múltiplo de 3 para no romper el base64
                for (let o = 0; o < zip.length; o += TROZO) {
                    let b = ''; const fin = Math.min(zip.length, o + TROZO);
                    for (let q = o; q < fin; q += 0x8000) b += String.fromCharCode.apply(null, zip.subarray(q, Math.min(fin, q + 0x8000)));
                    puente.guardarTrozo(btoa(b));
                }
                puente.guardarFin(nombreZip);
            } else {
                const url = URL.createObjectURL(new Blob([zip], { type: 'application/zip' }));
                const a = document.createElement('a'); a.href = url; a.download = nombreZip;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            }
            mostrarToast('📦 ZIP listo (' + hechos + ' archivos). Impórtalo en Fusion con «Importar .zip»');
        } catch (e) {
            mostrarToast('❌ ' + (e && e.message ? e.message : e));
        }
    }
    window.__compilaPruebas = { zipImpLeerArchivo, zipImpConstruirAndroid }; // solo para las pruebas automáticas
    // Importa el archivo «Exportar para Compila» de Fusion: datos de GitHub + fichas de proyectos Android.
    async function importarDeFusion(file) {
        try {
            const d = JSON.parse(await file.text());
            if (!d || d.tipo !== 'fusion-para-compila' || typeof d.proyectos !== 'object') { mostrarToast('⚠️ Ese archivo no es una exportación de Fusion para Compila'); return; }
            const nombres = Object.keys(d.proyectos || {});
            const traeToken = !!(d.github && d.github.token);
            const ok = await pedirConfirmacion('📥 Importar desde Fusion', 'Se importarán ' + nombres.length + ' proyecto(s) Android' + (traeToken ? ' y los datos de GitHub (usuario ' + (d.github.owner || '?') + ', con su token), que sustituyen a los actuales' : ' (el archivo no trae token)') + '. ¿Continuar?');
            if (!ok) return;
            let nuevos = 0, actualizados = 0;
            nombres.forEach(n => {
                const f = d.proyectos[n] || {};
                const previo = proyectos[n];
                const ficha = { tipo: 'android', paquete: String(f.paquete || (previo && previo.paquete) || ''), nombreApp: String(f.nombreApp || (previo && previo.nombreApp) || n), versionCode: Math.max(Number(f.versionCode) || 1, previo ? Number(previo.versionCode) || 1 : 1), ultimaVersion: String(f.ultimaVersion || (previo && previo.ultimaVersion) || 'v1.0'), fecha: String(f.fecha || '') };
                const rd = f.repoDedicado || (previo && previo.repoDedicado);
                if (rd && rd.repo) ficha.repoDedicado = { owner: String(rd.owner || (d.github && d.github.owner) || ''), repo: String(rd.repo), branch: String(rd.branch || 'main') };
                if (previo) actualizados++; else nuevos++;
                proyectos[n] = ficha;
            });
            await guardarProyectos();
            if (traeToken) guardarConfigGitHub({ owner: String(d.github.owner || ''), repo: String(d.github.repo || ''), branch: String(d.github.branch || 'main'), token: String(d.github.token) });
            mostrarToast('✅ Importado: ' + nuevos + ' nuevo(s), ' + actualizados + ' actualizado(s)' + (traeToken ? ' · GitHub configurado' : ''));
            renderAjustes();
        } catch (e) { mostrarToast('❌ No se pudo leer el archivo: ' + (e && e.message ? e.message : e)); }
    }
    $('selectorFusion').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importarDeFusion(f); });
    $('selectorZip').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) procesarZip(f); });

    // Llamadas desde la app nativa
    async function comprobarZipPendiente() {
        if (!P() || C.compilando) return;
        let hay = false; try { hay = !!P().hayZip(); } catch (_) {}
        if (!hay) return;
        try { const f = await leerZipDelPuente(); try { P().zipConsumido(); } catch (_) {} await procesarZip(f); }
        catch (e) { pantalla('error', '<div class="bloque"><p class="mal">❌ No se pudo recibir el ZIP: ' + esc(e && e.message ? e.message : e) + '</p>' + botones(['inicio', 'elegir']) + '</div>'); }
    }
    window.__compilaNuevoZip = comprobarZipPendiente;
    window.__compilaAtras = function () {
        if (C.compilando) { mostrarToast('⏳ Compilando… sigue en GitHub aunque salgas'); return false; }
        if ($('modal').classList.contains('v')) return true;
        if (C.pantalla === 'ajustes') { C.construido ? renderRecepcion() : renderInicio(); return true; }
        if (C.pantalla !== 'inicio') { renderInicio(); return true; }
        return false;
    };

    cargarRegistro();
    renderInicio();
    try { if (window.AndroidCompila && typeof window.AndroidCompila.listo === 'function') window.AndroidCompila.listo(); } catch (_) {}
    await comprobarZipPendiente();
})();
