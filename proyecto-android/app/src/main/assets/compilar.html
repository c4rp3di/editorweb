          # settings.gradle vacío (Gradle exige una raíz de build) y se copia al proyecto;
          # la compilación la hace ya el Gradle fijado por el wrapper.
          WRAP_TMP="$(mktemp -d)"
          touch "$WRAP_TMP/settings.gradle"
          (cd "$WRAP_TMP" && gradle wrapper --gradle-version ${versionTexto} --no-daemon)
          mkdir -p gradle
          cp -r "$WRAP_TMP/gradle/." gradle/
          cp "$WRAP_TMP/gradlew" "$WRAP_TMP/gradlew.bat" .
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Crear release con el APK
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          APP_NAME: \${{ github.event.inputs.app_name }}
          APP_PACKAGE: \${{ github.event.inputs.app_package }}
          APP_VERSION_NAME: \${{ github.event.inputs.app_version_name }}
        run: |
          set -e
          TAG="apk-nativo-$(date +%s)"
          APK_PATH=$(find . -name "*.apk" | head -n1)
          SAFE_NAME=$(echo "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_')
          if [ -n "$APP_VERSION_NAME" ]; then
            APK_FINAL="$SAFE_NAME-$APP_VERSION_NAME.apk"
          else
            APK_FINAL="$SAFE_NAME.apk"
          fi
          cp "$APK_PATH" "$APK_FINAL"
          gh release create "$TAG" "$APK_FINAL" --title "APK nativo: $APP_NAME" --notes "Paquete: $APP_PACKAGE. Compilado desde el código Kotlin/XML/Gradle generado por el editor."
      - name: Guardar caché de Gradle
        if: always() && steps.cache-gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-\${{ runner.os }}-\${{ hashFiles('proyecto-android/build.gradle', 'proyecto-android/settings.gradle', 'proyecto-android/gradle.properties') }}
      - name: Guardar caché del build de la app
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            proyecto-android/app/build
            proyecto-android/.gradle
          key: appbuild-\${{ runner.os }}-\${{ github.event.inputs.app_package }}-\${{ github.run_id }}
`;
        return yaml.replace(/\\\$\{\{/g, '${{');
    }

    function plantillaSettingsGradle() {
        return `pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "app"
include ':app'
`;
    }

    function plantillaBuildGradleRaiz() {
        // El plugin KSP se declara siempre aquí (con apply false) aunque el
        // proyecto no use Room: el build.gradle raíz no vive en `archivos`
        // (lo genera subirArchivosProyectoAndroid en B5, fuera del alcance de
        // cualquier generador), así que no hay manera de que un generador lo
        // toque condicionalmente. Declararlo sin aplicarlo es inofensivo.
        return `plugins {
    id 'com.android.application' version '8.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'com.google.devtools.ksp' version '1.9.24-1.0.20' apply false
}
`;
    }

    const REGEX_WF_PERMITIDO = /^_wf\/[\w.-]+\.(yml|yaml)$/;

    function esRutaEspecialDeProyecto(ruta) {
        return typeof ruta === 'string' && (ruta.startsWith('_raiz/') || ruta.startsWith('_wf/'));
    }

    function rutaRepoDeArchivoEspecial(ruta) {
        if (typeof ruta !== 'string') return null;
        if (ruta.startsWith('_raiz/')) return ruta.slice('_raiz/'.length);
        if (ruta.startsWith('_wf/')) return '.github/workflows/' + ruta.slice('_wf/'.length);
        return null;
    }

    const REGEX_RAIZ_EXTRA = /^_raiz\/(?!(?:settings\.gradle|build\.gradle|gradle\.properties)$)/;

    const REGEX_WF_EXTRA = /^_wf\//;

    function plantillaGradleProperties() {
        return `org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
`;
    }

    const RUTAS_RAIZ_DEL_MODULO = ['build.gradle', 'proguard-rules.pro'];

    const PREFIJO_MODULO_EXTRA = /^module:([a-zA-Z][\w-]*)\//;

    function mapearArchivoProyectoAndroid(ruta, paquete) {
        // v8.2 · Las rutas especiales (_raiz/*, _wf/*) no son del módulo app: se suben a su carpeta
        // propia. Antes _raiz/x caía en el catch-all (app/src/main/_raiz/x), error silencioso que solo
        // no se veía porque los llamadores las filtraban antes. Se devuelve la ruta sin tocar.
        if (esRutaEspecialDeProyecto(ruta)) return ruta;
        let modulo = 'app';
        const m = PREFIJO_MODULO_EXTRA.exec(ruta);
        if (m) { modulo = m[1]; ruta = ruta.slice(m[0].length); }

        const prefijoApp = modulo + '/src/main';
        const prefijoJava = prefijoApp + '/java/' + paquete.split('.').join('/');
        if (ruta === 'AndroidManifest.xml') return prefijoApp + '/AndroidManifest.xml';
        if (RUTAS_RAIZ_DEL_MODULO.includes(ruta)) return modulo + '/' + ruta;
        if (ruta.startsWith('res/')) return prefijoApp + '/' + ruta;
        if (ruta.startsWith('assets/')) return prefijoApp + '/' + ruta;
        if (ruta.endsWith('.kt')) {
            // Los .kt de primer nivel (MainActivity.kt) van al paquete raíz; los
            // que están en subcarpetas (ui/, data/...) conservan su subcarpeta.
            const partes = ruta.split('/');
            if (partes.length === 1) return prefijoJava + '/' + ruta;
            const subcarpeta = partes.slice(0, -1).join('/');
            return prefijoJava + '/' + subcarpeta + '/' + partes[partes.length - 1];
        }
        // v10 · Catch-all generalizado: cualquier ruta no reconocida va a
        // <modulo>/src/main/<ruta> tal cual, que es donde Gradle la busca por
        // convención en el 95% de los casos (jni/, jniLibs/, python/,
        // aidl/, proto/...). Antes de v10 esto devolvía 'app/' + ruta siempre.
        return prefijoApp + '/' + ruta;
    }

    async function asegurarWorkflowApkNativo(cfg, proyecto) {
        return asegurarWorkflowGenerico(cfg, 'build-apk-nativo.yml', () => generarWorkflowApkNativo(proyecto), proyecto, '_wf/build-apk-nativo.yml',
            { anade: 'Añade workflow de compilación nativa', actualiza: 'Actualiza workflow de compilación nativa' });
    }

    async function asegurarWorkflowGenerico(cfg, workflowFile, contenidoYaml, proyecto, wfPropioKey, mensajes) {
        const propio = proyecto && proyecto.archivos && proyecto.archivos[wfPropioKey];
        const yaml = propio ? String(proyecto.archivos[wfPropioKey]) : (typeof contenidoYaml === 'function' ? contenidoYaml() : contenidoYaml);
        const rutaRepo = '.github/workflows/' + workflowFile;
        const marca = propio ? { delUsuario: true } : {};
        const msgAnade = propio ? 'Añade workflow del usuario ' + workflowFile : ((mensajes && mensajes.anade) || 'Añade workflow ' + workflowFile);
        const msgActualiza = propio ? 'Actualiza workflow del usuario ' + workflowFile : ((mensajes && mensajes.actualiza) || 'Actualiza workflow ' + workflowFile);
        const resGet = await contentsApiGitHub(cfg, 'contents/' + rutaRepo + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
        // No existe todavía → se crea. Se sabe que no existe: se salta el GET del sha.
        if (resGet.status === 404) {
            await subirArchivoTextoGitHub(cfg, rutaRepo, yaml, msgAnade, null);
            return Object.assign({ creado: true, cambiado: true }, marca);
        }
        if (!resGet.ok) {
            const errData = await resGet.json().catch(() => null);
            throw new Error((errData && errData.message) || ('HTTP ' + resGet.status));
        }
        const dataGet = await resGet.json().catch(() => null);
        const shaRemoto = dataGet && dataGet.sha ? dataGet.sha : undefined;
        let shaLocal = null;
        try { shaLocal = await sha1BlobGit(new TextEncoder().encode(yaml)); } catch (_) {}
        // Idéntico: NO se sube (sin commit, sin re-registro del workflow, sin espera).
        if (shaRemoto && shaLocal && shaRemoto === shaLocal) return Object.assign({ creado: false, cambiado: false }, marca);
        await subirArchivoTextoGitHub(cfg, rutaRepo, yaml, msgActualiza, shaRemoto);
        return Object.assign({ creado: false, cambiado: true }, marca);
    }

    async function listarArchivosEnRepo(cfg, carpeta) {
        const res = await contentsApiGitHub(cfg, 'git/trees/' + encodeURIComponent(cfg.branch || 'main') + '?recursive=1');
        if (!res.ok) {
            const errData = await res.json().catch(() => null);
            throw new Error((errData && errData.message) || ('HTTP ' + res.status));
        }
        const data = await res.json();
        const prefijo = carpeta.replace(/\/+$/, '') + '/';
        const lista = (data.tree || [])
            .filter(n => n.type === 'blob' && n.path.startsWith(prefijo))
            .map(n => ({ path: n.path, sha: n.sha, relativa: n.path.slice(prefijo.length) }));
        lista.truncado = !!data.truncated; // si el árbol viene truncado, la AUSENCIA de un archivo no prueba que no exista
        return lista;
    }

    async function eliminarArchivoGitHub(cfg, path, sha, mensaje) {
        const rutaContents = 'contents/' + path.split('/').map(encodeURIComponent).join('/');
        const res = await contentsApiGitHub(cfg, rutaContents, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: mensaje, sha, branch: cfg.branch || 'main' })
        });
        if (!res.ok) {
            const errData = await res.json().catch(() => null);
            throw new Error((errData && errData.message) || ('HTTP ' + res.status));
        }
    }

    async function limpiarHuerfanosProyectoAndroid(cfg, p) {
        const esperados = new Set([
            'settings.gradle',
            'build.gradle',
            'gradle.properties',
            // B11.B v2: el keystore debug lo genera y sube el propio workflow
            // (APK_NATIVO_WORKFLOW_YAML), no p.archivos, así que nunca aparece
            // aquí por sí solo. Sin esta excepción, cada compilación lo trata
            // como huérfano y lo borra justo antes de subir/disparar el
            // workflow, obligando a regenerarlo (con otra firma) en cada build
            // y rompiendo la actualización sin desinstalar que era el objetivo
            // de B11.B v2.
            'apk-build/debug.keystore',
            ...((p.icono && window.IconoAndroid) ? window.IconoAndroid.rutasRelativas() : []),
            ...Object.keys(p.archivos || {}).map(r => mapearArchivoProyectoAndroid(r, p.paquete)),
            // v10.2 · los extras de raíz (README, docs/, scripts/, modules-src/...) se suben a proyecto-android/<ruta>: no son huérfanos
            ...Object.keys(p.archivos || {}).filter(r => REGEX_RAIZ_EXTRA.test(r)).map(r => r.slice('_raiz/'.length))
        ]);
        const existentes = await listarArchivosEnRepo(cfg, APK_NATIVO_CARPETA);
        const huerfanos = existentes.filter(archivo => !esperados.has(archivo.relativa));
        if (huerfanos.length > 10) {
            const ok = await pedirConfirmacion(
                '⚠️ Se van a borrar ' + huerfanos.length + ' archivos',
                'proyecto-android/ tiene ' + huerfanos.length + ' archivos que ya no coinciden con este proyecto y se borrarían del repo antes de compilar. Si has editado proyecto-android/ directamente en GitHub, esos cambios se perderán. ¿Continuar?'
            );
            if (!ok) throw new Error('Compilación cancelada: se canceló el borrado de archivos huérfanos.');
        }
        for (const archivo of huerfanos) {
            await eliminarArchivoGitHub(cfg, archivo.path, archivo.sha, 'Limpia ' + archivo.relativa);
        }
        // Se devuelve lo que queda en el repo (con sus SHA) para que la subida solo toque lo que cambió.
        const borrados = new Set(huerfanos.map(h => h.path));
        const restantes = existentes.filter(e => !borrados.has(e.path));
        restantes.truncado = existentes.truncado;
        return restantes;
    }

    async function subirIconosProyectoAndroid(cfg, proyecto, existentes) {
        const U = window.IconoAndroid;
        if (!proyecto.icono || !U) return 0;
        const shas = new Map((existentes || []).map(e => [e.path, e.sha]));
        let subidos = 0;
        for (const dens of Object.keys(U.DENSIDADES)) {
            for (const [nombre, redondo] of U.VARIANTES) {
                const b64 = await U.desdeBase64(proyecto.icono, U.DENSIDADES[dens], redondo);
                const rutaRepo = APK_NATIVO_CARPETA + '/' + U.rutaRelativa(dens, nombre);
                const shaRemoto = shas.get(rutaRepo);
                if (shaRemoto) {
                    try {
                        const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
                        if ((await sha1BlobGit(bytes)) === shaRemoto) continue; // sin cambios
                    } catch (_) {}
                }
                await subirArchivoBinarioGitHub(cfg, rutaRepo, b64, 'Icono ' + dens + ': ' + nombre);
                subidos++;
            }
        }
        return subidos;
    }

    function inyectarVersionEnBuildGradle(contenido, versionCode, versionName) {
        return (contenido || '')
            .replace(/versionCode\s+\d+/, 'versionCode ' + versionCode)
            .replace(/versionName\s+"[^"]*"/, 'versionName "' + versionName + '"');
    }

    function inyectarFirmaEnBuildGradle(contenido) {
        if (!contenido) return contenido;
        if (/signingConfigs\s*\{/.test(contenido)) return contenido;
        if (!/android\s*\{/.test(contenido)) return contenido;
        const bloqueFirma = '\n'
            + '    signingConfigs {\n'
            + '        debug {\n'
            + '            storeFile file("../apk-build/debug.keystore")\n'
            + '            storePassword "android"\n'
            + '            keyAlias "androiddebugkey"\n'
            + '            keyPassword "android"\n'
            + '        }\n'
            + '    }\n'
            + '    buildTypes {\n'
            + '        debug {\n'
            + '            signingConfig signingConfigs.debug\n'
            + '        }\n'
            + '    }\n';
        return contenido.replace(/android\s*\{/, function (coincidencia) {
            return coincidencia + bloqueFirma;
        });
    }

    function inyectarCacheEnGradleProperties(contenido) {
        if (!contenido) return contenido;
        const lineas = String(contenido).split('\n');
        const ya = clave => lineas.some(l =>
            new RegExp('^\\s*' + clave.replace(/\./g, '\\.') + '\\s*=').test(l));
        const nuevas = [];
        if (!ya('org.gradle.caching'))  nuevas.push('org.gradle.caching=true');
        if (!ya('org.gradle.parallel')) nuevas.push('org.gradle.parallel=true');
        if (!nuevas.length) return contenido;
        return String(contenido).replace(/\s*$/, '') + '\n' + nuevas.join('\n') + '\n';
    }

    async function subirArchivosProyectoAndroid(cfg, proyecto, existentes) {
        const paquete = proyecto.paquete;
        const archivos = proyecto.archivos || {};
        const versionCode = proyecto.versionCode || 1;
        const versionName = proyecto.ultimaVersion || 'v1.0';

        // B8: los tres archivos raíz viven en p.archivos con prefijo _raiz/
        // (editables desde el panel/consola). Si un proyecto no los tiene
        // todavía (creado antes de B8), se cae a la plantilla, igual que
        // hacía este código antes de B8.
        const raiz = [
            { ruta: 'settings.gradle', clave: '_raiz/settings.gradle', contenido: plantillaSettingsGradle() },
            { ruta: 'build.gradle', clave: '_raiz/build.gradle', contenido: plantillaBuildGradleRaiz() },
            { ruta: 'gradle.properties', clave: '_raiz/gradle.properties', contenido: plantillaGradleProperties() }
        ];
        const trabajos = [];
        for (const a of raiz) {
            let contenido = Object.prototype.hasOwnProperty.call(archivos, a.clave) ? archivos[a.clave] : a.contenido;
            if (a.ruta === 'gradle.properties') contenido = inyectarCacheEnGradleProperties(contenido);
            trabajos.push({ rutaRepo: APK_NATIVO_CARPETA + '/' + a.ruta, contenido });
        }
        // v8.2 · _wf/*.yml → .github/workflows/ (raíz del repo, fuera de proyecto-android/).
        // 'externo' marca que su sha remoto NO está en el listado de proyecto-android/.
        for (const rutaWf of Object.keys(archivos).filter(r => REGEX_WF_PERMITIDO.test(r))) {
            trabajos.push({ rutaRepo: rutaRepoDeArchivoEspecial(rutaWf), contenido: archivos[rutaWf] || '', binario: false, externo: true });
        }
        const rutas = Object.keys(archivos).filter(r => !esRutaEspecialDeProyecto(r));
        for (const rutaInterna of rutas) {
            let contenido = archivos[rutaInterna] || '';
            // v10 · Un archivo guardado como data URL (ver esArchivoBinarioGuardadoComoDataUrl,
            // junto a dataUrlABytes) se sube tal cual, en base64, con subirArchivoBinarioGitHub
            // más abajo — nunca pasa por la inyección de versión/firma/icono de abajo, que son
            // cosas de texto (AndroidManifest.xml / build.gradle nunca se guardan como data URL).
            const binario = esArchivoBinarioGuardadoComoDataUrl(rutaInterna, contenido);
            if (!binario) {
                if (rutaInterna === 'AndroidManifest.xml' && proyecto.icono && window.IconoAndroid) {
                    contenido = window.IconoAndroid.inyectarEnManifest(contenido);
                }
                if (rutaInterna === 'build.gradle') {
                    contenido = inyectarVersionEnBuildGradle(contenido, versionCode, versionName);
                    contenido = inyectarFirmaEnBuildGradle(contenido);
                }
            }
            trabajos.push({ rutaRepo: APK_NATIVO_CARPETA + '/' + mapearArchivoProyectoAndroid(rutaInterna, paquete), contenido, binario });
        }
        // v10.2 · Archivos de raíz importados del ZIP que no son los tres fijos (README.md, docs/, scripts/, modules-src/...):
        // se suben a la raíz del proyecto Gradle (proyecto-android/<ruta>) para que los workflows del repo (p. ej. los que compilan
        // módulos desde modules-src/) los encuentren. No son código del módulo app ni los toca Gradle (settings.gradle solo incluye :app).
        for (const rutaExtra of Object.keys(archivos).filter(r => REGEX_RAIZ_EXTRA.test(r))) {
            const contenidoExtra = archivos[rutaExtra] || '';
            trabajos.push({
                rutaRepo: APK_NATIVO_CARPETA + '/' + rutaExtra.slice('_raiz/'.length),
                contenido: contenidoExtra,
                binario: esArchivoBinarioGuardadoComoDataUrl(rutaExtra, contenidoExtra)
            });
        }

        const sinListado = !Array.isArray(existentes);
        const shas = new Map((existentes || []).map(e => [e.path, e.sha]));
        const truncado = !!(existentes && existentes.truncado);
        // Pasada 1: qué hay que subir de verdad (y con qué sha remoto conocido).
        for (const t of trabajos) {
            t.shaRemoto = sinListado ? undefined : (shas.has(t.rutaRepo) ? shas.get(t.rutaRepo) : (truncado ? undefined : null));
            if (t.externo) {
                // Fuera de proyecto-android/: el listado no sabe nada de este archivo. Se lee su sha
                // (1 GET por workflow del usuario) para no crear un commit en cada compilación.
                t.shaRemoto = undefined;
                try {
                    const resSha = await contentsApiGitHub(cfg, 'contents/' + t.rutaRepo.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(cfg.branch || 'main'));
                    if (resSha.status === 404) t.shaRemoto = null;
                    else if (resSha.ok) { const d = await resSha.json().catch(() => null); t.shaRemoto = d && d.sha ? d.sha : undefined; }
                } catch (_) { /* se deja undefined: la subida lee el sha por su cuenta */ }
            }
            t.cambia = true;
            if (t.shaRemoto) {
                let shaLocal = null;
                try {
                    // El SHA de git de un binario se calcula sobre los bytes reales, no sobre
                    // el texto "data:...;base64,...." — igual que ya hace subirIconosProyectoAndroid.
                    const bytes = t.binario ? dataUrlABytes(t.contenido) : new TextEncoder().encode(String(t.contenido));
                    if (bytes) shaLocal = await sha1BlobGit(bytes);
                } catch (_) {}
                if (shaLocal && shaLocal === t.shaRemoto) t.cambia = false;
            }
        }
        const pendientes = trabajos.filter(t => t.cambia);
        if (!sinListado) mostrarToast(`📦 ${pendientes.length ? pendientes.length + ' de ' + trabajos.length + ' archivo(s) con cambios' : 'Sin cambios en los archivos del proyecto'}…`);
        // Pasada 2: solo lo que cambió (en secuencia: la API de contenidos crea un commit por archivo y no admite escrituras en paralelo).
        let subidos = 0;
        for (const t of pendientes) {
            if (t.binario) {
                const i = t.contenido.indexOf(';base64,');
                await subirArchivoBinarioGitHub(cfg, t.rutaRepo, t.contenido.slice(i + 8), 'Actualiza ' + t.rutaRepo, t.shaRemoto);
            } else {
                await subirArchivoTextoGitHub(cfg, t.rutaRepo, t.contenido, 'Actualiza ' + t.rutaRepo, t.shaRemoto);
            }
            subidos++;
        }
        if (proyecto.icono && window.IconoAndroid) await subirIconosProyectoAndroid(cfg, proyecto, existentes);
        // wfCambiados: workflows del usuario (_wf/*) creados o modificados en esta subida; el llamador
        // los trata como 'tocado' (GitHub puede tardar en registrarlos antes de aceptar disparos).
        const wfCambiados = pendientes.filter(t => t.externo).length;
        return { total: trabajos.length, subidos, sinCambios: trabajos.length - subidos, wfCambiados };
    }

    let ESPERA_REINTENTO_DISPARO_MS = 5000;

    function mensajeWorkflowSinDispatch(workflowFile, proyecto) {
        const propio = proyecto && proyecto.archivos && proyecto.archivos['_wf/' + workflowFile];
        return 'El workflow ' + workflowFile + ' no admite ejecución manual: le falta este bloque en el .yml:\n' +
            'on:\n  workflow_dispatch:\n' +
            (propio ? 'Edítalo desde el panel de archivos (_wf/' + workflowFile + '), o usa otro workflow.' : 'Añádelo en el repositorio, o usa otro workflow.');
    }

    async function dispararWorkflow(cfg, workflowFile, inputs, opciones) {
        const tocado = !opciones || opciones.tocado !== false;
        const proyecto = opciones && opciones.proyecto;
        const maxIntentos = tocado ? 8 : 1;
        const intentarDisparo = () => contentsApiGitHub(cfg, 'actions/workflows/' + encodeURIComponent(workflowFile) + '/dispatches', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ref: cfg.branch || 'main', inputs: inputs || {} })
        });
        for (let intento = 0; intento < maxIntentos; intento++) {
            const res = await intentarDisparo();
            if (res.ok || res.status === 204) return;
            const errData = await res.json().catch(() => null);
            const mensaje = (errData && errData.message) || ('HTTP ' + res.status);
            const noEncontrado = res.status === 404 || /not found/i.test(mensaje);
            const sinDispatch = res.status === 422 && /workflow_dispatch/i.test(mensaje);
            const registroPendiente = tocado && (sinDispatch || noEncontrado);
            if (!registroPendiente || intento === maxIntentos - 1) {
                if (sinDispatch) throw new Error(mensajeWorkflowSinDispatch(workflowFile, proyecto));
                let sugerido = res.status === 403 ? mensajeErrorPermisoGitHub(mensaje) : null;
                if (!sugerido && !tocado && noEncontrado) sugerido = 'No se encontró el workflow ' + workflowFile + ' en el repositorio/rama configurados (404). Comprueba el propietario, el repositorio, la rama y que el token tenga acceso a Actions.';
                throw new Error(sugerido || mensaje);
            }
            mostrarToast('⚙️ GitHub aún está registrando ' + workflowFile + ', reintentando… (' + (intento + 1) + '/' + maxIntentos + ')');
            await new Promise(r => setTimeout(r, ESPERA_REINTENTO_DISPARO_MS));
        }
    }

    async function dispararWorkflowApkNativo(cfg, inputs, opciones) {
        return dispararWorkflow(cfg, 'build-apk-nativo.yml', inputs, opciones);
    }

    async function esperarWorkflow(cfg, workflowFile, disparadoDespuesDe, etiqueta) {
        const listarRuns = async () => {
            const res = await contentsApiGitHub(cfg, 'actions/workflows/' + encodeURIComponent(workflowFile) + '/runs?per_page=5');
            if (!res.ok) throw new Error('No se pudo consultar el estado del build (HTTP ' + res.status + ')');
            const data = await res.json();
            return data.workflow_runs || [];
        };
        let run = null;
        for (let intento = 0; intento < 15 && !run; intento++) {
            await new Promise(r => setTimeout(r, 4000));
            const runs = (await listarRuns()).filter(r => new Date(r.created_at).getTime() >= disparadoDespuesDe - 5000);
            if (runs.length) run = runs[0];
        }
        if (!run) throw new Error('No se encontró la ejecución del workflow. Revísalo manualmente en la pestaña Actions de tu repositorio.');

        while (run.status !== 'completed') {
            await new Promise(r => setTimeout(r, 6000));
            const res = await contentsApiGitHub(cfg, 'actions/runs/' + run.id);
            if (!res.ok) throw new Error('No se pudo consultar el estado del build (HTTP ' + res.status + ')');
            run = await res.json();
            mostrarToast((etiqueta || '⚙️ Ejecutando') + '… (' + (run.status === 'in_progress' ? 'en curso' : run.status) + ')');
        }
        if (run.conclusion !== 'success') {
            const errFallo = new Error('La compilación falló (' + run.conclusion + '). Revisa el registro en la pestaña Actions de tu repositorio en GitHub.');
            errFallo.runFallido = run; // permite mostrar el registro real y cruzarlo con el diagnóstico estático
            throw errFallo;
        }
        return run;
    }

    async function esperarBuildApkNativo(cfg, disparadoDespuesDe) {
        return esperarWorkflow(cfg, 'build-apk-nativo.yml', disparadoDespuesDe, '📦 Compilando');
    }

    async function compilarProyectoAndroidDirecto(nombreProyecto, p, cfg, opciones) {
        const estadoWorkflow = await asegurarWorkflowApkNativo(cfg, p);
        const tWorkflow = Date.now();

        // El listado del repo (con SHA) se usa para borrar huérfanos y para subir SOLO lo que cambió.
        // opciones.sinLimpiar: modo aditivo (no borra del repo lo que no esté en p.archivos). Lo usa la app Compila.
        const existentesRepo = (opciones && opciones.sinLimpiar)
            ? await listarArchivosEnRepo(cfg, APK_NATIVO_CARPETA)
            : await limpiarHuerfanosProyectoAndroid(cfg, p);
        const resSubida = await subirArchivosProyectoAndroid(cfg, p, existentesRepo);
        const wfUsuarioTocado = !!(resSubida && resSubida.wfCambiados);

        // Workflow recién creado: GitHub necesita unos segundos para registrarlo; ese tiempo corre mientras
        // se suben los archivos y solo se espera lo que falte. Si solo se actualizó, no hay
        // espera fija: el disparo ya reintenta si GitHub aún no lo ha registrado. Si no se tocó, se dispara directamente.
        if (estadoWorkflow.creado) {
            const falta = 8000 - (Date.now() - tWorkflow);
            if (falta > 0) {
                mostrarToast('📦 Workflow creado, esperando a que GitHub lo registre…');
                await new Promise(r => setTimeout(r, falta));
            }
        }

        const momentoDisparo = Date.now();
        await dispararWorkflowApkNativo(cfg, {
            app_name: p.nombreApp,
            app_package: p.paquete,
            app_version_code: String(p.versionCode || 1),
            app_version_name: p.ultimaVersion || 'v1.0'
        }, { tocado: !!(estadoWorkflow.creado || estadoWorkflow.cambiado || wfUsuarioTocado) });

        mostrarToast('📦 Compilando… puede tardar unos minutos');
        await esperarBuildApkNativo(cfg, momentoDisparo);

        const urlApk = await buscarUltimoApkPublicado(cfg);
        registrarPublicacion('apk', slugPublicar(p.nombreApp), urlApk, nombreProyecto);

        // B11.B: solo se incrementa tras éxito confirmado, para que el
        // versionCode ya usado en esta compilación (el que se inyectó en
        // subirArchivosProyectoAndroid) quede persistido y la próxima
        // compilación use el siguiente número.
        p.versionCode = (p.versionCode || 1) + 1;
        await guardarProyectos();
        return { url: urlApk };
    }

    const REGEX_PAQUETE_ANDROID = /^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$/;

    function paqueteValido(paquete) {
        return typeof paquete === 'string' && REGEX_PAQUETE_ANDROID.test(paquete);
    }

    function sanearSegmentoPaquete(texto) {
        let base = String(texto || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');
        if (base === '') base = 'app';
        if (/^[0-9]/.test(base)) base = 'a' + base;
        return base;
    }

    function sugerirIdentidadAndroid(nombreProyecto) {
        const limpio = String(nombreProyecto || '').trim();
        const nombreApp = limpio.length > 0 ? (limpio.charAt(0).toUpperCase() + limpio.slice(1)) : 'Mi App';
        const paquete = 'com.ejemplo.' + sanearSegmentoPaquete(limpio);
        return { nombreApp: nombreApp.slice(0, 40), paquete };
    }

    function verificarPrerrequisitos(p) {
        const problemas = [];
        const funcionalidades = p.funcionalidades || [];
        if (!funcionalidades.includes('pantalla-web')) return problemas;

        const hayNavegacion = ['varias-pantallas', 'menu-lateral', 'barra-inferior'].some(id => funcionalidades.includes(id));
        // Fix B (auditoría): "varias-pantallas" cuenta como navegación válida
        // aquí (no bloquea), pero si NO hay también menu-lateral o
        // barra-inferior, la PantallaWeb se genera y funciona (mostrarPantallaWebFragment
        // existe), solo que no hay ningún ítem de menú/barra que la dispare —
        // solo es alcanzable llamándola a mano (p.ej. desde AppLogic.kt). No
        // es un bug: es una limitación conocida y documentada, no cubierta
        // explícitamente por el documento de Fase 10.
        if (!hayNavegacion) {
            problemas.push({
                funcionalidad: 'pantalla-web',
                motivo: "Pantalla Web necesita que 'Varias pantallas', 'Menú lateral' o 'Barra inferior' estén marcadas para poder navegar a ella.",
                bloqueante: true
            });
            return problemas; // sin navegación, el resto de comprobaciones no importan
        }

        const cfg = p.configuracionFuncionalidades && p.configuracionFuncionalidades['pantalla-web'];
        if (!cfg) {
            problemas.push({
                funcionalidad: 'pantalla-web',
                motivo: 'La funcionalidad Pantalla Web está marcada pero sin configurar. Configúrala antes de generar.',
                bloqueante: true
            });
            return problemas;
        }

        if (cfg.modo === 'empaquetado') {
            const html = p.archivos && p.archivos['assets/pantalla-web/index.html'];
            if (!html || !html.trim()) {
                problemas.push({
                    funcionalidad: 'pantalla-web',
                    motivo: 'El HTML empaquetado no está listo. Configura la funcionalidad primero.',
                    bloqueante: true
                });
            } else {
                const proyectoWeb = proyectos[cfg.proyectoWeb];
                const claveVersion = proyectoWeb && (proyectoWeb.ultimaVersion || Object.keys(proyectoWeb.versiones || {}).slice(-1)[0]);
                const htmlOrigen = proyectoWeb && proyectoWeb.versiones && proyectoWeb.versiones[claveVersion] && proyectoWeb.versiones[claveVersion].contenido;
                if (htmlOrigen && htmlOrigen !== html && !cfg.recursosDescargados) {
                    problemas.push({
                        funcionalidad: 'pantalla-web',
                        motivo: 'El HTML empaquetado es distinto al del proyecto web actual. Vuelve a configurar Pantalla Web para actualizarlo.',
                        bloqueante: false
                    });
                }
                if (/https:\/\//.test(html) && !cfg.recursosDescargados) {
                    problemas.push({
                        funcionalidad: 'pantalla-web',
                        motivo: 'Pantalla Web (empaquetado) tiene recursos externos sin descargar; se cargarán desde la red.',
                        bloqueante: false
                    });
                }
            }
        } else {
            if (!cfg.url || !/^https?:\/\//.test(cfg.url)) {
                problemas.push({
                    funcionalidad: 'pantalla-web',
                    motivo: 'Pantalla Web (remoto) no tiene una URL válida. Configúrala antes de generar.',
                    bloqueante: true
                });
            }
        }
        return problemas;
    }

    async function buscarUltimoApkPublicado(cfg) {
        const res = await contentsApiGitHub(cfg, 'releases?per_page=1');
        if (!res.ok) throw new Error('No se pudo obtener el release (HTTP ' + res.status + ')');
        const releases = await res.json();
        const release = releases && releases[0];
        const asset = release && release.assets && release.assets.find(a => a.name.endsWith('.apk'));
        if (!asset) throw new Error('La compilación terminó pero no se encontró el APK en el release.');
        return asset.browser_download_url;
    }

    const MODIFICADORES_KOTLIN = [
        'public','private','protected','internal',
        'open','abstract','final','override',
        'suspend','inline','noinline','crossinline',
        'operator','infix','tailrec','external',
        'actual','expect','data','sealed','enum',
        'annotation','inner','lateinit','const','vararg'
    ];

    function tokenizarKotlin(texto) {
        const n = texto.length;
        const tipo = new Array(n).fill('codigo');
        let i = 0;

        function marcarPlantilla(desdeDolar) {
            tipo[desdeDolar] = 'string';
            tipo[desdeDolar + 1] = 'codigo';
            let j = desdeDolar + 2;
            let profund = 1;
            while (j < n && profund > 0) {
                if (texto[j] === '{') profund++;
                else if (texto[j] === '}') profund--;
                tipo[j] = 'codigo';
                j++;
            }
            return j;
        }

        while (i < n) {
            const c = texto[i], c2 = texto[i + 1];
            if (c === '/' && c2 === '/') {
                let j = i;
                while (j < n && texto[j] !== '\n') { tipo[j] = 'comentario'; j++; }
                i = j; continue;
            }
            if (c === '/' && c2 === '*') {
                let j = i;
                tipo[j] = 'comentario'; tipo[j + 1] = 'comentario';
                j += 2;
                while (j < n && !(texto[j] === '*' && texto[j + 1] === '/')) { tipo[j] = 'comentario'; j++; }
                if (j < n) { tipo[j] = 'comentario'; tipo[j + 1] = 'comentario'; j += 2; }
                i = j; continue;
            }
            if (c === '"' && c2 === '"' && texto[i + 2] === '"') {
                let j = i;
                tipo[j] = 'string'; tipo[j + 1] = 'string'; tipo[j + 2] = 'string';
                j += 3;
                while (j < n && !(texto[j] === '"' && texto[j + 1] === '"' && texto[j + 2] === '"')) {
                    if (texto[j] === '$' && texto[j + 1] === '{') { j = marcarPlantilla(j); continue; }
                    tipo[j] = 'string'; j++;
                }
                if (j < n) { tipo[j] = 'string'; tipo[j + 1] = 'string'; tipo[j + 2] = 'string'; j += 3; }
                i = j; continue;
            }
            if (c === '"') {
                let j = i;
                tipo[j] = 'string'; j++;
                while (j < n && texto[j] !== '"') {
                    if (texto[j] === '\\') { tipo[j] = 'string'; j++; if (j < n) { tipo[j] = 'string'; j++; } continue; }
                    if (texto[j] === '$' && texto[j + 1] === '{') { j = marcarPlantilla(j); continue; }
                    if (texto[j] === '\n') break;
                    tipo[j] = 'string'; j++;
                }
                if (j < n && texto[j] === '"') { tipo[j] = 'string'; j++; }
                i = j; continue;
            }
            if (c === "'") {
                // Nota: en Kotlin esto es un char literal (1 carácter); en
                // Gradle/Groovy (que reutiliza este mismo tokenizador) '...' es
                // un string completo de longitud libre. No imponemos límite de
                // longitud: se escanea hasta la comilla de cierre sin escapar,
                // o hasta fin de línea si no cierra (literal/string mal formado).
                let j = i;
                tipo[j] = 'string'; j++;
                while (j < n && texto[j] !== "'" && texto[j] !== '\n') {
                    if (texto[j] === '\\') { tipo[j] = 'string'; j++; if (j < n) { tipo[j] = 'string'; j++; } continue; }
                    tipo[j] = 'string'; j++;
                }
                if (j < n && texto[j] === "'") { tipo[j] = 'string'; j++; }
                i = j; continue;
            }
            tipo[i] = 'codigo'; i++;
        }
        return tipo;
    }

    function escrubarKotlin(texto, tipoMap) {
        let out = '';
        for (let i = 0; i < texto.length; i++) {
            if (tipoMap[i] === 'codigo') out += texto[i];
            else out += (texto[i] === '\n') ? '\n' : ' ';
        }
        return out;
    }

    function calcularProfundidadesKotlin(escrubado) {
        const n = escrubado.length;
        const profundidad = new Int32Array(n);
        let depth = 0;
        for (let i = 0; i < n; i++) {
            const c = escrubado[i];
            if (c === '{') { profundidad[i] = depth; depth++; }
            else if (c === '}') { depth = Math.max(0, depth - 1); profundidad[i] = depth; }
            else profundidad[i] = depth;
        }
        return profundidad;
    }

    function encontrarCierreLlaveKotlin(escrubado, profundidad, iOpen) {
        const d = profundidad[iOpen];
        for (let j = iOpen + 1; j < escrubado.length; j++) {
            if (escrubado[j] === '}' && profundidad[j] === d) return j;
        }
        return escrubado.length - 1;
    }

    function numeroDeLineaKotlin(texto, index) {
        let n = 1;
        for (let i = 0; i < index && i < texto.length; i++) if (texto[i] === '\n') n++;
        return n;
    }

    function coincideEnKotlin(escrubado, i, palabra) {
        if (escrubado.slice(i, i + palabra.length) !== palabra) return false;
        const antes = i === 0 ? ' ' : escrubado[i - 1];
        const despues = escrubado[i + palabra.length] || ' ';
        return !/\w/.test(antes) && !/\w/.test(despues);
    }

    function extraerModificadoresPreviosKotlin(escrubado, i) {
        const mods = [];
        let cursor = i;
        while (true) {
            let j = cursor - 1;
            while (j >= 0 && /\s/.test(escrubado[j])) j--;
            if (j < 0) break;
            let k = j;
            while (k >= 0 && /\w/.test(escrubado[k])) k--;
            const palabra = escrubado.slice(k + 1, j + 1);
            if (MODIFICADORES_KOTLIN.includes(palabra)) { mods.unshift(palabra); cursor = k + 1; }
            else break;
        }
        return { modificadores: mods, inicio: cursor };
    }

    function extraerAnotacionesPreviasKotlin(texto, escrubado, inicio) {
        const anotaciones = [];
        let cursor = inicio;
        while (true) {
            let j = cursor - 1;
            while (j >= 0 && /\s/.test(escrubado[j])) j--;
            if (j < 0) break;
            let inicioAnot, finAnot = j + 1;
            if (escrubado[j] === ')') {
                let profund = 1, k = j - 1;
                while (k >= 0 && profund > 0) {
                    if (escrubado[k] === ')') profund++;
                    else if (escrubado[k] === '(') profund--;
                    k--;
                }
                let k2 = k;
                while (k2 >= 0 && /\w/.test(escrubado[k2])) k2--;
                inicioAnot = k2 + 1;
            } else if (/\w/.test(escrubado[j])) {
                let k2 = j;
                while (k2 >= 0 && /\w/.test(escrubado[k2])) k2--;
                inicioAnot = k2 + 1;
            } else break;
            if (escrubado[inicioAnot - 1] !== '@') break;
            inicioAnot -= 1;
            anotaciones.unshift(texto.slice(inicioAnot, finAnot).trim());
            cursor = inicioAnot;
        }
        return { anotaciones, inicio: cursor };
    }

    function extraerComentarioCabeceraKotlin(texto, tipoMap, inicio) {
        let i = inicio - 1;
        while (i >= 0 && /\s/.test(texto[i])) i--;
        if (i < 0 || tipoMap[i] !== 'comentario') return null;

        let finComentario = i;
        let inicioComentario = i;
        while (inicioComentario > 0 && tipoMap[inicioComentario - 1] === 'comentario') inicioComentario--;
        let bloque = texto.slice(inicioComentario, finComentario + 1);

        if (bloque.trimStart().startsWith('/*')) return bloque.trim();
        if (!bloque.trimStart().startsWith('//')) return null;

        const partes = [bloque];
        let cursor = inicioComentario;
        while (true) {
            let k = cursor - 1;
            while (k >= 0 && (texto[k] === ' ' || texto[k] === '\t')) k--;
            if (k < 0 || texto[k] !== '\n') break;
            k--;
            let k2 = k;
            while (k2 >= 0 && (texto[k2] === ' ' || texto[k2] === '\t')) k2--;
            if (k2 < 0 || tipoMap[k2] !== 'comentario') break;
            let inicioAnterior = k2;
            while (inicioAnterior > 0 && tipoMap[inicioAnterior - 1] === 'comentario') inicioAnterior--;
            const anterior = texto.slice(inicioAnterior, k2 + 1);
            if (!anterior.trimStart().startsWith('//')) break;
            partes.unshift(anterior);
            cursor = inicioAnterior;
        }
        return partes.join('\n').trim();
    }

    function dividirPorComasNivelSuperiorKotlin(textoTrozo, escTrozo) {
        const partes = [];
        let nivel = 0, inicio = 0;
        for (let k = 0; k <= escTrozo.length; k++) {
            const c = escTrozo[k];
            if (c === '(' || c === '<' || c === '[') nivel++;
            else if (c === ')' || c === '>' || c === ']') nivel = Math.max(0, nivel - 1);
            if ((c === ',' && nivel === 0) || k === escTrozo.length) {
                const t = textoTrozo.slice(inicio, k).trim();
                const e = escTrozo.slice(inicio, k).trim();
                if (t) partes.push({ texto: t, escrubado: e });
                inicio = k + 1;
            }
        }
        return partes;
    }

    function analizarUnParametroKotlin(trozoTexto, trozoEsc) {
        let nivel = 0, idxIgual = -1;
        for (let k = 0; k < trozoEsc.length; k++) {
            const c = trozoEsc[k];
            if (c === '(' || c === '<' || c === '[') nivel++;
            else if (c === ')' || c === '>' || c === ']') nivel = Math.max(0, nivel - 1);
            else if (c === '=' && nivel === 0) { idxIgual = k; break; }
        }
        const declTexto = idxIgual > -1 ? trozoTexto.slice(0, idxIgual) : trozoTexto;
        const declEsc = idxIgual > -1 ? trozoEsc.slice(0, idxIgual) : trozoEsc;
        const valorPorDefecto = idxIgual > -1 ? (trozoTexto.slice(idxIgual + 1).trim() || null) : null;

        let nivel2 = 0, idxDosPuntos = -1;
        for (let k = 0; k < declEsc.length; k++) {
            const c = declEsc[k];
            if (c === '(' || c === '<' || c === '[') nivel2++;
            else if (c === ')' || c === '>' || c === ']') nivel2 = Math.max(0, nivel2 - 1);
            else if (c === ':' && nivel2 === 0) { idxDosPuntos = k; break; }
        }
        const nombreBruto = (idxDosPuntos > -1 ? declTexto.slice(0, idxDosPuntos) : declTexto).trim();
        const tipo = idxDosPuntos > -1 ? (declTexto.slice(idxDosPuntos + 1).trim() || null) : null;
        const vararg = /\bvararg\b/.test(nombreBruto);
        // Un parámetro de constructor primario puede llevar varios modificadores
        // encadenados antes del nombre real: "private val nombre", "internal
        // vararg nombre"... se despojan TODOS, no solo el primero.
        const nombre = nombreBruto.replace(/^(?:(?:private|public|protected|internal|vararg|val|var)\s+)+/, '').trim() || null;

        return { nombre, tipo, valorPorDefecto, vararg };
    }

    function dividirParametrosKotlin(paramsTexto, paramsEsc) {
        return dividirPorComasNivelSuperiorKotlin(paramsTexto, paramsEsc)
            .map(p => analizarUnParametroKotlin(p.texto, p.escrubado));
    }

    function analizarFirmaFuncionKotlin(firmaTexto, firmaEsc) {
        let i = 0, anguloD = 0;
        while (i < firmaEsc.length && firmaEsc[i] !== '(') {
            if (firmaEsc[i] === '<') anguloD++;
            else if (firmaEsc[i] === '>') anguloD = Math.max(0, anguloD - 1);
            i++;
        }
        if (firmaEsc[i] !== '(') return { parametros: [], tipoRetorno: null }; // firma atípica; no debería pasar para 'fun'

        let d = 1, j = i + 1;
        while (j < firmaEsc.length && d > 0) {
            if (firmaEsc[j] === '(') d++;
            else if (firmaEsc[j] === ')') d--;
            if (d > 0) j++;
        }
        const parametros = dividirParametrosKotlin(firmaTexto.slice(i + 1, j), firmaEsc.slice(i + 1, j));

        const restoTexto = firmaTexto.slice(j + 1).trim();
        const restoEsc = firmaEsc.slice(j + 1).trim();
        const tipoRetorno = restoEsc.startsWith(':') ? (restoTexto.slice(1).trim() || null) : null;

        return { parametros, tipoRetorno };
    }

    function analizarHerenciaKotlin(herenciaTexto, herenciaEsc) {
        const vacio = { constructorParametros: [], superTipos: [], claseBase: null, interfaces: [] };
        if (!herenciaTexto) return vacio;

        let i = 0;
        while (i < herenciaEsc.length && /\s/.test(herenciaEsc[i])) i++;
        let constructorParametros = [];
        if (herenciaEsc[i] === '(') {
            let d = 1, j = i + 1;
            while (j < herenciaEsc.length && d > 0) {
                if (herenciaEsc[j] === '(') d++;
                else if (herenciaEsc[j] === ')') d--;
                if (d > 0) j++;
            }
            constructorParametros = dividirParametrosKotlin(herenciaTexto.slice(i + 1, j), herenciaEsc.slice(i + 1, j));
            i = j + 1;
        }

        let k = i;
        while (k < herenciaEsc.length && /\s/.test(herenciaEsc[k])) k++;
        if (herenciaEsc[k] !== ':') return { constructorParametros, superTipos: [], claseBase: null, interfaces: [] };

        const restoTexto = herenciaTexto.slice(k + 1);
        const restoEsc = herenciaEsc.slice(k + 1);
        const superTipos = dividirPorComasNivelSuperiorKotlin(restoTexto, restoEsc).map(p => p.texto).filter(Boolean);
        // Heurística (documentada): solo la clase base real lleva una llamada de
        // constructor "(...)" tras el nombre; una interfaz se lista sin ella.
        const claseBase = superTipos.find(t => /\)\s*$/.test(t)) || null;
        const interfaces = superTipos.filter(t => t !== claseBase);

        return { constructorParametros, superTipos, claseBase, interfaces };
    }

    function analizarTipoDetalladoKotlin(tipoTexto) {
        if (!tipoTexto) return null;
        const t = tipoTexto.trim();
        const nullable = /\?\s*$/.test(t);
        const sinNull = (nullable ? t.slice(0, t.lastIndexOf('?')) : t).trim();
        const iAngulo = sinNull.indexOf('<');
        if (iAngulo === -1 || !sinNull.endsWith('>')) {
            return { base: sinNull, nullable, genericos: [] };
        }
        const base = sinNull.slice(0, iAngulo).trim();
        const dentro = sinNull.slice(iAngulo + 1, -1);
        const genericos = dividirPorComasNivelSuperiorKotlin(dentro, dentro).map(p => p.texto).filter(Boolean);
        return { base, nullable, genericos };
    }

    function extraerFirmaFuncionKotlin(texto, escrubado, inicioFun) {
        let i = inicioFun, parenD = 0, corcheteD = 0, anguloD = 0;
        let fin = texto.length;
        for (; i < texto.length; i++) {
            const c = escrubado[i];
            if (c === '(') parenD++;
            else if (c === ')') parenD = Math.max(0, parenD - 1);
            else if (c === '[') corcheteD++;
            else if (c === ']') corcheteD = Math.max(0, corcheteD - 1);
            else if (c === '<' && parenD === 0) anguloD++;
            else if (c === '>' && parenD === 0 && anguloD > 0) anguloD--;
            else if ((c === '{' || c === '=') && parenD === 0 && corcheteD === 0 && anguloD === 0) { fin = i; break; }
            else if ((c === ';' || c === '}') && parenD === 0 && corcheteD === 0 && anguloD === 0) { fin = i; break; }
        }
        return { firma: texto.slice(inicioFun, fin).trim(), fin };
    }

    function extraerNombreTrasPalabraKotlin(escrubado, iPalabra, palabra) {
        let j = iPalabra + palabra.length;
        while (j < escrubado.length && /\s/.test(escrubado[j])) j++;
        let k = j;
        while (k < escrubado.length && /[\w]/.test(escrubado[k])) k++;
        return { nombre: escrubado.slice(j, k) || null, fin: k };
    }

    function extraerNombreFuncionKotlin(escrubado, iFun) {
        let j = iFun + 'fun'.length;
        while (j < escrubado.length && /\s/.test(escrubado[j])) j++;
        if (escrubado[j] === '<') {
            let d = 1; j++;
            while (j < escrubado.length && d > 0) {
                if (escrubado[j] === '<') d++;
                else if (escrubado[j] === '>') d--;
                j++;
            }
            while (j < escrubado.length && /\s/.test(escrubado[j])) j++;
        }
        let k = j;
        while (k < escrubado.length && escrubado[k] !== '(' && escrubado[k] !== '\n') {
            if (/\s/.test(escrubado[k])) {
                let k2 = k;
                while (k2 < escrubado.length && /\s/.test(escrubado[k2])) k2++;
                if (escrubado[k2] !== '(') break;
                k = k2;
                continue;
            }
            k++;
        }
        const token = escrubado.slice(j, k);
        const partes = token.split('.');
        let nombre = (partes[partes.length - 1] || '').replace(/<.*$/, '').trim();
        return { nombre: nombre || null, fin: k };
    }

    function valorInicialSimpleKotlin(texto) {
        const t = texto.trim();
        if (t === '') return null;
        if (/^-?\d+(\.\d+)?[fFlL]?$/.test(t)) return t;
        if (/^(true|false|null)$/.test(t)) return t;
        if (/^"[^"\n]*"$/.test(t)) return t;
        if (/^[A-Za-z_][\w.]*$/.test(t) && t.length <= 40) return t;
        return null;
    }

    function tipoDeClaseKotlin(modificadores, palabraClave) {
        if (palabraClave === 'interface') return 'interface';
        if (palabraClave === 'object') return 'object';
        if (modificadores.includes('data')) return 'data class';
        if (modificadores.includes('sealed')) return 'sealed class';
        if (modificadores.includes('enum')) return 'enum class';
        if (modificadores.includes('annotation')) return 'annotation class';
        return 'class';
    }

    function parsearBloqueKotlin(ctx, inicio, fin, depthObjetivo, esNivelArchivo) {
        const { texto, escrubado, profundidad, tipoMap, avisos } = ctx;
        const elementos = [];
        let i = inicio;

        while (i < fin) {
            if (profundidad[i] !== depthObjetivo) { i++; continue; }

            if (esNivelArchivo && coincideEnKotlin(escrubado, i, 'import')) {
                let j = i + 'import'.length, k = j;
                while (k < fin && escrubado[k] !== '\n' && escrubado[k] !== ';') k++;
                const resto = texto.slice(j, k).trim();
                const m = resto.match(/^([\w.]+)(?:\s+as\s+(\w+))?/);
                if (m) ctx.imports.push({ ruta: m[1], alias: m[2] || null, linea: numeroDeLineaKotlin(texto, i) });
                i = k; continue;
            }

            if (coincideEnKotlin(escrubado, i, 'class') || coincideEnKotlin(escrubado, i, 'interface') || coincideEnKotlin(escrubado, i, 'object')) {
                try {
                    const palabraClave = coincideEnKotlin(escrubado, i, 'class') ? 'class'
                        : coincideEnKotlin(escrubado, i, 'interface') ? 'interface' : 'object';
                    const { modificadores, inicio: iniciotrasMods } = extraerModificadoresPreviosKotlin(escrubado, i);
                    let esCompanion = false;
                    {
                        let j = iniciotrasMods - 1;
                        while (j >= 0 && /\s/.test(escrubado[j])) j--;
                        let k = j;
                        while (k >= 0 && /\w/.test(escrubado[k])) k--;
                        if (escrubado.slice(k + 1, j + 1) === 'companion' && palabraClave === 'object') esCompanion = true;
                    }
                    const { anotaciones, inicio: inicioDeclaracion } = extraerAnotacionesPreviasKotlin(texto, escrubado, iniciotrasMods);
                    let inicioReal = inicioDeclaracion;
                    if (esCompanion) {
                        let j = iniciotrasMods - 1;
                        while (j >= 0 && /\s/.test(escrubado[j])) j--;
                        let k = j;
                        while (k >= 0 && /\w/.test(escrubado[k])) k--;
                        inicioReal = k;
                    }
                    const { nombre, fin: finNombre } = extraerNombreTrasPalabraKotlin(escrubado, i, palabraClave);

                    let cursor = finNombre, iOpen = -1, parenD = 0, anguloD = 0;
                    for (; cursor < fin; cursor++) {
                        const c = escrubado[cursor];
                        if (c === '(') parenD++;
                        else if (c === ')') parenD = Math.max(0, parenD - 1);
                        else if (c === '<') anguloD++;
                        else if (c === '>' && anguloD > 0) anguloD--;
                        else if (c === '{' && parenD === 0 && anguloD === 0) { iOpen = cursor; break; }
                        else if ((c === ';' || c === '\n') && parenD === 0 && anguloD === 0) {
                            let k = cursor + 1;
                            while (k < fin && /\s/.test(escrubado[k])) k++;
                            if (escrubado[k] !== '{' && escrubado[k] !== ':') break;
                        }
                    }

                    const nombreLinea = numeroDeLineaKotlin(texto, i);
                    const kdoc = extraerComentarioCabeceraKotlin(texto, tipoMap, inicioReal);
                    const herenciaCruda = iOpen > -1 ? texto.slice(finNombre, iOpen) : texto.slice(finNombre, cursor);
                    const herenciaCrudaEsc = iOpen > -1 ? escrubado.slice(finNombre, iOpen) : escrubado.slice(finNombre, cursor);
                    const herencia = herenciaCruda.trim();
                    const nivel3Herencia = analizarHerenciaKotlin(herenciaCruda, herenciaCrudaEsc);
                    const visibilidad = modificadores.find(m => ['public','private','protected','internal'].includes(m)) || 'public';

                    let miembros = [], siguienteIndice;
                    if (iOpen > -1) {
                        const iClose = encontrarCierreLlaveKotlin(escrubado, profundidad, iOpen);
                        miembros = parsearBloqueKotlin(ctx, iOpen + 1, iClose, depthObjetivo + 1, false);
                        siguienteIndice = iClose + 1;
                    } else {
                        siguienteIndice = cursor + 1;
                    }

                    elementos.push({
                        tipo: 'clase',
                        nombre: esCompanion ? (nombre || 'companion object') : nombre,
                        tipoClase: esCompanion ? 'companion object' : tipoDeClaseKotlin(modificadores, palabraClave),
                        herencia: herencia || null,
                        // B7.4 (1) Nivel 3: derivado de `herencia`, no la sustituye.
                        superTipos: nivel3Herencia.superTipos,
                        claseBase: nivel3Herencia.claseBase,
                        interfaces: nivel3Herencia.interfaces,
                        constructorParametros: nivel3Herencia.constructorParametros,
                        visibilidad, modificadores, anotaciones, kdoc,
                        linea: nombreLinea,
                        miembros
                    });
                    i = siguienteIndice; continue;
                } catch (err) {
                    avisos.push({ mensaje: 'No se pudo analizar por completo una clase/objeto en la línea ' + numeroDeLineaKotlin(texto, i) + ': ' + err.message, linea: numeroDeLineaKotlin(texto, i) });
                    i++; continue;
                }
            }

            if (coincideEnKotlin(escrubado, i, 'fun')) {
                try {
                    const { modificadores, inicio: inicioTrasMods } = extraerModificadoresPreviosKotlin(escrubado, i);
                    const { anotaciones, inicio: inicioDeclaracion } = extraerAnotacionesPreviasKotlin(texto, escrubado, inicioTrasMods);
                    const { nombre } = extraerNombreFuncionKotlin(escrubado, i);
                    const { firma, fin: finFirma } = extraerFirmaFuncionKotlin(texto, escrubado, i);
                    // B7.4 (1) Nivel 3: mismo tramo que `firma`, pero SIN recortar
                    // (firma ya viene trim()ada — habría desalineado los índices
                    // frente al escrubado). analizarFirmaFuncionKotlin no necesita
                    // que el borde izquierdo esté recortado.
                    const nivel3Firma = analizarFirmaFuncionKotlin(texto.slice(i, finFirma), escrubado.slice(i, finFirma));
                    const linea = numeroDeLineaKotlin(texto, i);
                    const kdoc = extraerComentarioCabeceraKotlin(texto, tipoMap, inicioDeclaracion);
                    const visibilidad = modificadores.find(m => ['public','private','protected','internal'].includes(m)) || 'public';

                    const elementoFuncion = {
                        tipo: 'funcion', nombre: nombre || '(anónima)', firma, visibilidad, modificadores, anotaciones, kdoc, linea,
                        // B7.4 (1) Nivel 3: derivado de `firma`, no la sustituye.
                        parametros: nivel3Firma.parametros,
                        tipoRetorno: nivel3Firma.tipoRetorno
                    };

                    if (escrubado[finFirma] === '{') {
                        const iClose = encontrarCierreLlaveKotlin(escrubado, profundidad, finFirma);
                        // B7.4 (2): offsets del cuerpo para la búsqueda en cuerpo
                        // de funciones. Solo cuando hay un `{...}` real — una
                        // función de cuerpo-expresión ("fun f() = x") se queda
                        // SIN estos campos (undefined, nunca null ni -1: así
                        // "if (el._iniCuerpo !== undefined)" basta en cualquier
                        // consumidor, sin poder confundirse con un 0 legítimo).
                        elementoFuncion._iniCuerpo = finFirma;
                        elementoFuncion._finCuerpo = iClose;
                        elementos.push(elementoFuncion);
                        i = iClose + 1;
                    } else if (escrubado[finFirma] === '}') {
                        elementos.push(elementoFuncion);
                        i = finFirma;
                    } else {
                        elementos.push(elementoFuncion);
                        i = finFirma + 1;
                    }
                    continue;
                } catch (err) {
                    avisos.push({ mensaje: 'No se pudo analizar por completo una función en la línea ' + numeroDeLineaKotlin(texto, i) + ': ' + err.message, linea: numeroDeLineaKotlin(texto, i) });
                    i++; continue;
                }
            }

            if (coincideEnKotlin(escrubado, i, 'val') || coincideEnKotlin(escrubado, i, 'var')) {
                try {
                    const esVar = coincideEnKotlin(escrubado, i, 'var');
                    const palabra = esVar ? 'var' : 'val';
                    const { modificadores, inicio: inicioTrasMods } = extraerModificadoresPreviosKotlin(escrubado, i);
                    const { anotaciones, inicio: inicioDeclaracion } = extraerAnotacionesPreviasKotlin(texto, escrubado, inicioTrasMods);
                    const { nombre, fin: finNombre } = extraerNombreTrasPalabraKotlin(escrubado, i, palabra);
                    const linea = numeroDeLineaKotlin(texto, i);

                    let cursor = finNombre, tipoDeclarado = null;
                    while (cursor < fin && /\s/.test(escrubado[cursor])) cursor++;
                    if (escrubado[cursor] === ':') {
                        let k = cursor + 1, parenD = 0, anguloD = 0, inicioTipo = k;
                        while (k < fin) {
                            const c = escrubado[k];
                            if (c === '(') parenD++;
                            else if (c === ')') parenD = Math.max(0, parenD - 1);
                            else if (c === '<') anguloD++;
                            else if (c === '>' && anguloD > 0) anguloD--;
                            else if ((c === '=' || c === '\n' || c === ';') && parenD === 0 && anguloD === 0) break;
                            k++;
                        }
                        tipoDeclarado = texto.slice(inicioTipo, k).trim() || null;
                        cursor = k;
                    }
                    const finSinAsignar = cursor; // FIX: fin real de la declaración si no hay '=' (antes de saltar blancos)
                    while (cursor < fin && /\s/.test(escrubado[cursor])) cursor++;
                    let valorInicial = null, finDecl = finSinAsignar;
                    if (escrubado[cursor] === '=') {
                        let k = cursor + 1, parenD = 0, corcheteD = 0, llaveD = profundidad[cursor], inicioValor = k;
                        while (k < fin) {
                            const c = escrubado[k];
                            if (c === '(') parenD++;
                            else if (c === ')') parenD = Math.max(0, parenD - 1);
                            else if (c === '[') corcheteD++;
                            else if (c === ']') corcheteD = Math.max(0, corcheteD - 1);
                            else if ((c === '\n' || c === ';') && parenD === 0 && corcheteD === 0 && profundidad[k] === llaveD) break;
                            k++;
                        }
                        valorInicial = valorInicialSimpleKotlin(texto.slice(inicioValor, k));
                        finDecl = k;
                    }

                    const kdoc = extraerComentarioCabeceraKotlin(texto, tipoMap, inicioDeclaracion);
                    const visibilidad = modificadores.find(m => ['public','private','protected','internal'].includes(m)) || 'public';

                    elementos.push({
                        tipo: 'propiedad', nombre, tipoDeclarado, esVar, visibilidad, modificadores, anotaciones, kdoc, linea, valorInicial,
                        // B7.4 (1) Nivel 3: derivado de tipoDeclarado, no lo sustituye.
                        // null si no hay tipo declarado (tipo inferido).
                        tipoInfo: analizarTipoDetalladoKotlin(tipoDeclarado)
                    });
                    i = finDecl + 1; continue;
                } catch (err) {
                    avisos.push({ mensaje: 'No se pudo analizar por completo una propiedad en la línea ' + numeroDeLineaKotlin(texto, i) + ': ' + err.message, linea: numeroDeLineaKotlin(texto, i) });
                    i++; continue;
                }
            }

            i++;
        }
        return elementos;
    }

    function escaparRegexKotlin(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function detectarLateinitSinInicializarKotlin(elementos, escrubado, avisos) {
        function recorrer(lista) {
            (lista || []).forEach(el => {
                if (el.tipo === 'propiedad' && el.esVar && (el.modificadores || []).includes('lateinit') && el.nombre) {
                    const re = new RegExp('\\b' + escaparRegexKotlin(el.nombre) + '\\s*[+\\-*/%]?=(?!=)');
                    if (!re.test(escrubado)) {
                        avisos.push({
                            tipo: 'lateinit-sin-inicializar',
                            mensaje: 'lateinit var "' + el.nombre + '" no se inicializa en el resto del archivo.',
                            linea: el.linea
                        });
                    }
                }
                if (el.tipo === 'clase') recorrer(el.miembros);
            });
        }
        recorrer(elementos);
    }

    function detectarImportsNoUsadosKotlin(imports, escrubado, avisos) {
        if (!imports.length) return;
        const sinImports = escrubado.replace(/\bimport\b[^\n;]*/g, m => ' '.repeat(m.length));
        imports.forEach(imp => {
            const nombreSimple = (imp.alias || (imp.ruta || '').split('.').pop() || '').trim();
            if (!nombreSimple || nombreSimple === '*') return;
            const re = new RegExp('\\b' + escaparRegexKotlin(nombreSimple) + '\\b');
            if (!re.test(sinImports)) {
                avisos.push({
                    tipo: 'import-no-usado',
                    mensaje: 'El import "' + imp.ruta + (imp.alias ? (' as ' + imp.alias) : '') + '" no parece usarse en el resto del archivo.',
                    linea: imp.linea
                });
            }
        });
    }

    function parsearKotlin(texto) {
        const tipoMap = tokenizarKotlin(texto);
        const escrubado = escrubarKotlin(texto, tipoMap);
        const profundidad = calcularProfundidadesKotlin(escrubado);
        const ctx = { texto, escrubado, profundidad, tipoMap, imports: [], avisos: [] };
        const elementos = parsearBloqueKotlin(ctx, 0, texto.length, 0, true);

        // B7.4 (3): se calculan aquí, una vez por análisis — no en cada render
        // ni en cada tecla de la búsqueda.
        detectarLateinitSinInicializarKotlin(elementos, escrubado, ctx.avisos);
        detectarImportsNoUsadosKotlin(ctx.imports, escrubado, ctx.avisos);

        return { imports: ctx.imports, elementos, avisos: ctx.avisos };
    }

    function escrubarXMLComentarios(texto) {
        const out = texto.split('');
        let i = 0;
        while (i < texto.length) {
            if (texto[i] === '<' && texto[i + 1] === '!' && texto[i + 2] === '-' && texto[i + 3] === '-') {
                let j = i;
                while (j < texto.length && !(texto[j] === '-' && texto[j + 1] === '-' && texto[j + 2] === '>')) {
                    if (texto[j] !== '\n') out[j] = ' ';
                    j++;
                }
                for (let k = j; k < j + 3 && k < texto.length; k++) if (texto[k] !== '\n') out[k] = ' ';
                i = j + 3;
                continue;
            }
            i++;
        }
        return out.join('');
    }

    function numeroDeLineaXML(texto, index) {
        let n = 1;
        for (let i = 0; i < index && i < texto.length; i++) if (texto[i] === '\n') n++;
        return n;
    }

    function extraerAtributosXML(atributosTexto) {
        const atributos = {};
        const re = /([\w:.-]+)\s*=\s*"([^"]*)"|([\w:.-]+)\s*=\s*'([^']*)'/g;
        let m;
        while ((m = re.exec(atributosTexto)) !== null) {
            if (m[1] !== undefined) atributos[m[1]] = m[2];
            else atributos[m[3]] = m[4];
        }
        return atributos;
    }

    function* buscarElementosXML(texto, nombreTag, inicioBusqueda, finBusqueda) {
        if (inicioBusqueda === undefined) inicioBusqueda = 0;
        if (finBusqueda === undefined) finBusqueda = texto.length;
        const reAbrir = new RegExp('<' + nombreTag + '(\\s[^>]*?)?(/?)>', 'g');
        reAbrir.lastIndex = inicioBusqueda;
        let m;
        while ((m = reAbrir.exec(texto)) !== null) {
            if (m.index >= finBusqueda) break;
            const atributosTexto = m[1] || '';
            const autocierre = m[2] === '/';
            const inicioTag = m.index;
            const finAperturaTag = reAbrir.lastIndex;
            let inicioCuerpo = finAperturaTag, finCuerpo = finAperturaTag, finBloque = finAperturaTag;
            if (!autocierre) {
                const reCierre = new RegExp('</' + nombreTag + '\\s*>', 'g');
                reCierre.lastIndex = finAperturaTag;
                const mc = reCierre.exec(texto);
                if (mc && mc.index < finBusqueda) {
                    finCuerpo = mc.index;
                    finBloque = reCierre.lastIndex;
                } else {
                    finCuerpo = Math.min(finBusqueda, texto.length);
                    finBloque = finCuerpo;
                }
            }
            yield { atributosTexto, autocierre, inicio: inicioTag, inicioCuerpo, finCuerpo, fin: finBloque };
            if (finBloque > reAbrir.lastIndex) reAbrir.lastIndex = finBloque;
        }
    }

    function parsearManifest(texto) {
        const escrubado = escrubarXMLComentarios(texto);

        const permisos = [];
        for (const el of buscarElementosXML(escrubado, 'uses-permission')) {
            const atributos = extraerAtributosXML(el.atributosTexto);
            permisos.push({ nombre: atributos['android:name'] || null, atributos, linea: numeroDeLineaXML(texto, el.inicio) });
        }

        let application = null;
        for (const el of buscarElementosXML(escrubado, 'application')) {
            application = { atributos: extraerAtributosXML(el.atributosTexto), linea: numeroDeLineaXML(texto, el.inicio) };
            break;
        }

        const activities = [];
        for (const el of buscarElementosXML(escrubado, 'activity')) {
            const atributos = extraerAtributosXML(el.atributosTexto);
            const cuerpo = escrubado.slice(el.inicioCuerpo, el.finCuerpo);
            const esLanzadora = /android:name\s*=\s*["']android\.intent\.action\.MAIN["']/.test(cuerpo)
                && /android:name\s*=\s*["']android\.intent\.category\.LAUNCHER["']/.test(cuerpo);
            activities.push({ nombre: atributos['android:name'] || null, atributos, esLanzadora, linea: numeroDeLineaXML(texto, el.inicio) });
        }

        const otros = [];
        ['uses-feature', 'service', 'receiver', 'provider', 'meta-data', 'permission', 'queries'].forEach(tag => {
            for (const el of buscarElementosXML(escrubado, tag)) {
                otros.push({ tipo: tag, atributos: extraerAtributosXML(el.atributosTexto), linea: numeroDeLineaXML(texto, el.inicio) });
            }
        });

        return { permisos, application, activities, otros };
    }

    function extraerBloqueGradle(escrubado, profundidad, nombreBloque) {
        for (let i = 0; i < escrubado.length; i++) {
            if (profundidad[i] === 0 && coincideEnKotlin(escrubado, i, nombreBloque)) {
                let j = i + nombreBloque.length;
                while (j < escrubado.length && /\s/.test(escrubado[j])) j++;
                if (escrubado[j] === '{') {
                    const iClose = encontrarCierreLlaveKotlin(escrubado, profundidad, j);
                    return { inicio: j + 1, fin: iClose };
                }
            }
        }
        return null;
    }

    function escrubarSoloComentariosGradle(texto, tipoMap) {
        let out = '';
        for (let i = 0; i < texto.length; i++) {
            out += (tipoMap[i] === 'comentario') ? (texto[i] === '\n' ? '\n' : ' ') : texto[i];
        }
        return out;
    }

    function parsearGradleSettings(texto) {
        const tipoMap = tokenizarKotlin(texto);
        const sinComentarios = escrubarSoloComentariosGradle(texto, tipoMap);
        let nombreProyecto = null;
        const modulos = [];

        let m = /rootProject\.name\s*=\s*["']([^"']+)["']/.exec(sinComentarios);
        if (m) nombreProyecto = m[1];

        const reInclude = /\binclude\b([^\n]*)/g;
        while ((m = reInclude.exec(sinComentarios)) !== null) {
            const resto = m[1];
            const reModulo = /["']([^"']+)["']/g;
            let mm;
            while ((mm = reModulo.exec(resto)) !== null) {
                modulos.push({ ruta: mm[1], linea: numeroDeLineaKotlin(texto, m.index) });
            }
        }
        return { tipo: 'gradle-settings', nombreProyecto, modulos };
    }

    function parsearGradleBuild(texto) {
        const tipoMap = tokenizarKotlin(texto);
        const escrubado = escrubarKotlin(texto, tipoMap);
        const sinComentarios = escrubarSoloComentariosGradle(texto, tipoMap);
        const profundidad = calcularProfundidadesKotlin(escrubado);

        const plugins = [];
        const dependencias = [];

        const bloquePlugins = extraerBloqueGradle(escrubado, profundidad, 'plugins');
        if (bloquePlugins) {
            const reId = /\bid\s*\(?\s*["']([^"']+)["']/g;
            reId.lastIndex = bloquePlugins.inicio;
            let m;
            while ((m = reId.exec(sinComentarios)) !== null && m.index < bloquePlugins.fin) {
                plugins.push({ id: m[1], linea: numeroDeLineaKotlin(texto, m.index) });
            }
        }

        const bloqueDeps = extraerBloqueGradle(escrubado, profundidad, 'dependencies');
        if (bloqueDeps) {
            // Nota (Fase 2, matiz acordado): la forma "group: 'x', name: 'y',
            // version: 'z'" existe pero es rara en Android moderno; se ignora
            // aquí adrede (mejora futura si aparece en un proyecto real).
            const reDep = /\b(implementation|api|testImplementation|androidTestImplementation|debugImplementation|releaseImplementation|kapt|annotationProcessor|compileOnly|runtimeOnly)\b\s*\(?\s*["']([^"']+)["']/g;
            reDep.lastIndex = bloqueDeps.inicio;
            let m;
            while ((m = reDep.exec(sinComentarios)) !== null && m.index < bloqueDeps.fin) {
                dependencias.push({ configuracion: m[1], artefacto: m[2], linea: numeroDeLineaKotlin(texto, m.index) });
            }
        }

        return { tipo: 'gradle-build', plugins, dependencias };
    }

        { nombre: 'Retrofit', importa: /^retrofit2\./, tiene: /com\.squareup\.retrofit2:retrofit/, dep: 'com.squareup.retrofit2:retrofit:2.9.0' },

    const PERMISOS_POR_API_ANDROID = [
        { permiso: 'android.permission.INTERNET', re: /\b(?:HttpURLConnection|HttpsURLConnection|OkHttpClient|Retrofit)\b|\bURL\s*\(|\.openConnection\s*\(/, texto: /\bloadUrl\s*\(\s*["']https?:/, dep: /okhttp|retrofit|volley|ktor|com\.github\.bumptech\.glide|io\.coil-kt/ },

        { permiso: 'android.permission.RECORD_AUDIO', re: /\b(?:MediaRecorder|AudioRecord|SpeechRecognizer)\b/ },
        { permiso: 'android.permission.ACCESS_FINE_LOCATION', alt: 'android.permission.ACCESS_COARSE_LOCATION', re: /\b(?:LocationManager|FusedLocationProviderClient|requestLocationUpdates|getLastKnownLocation|getCurrentLocation)\b/ },
