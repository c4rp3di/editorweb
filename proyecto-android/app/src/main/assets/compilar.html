    const GRADLE_MINIMO_POR_AGP = { '8.0': [8, 0], '8.1': [8, 0], '8.2': [8, 2], '8.3': [8, 4], '8.4': [8, 6], '8.5': [8, 7], '8.6': [8, 7], '8.7': [8, 9], '8.8': [8, 10], '8.9': [8, 11], '8.10': [8, 11], '8.11': [8, 13] };

    const GRADLE_DEL_WORKFLOW_ANDROID = [8, 7];

    function extraerVersionAgp(rootGradle) {
        const texto = rootGradle || '';
        return /com\.android\.application['"]\s*version\s*['"](\d+)\.(\d+)/.exec(texto)
            || /com\.android\.tools\.build:gradle:(\d+)\.(\d+)/.exec(texto);
    }

    function versionGradleParaProyecto(proyecto) {
        const suelo = GRADLE_DEL_WORKFLOW_ANDROID;
        const rootGradle = proyecto && proyecto.archivos && proyecto.archivos['_raiz/build.gradle'];
        const agp = extraerVersionAgp(rootGradle);
        if (!agp) return suelo;
        const req = GRADLE_MINIMO_POR_AGP[agp[1] + '.' + agp[2]];
        if (!req) return suelo;
        const reqEsMayor = req[0] > suelo[0] || (req[0] === suelo[0] && req[1] > suelo[1]);
        return reqEsMayor ? req : suelo;
    }

    function diagnosticoAndroidCompilacion(proyecto) {
        const p = proyecto || {};
        const archivos = p.archivos || {};
        const problemas = [];
        const estadisticas = { archivos: 0, errores: 0, avisos: 0, informativos: 0, noVerificables: 0, referencias: 0 };
        const add = (nivel, codigo, mensaje, ruta, linea, detalle) => {
            const x = { nivel, codigo, mensaje, ruta: ruta || null, linea: linea || null, detalle: detalle || null };
            problemas.push(x);
            estadisticas[nivel === 'error' ? 'errores' : nivel === 'aviso' ? 'avisos' : nivel === 'no-verificable' ? 'noVerificables' : 'informativos']++;
        };
        const contenidoDe = ruta => {
            const v = archivos[ruta];
            return typeof v === 'string' ? v : (v && typeof v.contenido === 'string' ? v.contenido : '');
        };
        const linea = (texto, idx) => numeroDeLineaKotlin(texto, Math.max(0, idx || 0));
        const rutas = Object.keys(archivos).filter(r => !REGEX_RAIZ_EXTRA.test(r) && !REGEX_WF_EXTRA.test(r));
        estadisticas.archivos = rutas.length;
        if (!rutas.length) {
            add('error', 'PROYECTO_VACIO', 'El proyecto Android no contiene archivos.', null, null);
            return { estado: 'no-compila', certeza: 'determinista', problemas, estadisticas, resumen: 'No se puede compilar un proyecto vacío.' };
        }

        // ---- Auxiliares de las reglas de recursos (v2: menos falsos positivos) ----
        // Android normaliza los puntos de los nombres: "Theme.App" ≡ R.style.Theme_App.
        const normRecurso = n => String(n || '').replace(/\./g, '_');
        const _gradleAppTemprano = rutas.find(r => r === 'build.gradle' || r === 'build.gradle.kts');
        const tieneLibrerias = !!_gradleAppTemprano && /\b(?:implementation|api|compileOnly|kapt|ksp)\b/.test(contenidoDe(_gradleAppTemprano));
        // Recurso que el proyecto no define pero que suelen aportar AppCompat/Material/etc.: solo con librerías declaradas.
        const esRecursoDeLibreria = (tipo, nombre) => {
            if (!tieneLibrerias) return false;
            if (tipo === 'style') return /^(?:Theme_(?:AppCompat|Material|MaterialComponents|Material3|Leanback)|ThemeOverlay_|Widget_|TextAppearance_|Base_|Platform_|Animation_|Preference_|ShapeAppearance|MaterialAlertDialog)/.test(nombre);
            return /^(?:abc_|appbar_|material_|mtrl_|m3_|design_|common_|mr_|fab_|bottom_sheet_|character_counter|password_toggle|icon_content_description|error_icon|clear_text|exposed_dropdown|item_view_role|searchbar_|side_sheet_|androidx_|googleg_|navigation_menu|call_notification|status_bar_notification|notification_)/.test(nombre);
        };
        const faltante = (codigoError, tipo, nombre, mensaje, ruta, ln) => {
            if (esRecursoDeLibreria(tipo, nombre)) return add('no-verificable', 'RECURSO_DE_LIBRERIA', 'Recurso ' + tipo + '/' + nombre + ' no definido en el proyecto; se asume que lo aporta una librería (no verificable sin Gradle).', ruta, ln);
            add('error', codigoError, mensaje, ruta, ln);
            if (['string', 'color', 'dimen', 'bool', 'integer'].includes(tipo)) problemas[problemas.length - 1].arreglo = { etiqueta: 'Crear ' + tipo + ' "' + nombre + '" en res/values', ops: [{ op: 'valor', tipo, nombre }] };
        };
        // drawable/mipmap pueden vivir en carpetas con calificador (drawable-hdpi, mipmap-anydpi-v26...).
        const hayGrafico = (tipo, nombre) => (tipo === 'mipmap' && !!p.icono && /^ic_launcher(_round)?$/.test(nombre)) || rutas.some(r => new RegExp('^res/' + tipo + '(?:-[^/]+)?/[^/]+$').test(r) && r.split('/').pop().split('.')[0] === nombre);
        // Comentarios y CDATA no cuentan como código XML (se conservan los saltos de línea para no mover las líneas).
        const quitarComentariosYCdata = t => String(t || '').replace(/<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>/g, m => m.replace(/[^\n]/g, ' '));
        const addFix = (nivel, codigo, mensaje, ruta, ln, arreglo) => { add(nivel, codigo, mensaje, ruta, ln); if (arreglo) problemas[problemas.length - 1].arreglo = arreglo; };

        // 1) XML: balance estructural y referencias de recursos.
        const recursoDefs = new Map();
        const idDefs = new Map();
        const layouts = new Map();
        const xmlRefs = [];
        const addDef = (map, key, ruta, ln) => { if (!key) return; const arr = map.get(key) || []; arr.push({ ruta, linea: ln }); map.set(key, arr); };
        const revisarXml = (ruta, texto) => {
            const stack = [];
            const limpio = quitarComentariosYCdata(texto);
            const re = /<!--[\s\S]*?-->|<\?(?:[\s\S]*?)\?>|<!DOCTYPE[^>]*>|<([A-Za-z_][\w:.-]*)(?:\s(?:"[^"]*"|'[^']*'|[^<>"'])*?)?(\/?)>|<\/([A-Za-z_][\w:.-]*)\s*>/g;
            let m;
            while ((m = re.exec(limpio)) !== null) {
                const token = m[0];
                if (token.startsWith('<!--') || token.startsWith('<?') || /^<!DOCTYPE/i.test(token)) continue;
                if (m[3]) {
                    const esperado = stack.pop();
                    if (esperado !== m[3]) add('error','XML_TAG_DESBALANCEADO',`Cierre </${m[3]}> sin correspondencia (se esperaba ${esperado ? '</'+esperado+'>' : 'ningún cierre'}).`,ruta,linea(texto,m.index));
                } else if (m[1] && m[2] !== '/') {
                    stack.push(m[1]);
                }
            }
            if (stack.length) add('error','XML_SIN_CIERRE',`Hay etiquetas XML sin cerrar: ${stack.slice(-5).join(', ')}${stack.length>5?'…':''}.`,ruta,null);
            const refs = limpio.match(/@(layout|id|string|color|drawable|mipmap|style|dimen|bool|integer|menu|array|plurals|anim|raw|font|xml)\/[A-Za-z_][\w.]*/g) || [];
            refs.forEach(ref => xmlRefs.push({ ruta, ref: ref.replace(/\.+$/, '') }));
            if (/(?:^|\/)res\/layout[^/]*\//.test(ruta)) layouts.set(ruta.split('/').pop().replace(/\.xml$/,''), ruta);
            if (/(?:^|\/)res\//.test(ruta)) {
                // Los @+id también nacen en menu/, navigation/, drawable/, xml/ y layout-*; y en values/ vía <item type="id">.
                [...limpio.matchAll(/(?:android:|app:)?id\s*=\s*["']@\+id\/([A-Za-z_][\w]*)["']/g)].forEach(x => addDef(idDefs,x[1],ruta,linea(texto,x.index)));
                [...limpio.matchAll(/<item\b[^>]*\btype\s*=\s*["']id["'][^>]*>/g)].forEach(x => { const nm = /\bname\s*=\s*["']([^"']+)["']/.exec(x[0]); if (nm) addDef(idDefs, normRecurso(nm[1]), ruta, linea(texto, x.index)); });
            }
        };
        rutas.filter(r => r.endsWith('.xml')).forEach(ruta => revisarXml(ruta, contenidoDe(ruta)));
        rutas.filter(r => /(?:^|\/)res\/values[^/]*\/[^/]+\.xml$/.test(r)).forEach(ruta => {
            const texto=quitarComentariosYCdata(contenidoDe(ruta));
            const re=/<(string|color|dimen|bool|integer|style)\b[^>]*\bname\s*=\s*["']([^"']+)["']/g; let m;
            while((m=re.exec(texto))!==null) addDef(recursoDefs,m[1]+'/'+normRecurso(m[2]),ruta,linea(texto,m.index));
            const reArr=/<(string-array|integer-array|array|plurals)\b[^>]*\bname\s*=\s*["']([^"']+)["']/g; let ma;
            while((ma=reArr.exec(texto))!==null) addDef(recursoDefs,(ma[1]==='plurals'?'plurals':'array')+'/'+normRecurso(ma[2]),ruta,linea(texto,ma.index));
        });
        const recursoAlias = ref => ref.replace(/^@/,'');
        xmlRefs.forEach(({ruta,ref}) => {
            const key=recursoAlias(ref).replace(/^([a-z]+)\/(.*)$/, (_, t, nn) => t + '/' + normRecurso(nn));
            if (key.startsWith('layout/')) {
                const n=key.slice(7); if(!layouts.has(n)) add('error','RECURSO_LAYOUT_INEXISTENTE',`Se referencia @layout/${n}, pero no existe ese layout.`,ruta,null);
            } else if (key.startsWith('id/')) {
                const n=key.slice(3); if(!idDefs.has(n)) add('error','RECURSO_ID_INEXISTENTE',`Se referencia @id/${n}, pero no existe ese ID.`,ruta,null);
            } else if (!recursoDefs.has(key) && !key.startsWith('android:')) {
                // drawable/mipmap pueden existir como archivos, así que se comprueban aparte.
                const [tipo,n]=key.split('/');
                const existeArchivo = hayGrafico(tipo, n);
                if (!existeArchivo && ['string','color','dimen','bool','integer','style','array','plurals'].includes(tipo)) faltante('RECURSO_INEXISTENTE',tipo,n,`Se referencia @${key}, pero no se ha encontrado su definición.`,ruta,null);
                else if (!existeArchivo && ['drawable','mipmap'].includes(tipo)) add('aviso','RECURSO_GRAFICO_NO_LOCALIZADO',`No se ha localizado un recurso ${key} entre los archivos disponibles.`,ruta,null);
                else if (!existeArchivo && ['menu','anim','raw','font','xml'].includes(tipo)) faltante('RECURSO_ARCHIVO_INEXISTENTE',tipo,n,`Se referencia @${key}, pero no existe el archivo res/${tipo}/${n}.`,ruta,null);
            }
        });
        // IDs duplicados: @+id repetido en distintos archivos es un error cuando se usa como R.id global.
        idDefs.forEach((arr,nombre)=>{ const porRuta=new Map(); arr.forEach(d=>porRuta.set(d.ruta,(porRuta.get(d.ruta)||0)+1)); porRuta.forEach((cnt,r)=>{ if(cnt>1) add('aviso','ID_REPETIDO_EN_LAYOUT',`El ID @+id/${nombre} aparece ${cnt} veces en el mismo archivo; findViewById solo devolverá el primero.`,r,(arr.find(d=>d.ruta===r)||{}).linea); }); });

        // 2) Kotlin: sintaxis estructural, duplicados ya detectados por el mapa y referencias R.*.
        const clases = new Map();
        const clasesQ = new Map(); // nombre calificado (paquete + clases contenedoras)
        const importsProyecto = []; // v3: imports del código, para dependencias/plugins
        const usosPermiso = new Map(); // v3: permiso → primer uso detectado
        const funcionesPorArchivo = new Map();
        const kotlinArchivos = rutas.filter(r=>r.endsWith('.kt'));
        kotlinArchivos.forEach(ruta=>{
            const texto=contenidoDe(ruta);
            let parsed=null;
            try { parsed=parsearKotlin(texto); } catch(e) { add('error','KOTLIN_PARSER',`El analizador Kotlin no pudo procesar el archivo: ${e.message}.`,ruta,null); return; }
            (parsed.avisos||[]).filter(a=>a.tipo==='error-parser').forEach(a=>add('error','KOTLIN_PARSE',a.mensaje,ruta,a.linea));
            const pkgArch=((/^\s*package\s+([A-Za-z_][\w.]*)/m.exec(texto))||[])[1]||'';
            const contar=(els,pref)=> (els||[]).forEach(el=>{
                if(el.tipo==='clase'){
                    const arr=clases.get(el.nombre)||[]; arr.push({ruta,linea:el.linea}); clases.set(el.nombre,arr);
                    const q=(pref?pref+'.':'')+el.nombre; const arrQ=clasesQ.get(q)||[]; arrQ.push({ruta,linea:el.linea}); clasesQ.set(q,arrQ);
                    contar(el.miembros,q);
                }
            });
            contar(parsed.elementos,pkgArch);
            const fns=[]; const recorrer=(els)=> (els||[]).forEach(el=>{ if(el.tipo==='funcion') fns.push(el.nombre); if(el.tipo==='clase') recorrer(el.miembros); }); recorrer(parsed.elementos); funcionesPorArchivo.set(ruta,fns);
            const tipoMap=tokenizarKotlin(texto), escrubado=escrubarKotlin(texto,tipoMap);
            let m; const re=/(^|[^\w.])R\.(layout|id|string|color|drawable|mipmap|style|dimen|bool|integer|menu|array|plurals|anim|raw|font|xml)\.([A-Za-z_][\w]*)/g; // el [^\w.] excluye android.R.* y librería.R.*
            while((m=re.exec(escrubado))!==null){
                estadisticas.referencias++;
                const tipo=m[2], nombre=m[3];
                if(tipo==='layout' && !layouts.has(nombre)) add('error','R_LAYOUT_INEXISTENTE',`R.layout.${nombre} no tiene un layout correspondiente.`,ruta,linea(texto,m.index+m[1].length));
                else if(tipo==='id' && !idDefs.has(nombre)) add('error','R_ID_INEXISTENTE',`R.id.${nombre} no tiene un @+id correspondiente.`,ruta,linea(texto,m.index+m[1].length));
                else if(['string','color','style','dimen','bool','integer','array','plurals'].includes(tipo) && !recursoDefs.has(tipo+'/'+nombre) && !(tipo==='color' && hayGrafico('color',nombre))) faltante('R_RECURSO_INEXISTENTE',tipo,nombre,`R.${tipo}.${nombre} no tiene una definición de recurso correspondiente.`,ruta,linea(texto,m.index+m[1].length));
                else if(['drawable','mipmap'].includes(tipo) && !hayGrafico(tipo,nombre)) faltante('R_GRAFICO_INEXISTENTE',tipo,nombre,`R.${tipo}.${nombre} no tiene un archivo de recurso correspondiente.`,ruta,linea(texto,m.index+m[1].length));
                else if(['menu','anim','raw','font','xml'].includes(tipo) && !hayGrafico(tipo,nombre)) faltante('R_ARCHIVO_INEXISTENTE',tipo,nombre,`R.${tipo}.${nombre} no tiene un archivo en res/${tipo}.`,ruta,linea(texto,m.index+m[1].length));
            }
            // v3: imports y APIs que exigen permisos (sobre el código ya sin comentarios ni cadenas).
            const reImp=/^[ \t]*import[ \t]+([A-Za-z_][\w.]*)/gm; let mi;
            while((mi=reImp.exec(escrubado))!==null) importsProyecto.push({imp:mi[1],ruta,linea:linea(texto,mi.index)});
            PERMISOS_POR_API_ANDROID.forEach(pa=>{
                if(usosPermiso.has(pa.permiso)) return;
                const mu=pa.re.exec(escrubado) || (pa.texto && pa.texto.exec(texto));
                if(mu) usosPermiso.set(pa.permiso,{ruta,linea:linea(texto,mu.index)});
            });
            const reMP=/\bManifest\.permission\.([A-Z_]+)/g; let mq;
            while((mq=reMP.exec(escrubado))!==null){ const pn='android.permission.'+mq[1]; if(!usosPermiso.has(pn)) usosPermiso.set(pn,{ruta,linea:linea(texto,mq.index)}); }
            // Package declarado: útil para detectar un archivo colocado fuera de su ruta esperada.
            const pm=/^\s*package\s+([A-Za-z_][\w.]*)/m.exec(texto);
            if(pm && p.paquete && !pm[1].startsWith(p.paquete+'.') && pm[1]!==p.paquete) add('aviso','PACKAGE_DIFERENTE',`El package declarado (${pm[1]}) no coincide con el paquete configurado (${p.paquete}).`,ruta,linea(texto,pm.index));
        });
        clasesQ.forEach((arr,nombre)=>{ if(arr.length>1) add('error','CLASE_DUPLICADA',`La clase ${nombre} está declarada ${arr.length} veces en el mismo paquete/ámbito.`,arr[0].ruta,arr[0].linea); });

        // 3) Manifest ↔ clases Kotlin.
        const manifestRuta=rutas.find(r=>r.split('/').pop()==='AndroidManifest.xml');
        let manifest=null;
        if(!manifestRuta) add('error','MANIFEST_AUSENTE','No existe AndroidManifest.xml.',null,null);
        else {
            try { manifest=parsearManifest(contenidoDe(manifestRuta)); } catch(e) { add('error','MANIFEST_PARSE',`No se pudo analizar AndroidManifest.xml: ${e.message}.`,manifestRuta,null); }
            if(manifest){
                (manifest.activities||[]).forEach(a=>{
                    if(!a.nombre) return;

        const revisarLlaves=(texto,ruta)=>{ let n=0; const tipoMap=tokenizarKotlin(texto); const scr=escrubarKotlin(texto,tipoMap); for(let i=0;i<scr.length;i++){if(scr[i]==='{')n++;else if(scr[i]==='}')n--; if(n<0){add('error','LLAVE_DESBALANCEADA','Hay una llave de cierre sin apertura.',ruta,linea(texto,i)); return;}} if(n!==0)add('error','LLAVES_SIN_CERRAR',`Quedan ${n} bloque(s) con llaves sin cerrar.`,ruta,null); };

        kotlinArchivos.forEach(r=>revisarLlaves(contenidoDe(r),r));

            if(!/plugins\s*\{|apply\s+plugin\s*:/i.test(appGradle)) add('aviso','GRADLE_SIN_PLUGINS','No se ha detectado un bloque plugins/apply plugin reconocible en el Gradle del módulo app.',appGradleRuta,null);

    function botones(lista) {

    // Orden y búsqueda de la lista de proyectos. Con texto de búsqueda: solo coincidencias, las mejores primero.
    function listaOrdenada(q) {
        const u = ui();
        let n = Object.keys(proyectos).filter(x => u.filtro === 'dedicados' ? !!(proyectos[x].repoDedicado && proyectos[x].repoDedicado.repo) : u.filtro === 'compartidos' ? !(proyectos[x].repoDedicado && proyectos[x].repoDedicado.repo) : true);
        q = (q || '').trim().toLowerCase();
        if (q) {
            const sc = x => { const p = proyectos[x], nm = x.toLowerCase(); if (nm.startsWith(q)) return 0; if (nm.includes(q)) return 1; if ((p.paquete || '').toLowerCase().includes(q)) return 2; if ((p.nombreApp || '').toLowerCase().includes(q)) return 3; return 9; };
            return n.filter(x => sc(x) < 9).sort((a, b) => sc(a) - sc(b) || a.localeCompare(b, 'es'));
        }
        const clave = { nombre: x => x.toLowerCase(), compilacion: x => (proyectos[x].ultimaCompilacion && proyectos[x].ultimaCompilacion.fecha) || '', version: x => Number(proyectos[x].versionCode) || 0, creacion: x => proyectos[x].creado || proyectos[x].fecha || '' }[u.orden] || (x => x.toLowerCase());
        n.sort((a, b) => {
            const ka = clave(a), kb = clave(b);
            let c = typeof ka === 'number' ? ka - kb : String(ka).localeCompare(String(kb), 'es');
            if (u.orden !== 'nombre') c = -c; // fechas y versiones: lo más reciente / alto primero
            if (u.inv) c = -c;
            return c || a.localeCompare(b, 'es');
        });
        return n;
    }

        const p = proyectos[n], uc = p.ultimaCompilacion;

            '<p><small>' + esc(p.paquete || '') + ' · ' + (rd ? '📦 ' + esc(p.repoDedicado.owner + '/' + p.repoDedicado.repo) : 'repo compartido') + '</small></p>' +

    // Recupera fichas desde GitHub: repos «fusion-*» con proyecto-android. Vincula el repo a la ficha existente de mismo nombre
    // (aunque se hubiera perdido) o crea la ficha. No depende del JSON de Fusion.
    async function buscarProyectosEnGitHub() {
        const cfg0 = cargarConfigGitHub();
        if (!configGitHubCompleta(cfg0)) { mostrarToast('⚠️ Configura GitHub primero'); renderAjustes(); return; }
        mostrarToast('🔎 Buscando repositorios fusion-*…');
        try {
            const repos = [];
            for (let pag = 1; pag <= 5; pag++) {
                const res = await fetch('https://api.github.com/user/repos?per_page=100&affiliation=owner&sort=updated&page=' + pag, { headers: cabecerasApiGitHub(cfg0) });
                const d = await res.json().catch(() => null);
                if (!res.ok) throw new Error((d && d.message) || ('HTTP ' + res.status));
                if (!Array.isArray(d) || !d.length) break;
                d.forEach(r => { if (/^fusion-/.test(r.name)) repos.push(r); });
                if (d.length < 100) break;
            }
            if (!repos.length) { mostrarToast('ℹ️ No hay repositorios fusion-* en tu cuenta'); return; }
            const hallados = [];
            let sig = 0;
            const trabajador = async () => {
                while (sig < repos.length) {
                    const r = repos[sig++];
                    const cfgR = { owner: (r.owner && r.owner.login) || cfg0.owner, repo: r.name, branch: r.default_branch || 'main', token: cfg0.token };
                    try {
                        const rg = await contentsApiGitHub(cfgR, 'contents/' + APK_NATIVO_CARPETA + '/app/build.gradle?ref=' + encodeURIComponent(cfgR.branch));
                        if (!rg.ok) continue; // sin proyecto-android: no es un proyecto de Fusion/Compila
                        const dg = await rg.json().catch(() => null);
                        if (!dg || !dg.content) continue;
                        const g = zipImpDecodificarTexto(base64ABytes(String(dg.content).replace(/\s/g, '')));
                        const vc = /versionCode\s*=?\s*(\d+)/.exec(g);
                        const pq = /applicationId\s*=?\s*['"]([\w.]+)['"]/.exec(g) || /namespace\s*=?\s*['"]([\w.]+)['"]/.exec(g);
                        hallados.push({ cfg: cfgR, vc: vc ? Number(vc[1]) : 1, paquete: pq ? pq[1] : '' });
                    } catch (_) {}
                }
            };
            await Promise.all([trabajador(), trabajador(), trabajador(), trabajador()]);
            let nuevos = 0, vinculados = 0, actualizados = 0;
            const lineas = [];
            hallados.sort((x, y) => x.cfg.repo.localeCompare(y.cfg.repo)).forEach(h => {
                const rd = { owner: h.cfg.owner, repo: h.cfg.repo, branch: h.cfg.branch };
                let nombre = Object.keys(proyectos).find(n => proyectos[n].repoDedicado && proyectos[n].repoDedicado.repo === h.cfg.repo);
                if (nombre) {
                    const p = proyectos[nombre];
                    if (h.vc > (Number(p.versionCode) || 1)) { p.versionCode = h.vc; actualizados++; lineas.push('♻️ ' + nombre + ': versionCode ' + h.vc); }
                    return;
                }
                nombre = Object.keys(proyectos).find(n => 'fusion-' + (slugPublicar(n) || 'proyecto') === h.cfg.repo);
                if (nombre) {
                    const p = proyectos[nombre];
                    p.repoDedicado = rd; if (h.vc > (Number(p.versionCode) || 1)) p.versionCode = h.vc;
                    vinculados++; lineas.push('🔗 ' + nombre + ' → ' + h.cfg.repo);
                    return;
                }
                nombre = h.cfg.repo.replace(/^fusion-/, '');
                let base = nombre, k = 2; while (proyectos[nombre]) nombre = base + ' ' + k++;
                proyectos[nombre] = { tipo: 'android', paquete: h.paquete, nombreApp: nombre, versionCode: h.vc, ultimaVersion: 'v' + h.vc + '.0', fecha: new Date().toISOString().slice(0, 10), creado: new Date().toISOString(), repoDedicado: rd };
                nuevos++; lineas.push('➕ ' + nombre + ' (' + (h.paquete || 'sin paquete') + ')');
            });
            await guardarProyectos();
            renderInicio();
            const det = document.querySelector('details[data-sec="proys"]'); if (det) det.open = true;
            mostrarInformeAnalisis('🔎 Búsqueda en GitHub', '<p>' + hallados.length + ' repositorio(s) con proyecto Android: ' + nuevos + ' nuevo(s), ' + vinculados + ' vinculado(s) a fichas existentes, ' + actualizados + ' con versión actualizada.</p>' + (lineas.length ? '<ul>' + lineas.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>' : '<p class="suave">Todo estaba al día.</p>'));
        } catch (e) { mostrarToast('❌ ' + (e && e.message ? e.message : e)); }
    }

    // En la pantalla de recepción: si el proyecto elegido no tiene repo dedicado anotado pero existe fusion-<nombre>, se avisa.
    async function comprobarRepoExistente(nombre) {
        const p = proyectos[nombre];
        const marca = document.querySelector('[data-repoinfo]');
        if (!p || !marca || p.repoDedicado) return;
        const cfg0 = cargarConfigGitHub(); if (!configGitHubCompleta(cfg0)) return;
        const repo = 'fusion-' + (slugPublicar(nombre) || 'proyecto');
        try {
            const cfgC = Object.assign({}, cfg0, { repo });
            const r = await contentsApiGitHub(cfgC, 'contents/' + APK_NATIVO_CARPETA + '/app/build.gradle?ref=' + encodeURIComponent(cfg0.branch || 'main'));
            let vc = ''; 
            if (r.ok) { const d = await r.json().catch(() => null); const m = d && d.content ? /versionCode\s*=?\s*(\d+)/.exec(zipImpDecodificarTexto(base64ABytes(String(d.content).replace(/\s/g, '')))) : null; if (m) vc = ' · versionCode en el repo: ' + m[1]; }
            else { const r2 = await contentsApiGitHub(cfgC, 'contents/' + APK_NATIVO_CARPETA); if (!r2.ok) return; }
            if (document.querySelector('[data-repoinfo]') === marca) marca.textContent = '📦 existe ' + repo + ': se reutilizará (con su firma)' + vc;
        } catch (_) {}
    }

    // ---------- Releases de GitHub (misma llamada que Fusion: releases?per_page=30) ----------
    async function cargarReleases(det) {
        const cont = det.querySelector('.relcont'); if (!cont) return;
        const clave = det.dataset.rel;
        let cfg;
        if (clave === '__compartido__') cfg = cargarConfigGitHub();
        else { const p = proyectos[clave]; if (!p || !p.repoDedicado) return; cfg = cfgGitHubDeProyecto(p); if (!cfg.token) cfg.token = cargarConfigGitHub().token; }
        if (!configGitHubCompleta(cfg)) { cont.innerHTML = '<p class="aviso">Configura GitHub primero en ⚙️ Ajustes.</p>'; return; }
        cont.innerHTML = '<p class="suave">⏳ Cargando…</p>';
        try {
            const res = await contentsApiGitHub(cfg, 'releases?per_page=30');
            if (!res.ok) { const ed = await res.json().catch(() => null); throw new Error((ed && ed.message) || ('HTTP ' + res.status)); }
            const data = await res.json().catch(() => null);
            const rels = Array.isArray(data) ? data : [];
            if (!rels.length) { cont.innerHTML = '<p class="suave">Este repositorio aún no tiene releases.</p>'; return; }
            cont.innerHTML = rels.map(r => {
                const assets = (r.assets || []).slice().sort((x, y) => (/\.apk$/i.test(y.name) ? 1 : 0) - (/\.apk$/i.test(x.name) ? 1 : 0));
                return '<div class="rel"><b>' + esc(r.tag_name || '') + '</b>' + (r.prerelease ? ' <span class="chip">prerelease</span>' : '') + '<br><small>' + esc(fmtFecha(r.published_at || r.created_at)) + '</small>' +
                    (assets.map(a => '<div style="margin-top:6px;">📄 ' + esc(a.name) + ' <small>(' + fmtTam(a.size) + ')</small><div class="botones"><button data-a="abrir" data-u="' + esc(a.browser_download_url) + '">⬇️ Descargar</button><button data-a="copiar" data-u="' + esc(a.browser_download_url) + '">📋 URL</button></div></div>').join('') || '<p class="suave"><small>Sin archivos.</small></p>') + '</div>';
            }).join('');
        } catch (e) { cont.innerHTML = '<p class="mal">❌ ' + esc(e && e.message ? e.message : e) + '</p>'; }
    }
    async function urlUltimoApk(n) {
        const p = proyectos[n]; if (!p) throw new Error('Proyecto desconocido');
        const cfg = (p.repoDedicado && p.repoDedicado.repo) ? cfgGitHubDeProyecto(p) : cargarConfigGitHub();
        if (!cfg.token) cfg.token = cargarConfigGitHub().token;
        try { return await buscarUltimoApkPublicado(cfg); }
        catch (e) { if (p.ultimaCompilacion && p.ultimaCompilacion.ok && p.ultimaCompilacion.url) return p.ultimaCompilacion.url; throw e; }
    }

    async function leerZipDelPuente() {
        const info = JSON.parse(P().zipInfo());
        const TROZO = 3 * 512 * 1024; // múltiplo de 3 bytes: cada trozo en base64 va sin relleno
        const partes = [];
        for (let off = 0; off < info.tamano; off += TROZO) partes.push(base64ABytes(P().zipTrozo(off, Math.min(TROZO, info.tamano - off))));
        return new File(partes, info.nombre || 'proyecto.zip', { type: 'application/zip' });
    }

    async function procesarZip(file) {
        C.nombreZip = file.name;
        pantalla('leyendo', '<div class="bloque"><p>⏳ Leyendo ZIP…</p></div>');
        try {
            const lectura = await zipImpLeerArchivo(file);
            const prefijo = zipImpPrefijoRaizComun([...lectura.mapa.keys()]);
            let mapa = lectura.mapa;
            if (prefijo) { mapa = new Map(); lectura.mapa.forEach((v, k) => mapa.set(k.slice(prefijo.length), v)); }
            if (zipImpDetectarTipo([...mapa.keys()]) !== 'android') {
                pantalla('error', '<div class="bloque"><p class="mal">⚠️ «' + esc(file.name) + '» no es un proyecto Android (no tiene AndroidManifest.xml ni archivos .kt).</p>' + botones(['inicio', 'elegir']) + '</div>');
                return;
            }
            const construido = zipImpConstruirAndroid(mapa, file.name.replace(/\.zip$/i, ''));
            if (!construido) { pantalla('error', '<div class="bloque"><p class="mal">⚠️ No se pudo interpretar el ZIP como proyecto Android.</p>' + botones(['inicio']) + '</div>'); return; }
            C.lectura = lectura; C.construido = construido;
            renderRecepcion();
        } catch (e) {
            console.error(e);
            pantalla('error', '<div class="bloque"><p class="mal">❌ No se pudo leer el ZIP: ' + esc(e && e.message ? e.message : e) + '</p>' + botones(['inicio', 'elegir']) + '</div>');
        }
    }

    function renderRecepcion() {
        const c = C.construido;
        if (!c) { renderInicio(); return; }
        let diag = null;
        try { diag = diagnosticoAndroidCompilacion({ tipo: 'android', archivos: c.archivos, paquete: c.paquete, nombreApp: c.nombreApp }); } catch (_) {}
        const omit = (C.lectura.omitidos || []).concat(c.omitidos || []);
        const estadoCorto = diag ? ({ 'ok-estatico': '<span class="ok">✅ sin errores</span>', 'no-compila': '<span class="mal">❌ con errores</span>', 'riesgo': '<span class="aviso">⚠️ con avisos</span>' }[diag.estado] || esc(diag.estado)) : '—';
        const probs = diag ? diag.problemas.filter(x => x.nivel === 'error' || x.nivel === 'aviso').slice(0, 8) : [];
        const nombres = Object.keys(proyectos);
        const mismo = n => proyectos[n].paquete === c.paquete;
        const mismos = nombres.filter(mismo);
        const fechaUc = n => (proyectos[n].ultimaCompilacion && proyectos[n].ultimaCompilacion.fecha) || '';
        let coincide = (C.destinoPreferido && proyectos[C.destinoPreferido] && mismo(C.destinoPreferido)) ? C.destinoPreferido : (mismos.slice().sort((x, y) => fechaUc(y).localeCompare(fechaUc(x)))[0] || null);
        const otros = mismos.filter(n => n !== coincide);
        const distintos = nombres.length - mismos.length;
        const pr = prefs();
        const fila = (n, marcado) => {
            const p = proyectos[n];
            return '<label class="fila"><input type="radio" name="dest" value="' + esc(n) + '"' + (marcado ? ' checked' : '') + '><span><b>' + esc(n) + '</b><br><small>' + esc(p.paquete || '') + ' · v' + esc(p.versionCode || 1) + (p.repoDedicado ? ' · 📦 ' + esc(p.repoDedicado.repo) : ' · <span data-repoinfo="' + esc(n) + '">repo compartido</span>') + '</small></span></label>';
        };
        // Aviso de versionCode: Compila no baja nunca del versionCode del proyecto (Android no deja instalar una versión menor encima).
        let avisoVc = '';
        if (coincide) {
            const vp = Number(proyectos[coincide].versionCode) || 1;
            if ((Number(c.versionCode) || 1) < vp) avisoVc = '<p class="aviso"><small>⚠️ El ZIP trae versionCode ' + esc(c.versionCode) + ' y «' + esc(coincide) + '» ya va por ' + vp + '. Compila lo subirá (mínimo ' + vp + ', y por encima del versionCode del repo si es mayor) para que Android permita actualizar la app instalada.</small></p>';
        }
        const avisoPref = (C.destinoPreferido && !coincide) ? '<p class="aviso"><small>⚠️ El ZIP tiene otro paquete («' + esc(c.paquete) + '») que «' + esc(C.destinoPreferido) + '». No se puede mezclar con ese proyecto.</small></p>' : '';
        const repoTxt = v => v === 'dedicado' ? 'dedicado' : 'compartido';
        pantalla('recepcion', `
            <div class="bloque">
                <h2>📱 Proyecto de destino</h2>
                ${coincide ? fila(coincide, true) : ''}
                <label class="fila"><input type="radio" name="dest" value="__nuevo__"${coincide ? '' : ' checked'}><span><b>➕ Proyecto nuevo</b><br><small>Se crea con este ZIP.</small></span></label>
                <div id="nuevoNombre" ${coincide ? 'style="display:none"' : ''}><label class="campo">Nombre del proyecto</label><input type="text" id="inNombre" value="${esc(c.nombreApp || c.paquete || 'proyecto')}"></div>
                ${otros.length ? '<details class="col sub"><summary>Otros con el mismo paquete (' + otros.length + ')</summary><div class="cuerpo">' + otros.map(n => fila(n, false)).join('') + '</div></details>' : ''}
                ${avisoPref}${avisoVc}
                ${nombres.length && !mismos.length ? '<p class="aviso"><small>Ningún proyecto tiene el paquete «' + esc(c.paquete) + '».</small></p>' : ''}
                ${distintos > 0 && mismos.length ? '<p class="suave"><small>' + distintos + ' proyecto(s) con otro paquete no se muestran.</small></p>' : ''}

    // ---------- Seguimiento en directo de la ejecución (pasos y registro de GitHub) ----------
    function pintarPasosVivo(steps) {
        const e = $('vivoPasos'); if (!e) return;
        const ahora = Date.now();
        e.innerHTML = (steps || []).map(s => {
            let ic = '⚪', cls = 'l-d', extra = '';
            if (s.status === 'completed') { if (s.conclusion === 'success') { ic = '✅'; cls = 'l-ok'; } else if (s.conclusion === 'skipped') { ic = '➖'; cls = 'l-d'; } else { ic = '❌'; cls = 'l-e'; } }
            else if (s.status === 'in_progress') { ic = '⏳'; cls = 'l-b'; if (s.started_at) { const sg = Math.max(0, Math.floor((ahora - new Date(s.started_at).getTime()) / 1000)); extra = ' <small>· ' + Math.floor(sg / 60) + ':' + String(sg % 60).padStart(2, '0') + '</small>'; } }
            return '<div class="' + cls + '">' + ic + ' ' + esc(s.name) + extra + '</div>';
        }).join('') || '<p class="suave"><small>Esperando a que GitHub arranque el job…</small></p>';
    }
    function pintarRegistroVivo(texto, nota) {
        const pre = $('vivoLog'), res = $('vivoResumen'); if (!pre) return;
        if (texto == null) { pre.innerHTML = '<span class="l-d">' + esc(nota || '') + '</span>'; return; }
        const lineas = texto.split(/\r?\n/);
        const cola = lineas.slice(-300);
        const cerca = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60;
        pre.innerHTML = colorearLog(cola.join('\n'));
        if (cerca) pre.scrollTop = pre.scrollHeight;
        const ultima = limpiarLineaLog(lineas.filter(x => x.trim()).pop() || '');
        if (res) res.textContent = ultima.slice(0, 70);
    }
    // Consulta cada pocos segundos la ejecución disparada desde tDesde. Devuelve {stop}.
    function iniciarSeguimiento(cfg, tDesde) {
        const S = { stop: false };
        (async () => {
            let run = null;
            while (!S.stop) {
                try {
                    if (!run) {
                        const r = await contentsApiGitHub(cfg, 'actions/workflows/build-apk-nativo.yml/runs?per_page=5');
                        if (r.ok) { const d = await r.json(); run = ((d.workflow_runs || []).filter(x => new Date(x.created_at).getTime() >= tDesde - 5000))[0] || null; }
                    }
                    if (run && !S.stop) {
                        const rj = await contentsApiGitHub(cfg, 'actions/runs/' + run.id + '/jobs');
                        if (rj.ok) {
                            const dj = await rj.json(); const job = (dj.jobs || [])[dj.jobs.length - 1];
                            if (job && !S.stop) {
                                pintarPasosVivo(job.steps);
                                try {
                                    const rl = await contentsApiGitHub(cfg, 'actions/jobs/' + job.id + '/logs');
                                    if (S.stop) break;
                                    if (rl.ok) pintarRegistroVivo(await rl.text()); else pintarRegistroVivo(null, 'GitHub aún no entrega el registro (HTTP ' + rl.status + '). Se verá entero al terminar.');
                                } catch (_) { pintarRegistroVivo(null, 'El navegador no pudo leer el registro en directo. Se verá entero al terminar.'); }
                            }
                        }
                    }
                } catch (_) {}
                await new Promise(r => setTimeout(r, 5000));
            }
        })();
        return S;
    }

    // ---------- Historial de Actions (todas las ejecuciones del repositorio, vengan de Compila, Fusion o GitHub) ----------
    const ICONO_RUN = r => r.status !== 'completed' ? (r.status === 'in_progress' ? '⏳' : '🕒') : ({ success: '✅', failure: '❌', cancelled: '⏹', skipped: '➖', timed_out: '⌛' }[r.conclusion] || '❔');
    const EVENTO_RUN = { push: 'push', workflow_dispatch: 'manual', schedule: 'programada', pull_request: 'pull request' };
    function duracionRun(r) {
        const a = new Date(r.run_started_at || r.created_at).getTime(), b = new Date(r.updated_at).getTime();
        if (!a || !b || b < a) return '';
        const sg = Math.round((b - a) / 1000); return Math.floor(sg / 60) + ':' + String(sg % 60).padStart(2, '0');
    }
    function cfgDeNombre(nombre) {
        const p = proyectos[nombre];
        const cfg = (p && p.repoDedicado && p.repoDedicado.repo) ? cfgGitHubDeProyecto(p) : cargarConfigGitHub();
        if (!cfg.token) cfg.token = cargarConfigGitHub().token;
        return cfg;
    }
    async function cargarMasRuns() {
        const A = C.actions;
        const r = await contentsApiGitHub(A.cfg, 'actions/runs?per_page=20&page=' + A.pagina);
        if (!r.ok) { const ed = await r.json().catch(() => null); throw new Error((ed && ed.message) || ('HTTP ' + r.status)); }
        const d = await r.json(); const lista = d.workflow_runs || [];
        A.runs = A.runs.concat(lista); A.pagina++;
        if (lista.length < 20) A.fin = true;
    }

        const chips = [['todos', 'Todas (' + n.todos + ')'], ['ok', '✅ Correctas (' + n.ok + ')'], ['fallos', '❌ Fallidas (' + n.fallos + ')'], ['curso', '⏳ En curso (' + n.curso + ')']];
