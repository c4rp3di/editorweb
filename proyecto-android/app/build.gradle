plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // [PLUGINS:FUNCIONALIDADES]
}

// El editor (v10) publica native/ en app/src/main/native/; las versiones anteriores lo dejaban en app/native/.
// Se admiten las dos ubicaciones (el script y jniLibs siempre van juntos).
def nativoDir = file('src/main/native/prepare_native_engines.sh').exists() ? 'src/main/native' : 'native'

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // namespace = paquete interno del código (R, JNI): NO se cambia. La identidad de la app es el applicationId.
    namespace 'com.ejemplo.chat'
    compileSdk 34
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId "com.ejemplo.devchat"   // distinto de Chat Pro: se instala junto a él, con sus propios datos
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "v2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${nativoDir}/jniLibs".toString()]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.ai.edge.litert:litert:2.2.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
    // OCR en el dispositivo (modelo incluido en el APK, funciona sin conexión): capturas -> texto para el modelo.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // [DEPENDENCIAS:FUNCIONALIDADES]
}

tasks.register('prepareNativeEngines') {
    group = 'devchat'
    description = 'Descarga y compila llama.cpp durante el build de Android.'
    doLast {
        if ((System.getenv('CHATPRO_SKIP_NATIVE') ?: '0') == '1') {
            logger.lifecycle('DevChat: CHATPRO_SKIP_NATIVE=1; se omite la preparación nativa.')
            return
        }
        def script = file("${nativoDir}/prepare_native_engines.sh")
        if (!script.exists()) {
            throw new GradleException('DevChat: no encuentro prepare_native_engines.sh ni en app/src/main/native/ ni en app/native/. ' +
                'Publica la carpeta native/ del proyecto (prepare_native_engines.sh, llama/CMakeLists.txt, llama/llama_jni.cpp).')
        }
        exec {
            commandLine 'bash', script.absolutePath
        }
    }
}

tasks.named('preBuild') {
    dependsOn(tasks.named('prepareNativeEngines'))
}

