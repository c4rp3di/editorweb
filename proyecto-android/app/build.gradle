plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.vigia.adblab'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.adblab"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "v1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Shell con privilegios (Shizuku / ADB local). Arrastra :vigia-core con «api».
    implementation project(':vigia-adb')

    // Ya llegan con «api»; se repiten para que el diagnóstico de Fusión las vea.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
