plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.vigia.adblab'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.adblab"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "v2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Bouncy Castle y Conscrypt traen los mismos archivos META-INF: se descartan los que no hacen falta en Android.
    packagingOptions {
        resources {
            excludes += [
                'META-INF/versions/**',
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.md',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE.txt',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    // Shell con privilegios (Shizuku / ADB local). Arrastra :vigia-core con «api».
    implementation project(':vigia-adb')
    // ADB inalámbrico propio (sin Shizuku). Si diera problemas al compilar, quita esta línea y ':vigia-adb-wifi' de settings.gradle.
    implementation project(':vigia-adb-wifi')

    // Ya llegan con «api»; se repiten para que el diagnóstico de Fusión las vea.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
