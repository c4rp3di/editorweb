plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.vigia.nucleolab'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.nucleolab"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "v1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Núcleo de la suite (expone con «api» Material, corrutinas, Room y SQLCipher).
    implementation project(':vigia-core')

    // Ya llegan con «api» desde :vigia-core; se repiten aquí para que el diagnóstico de Fusión las vea.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // El procesador de Room se declara en cada app: genera el código de SUS entidades.
    ksp 'androidx.room:room-compiler:2.6.1'
}
