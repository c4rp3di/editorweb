plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.imagen.chat'
    compileSdk 34
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId "com.imagen.chat"
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName "v4.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    // jniLibs ampliado: el .so puede acabar en cualquiera de estas rutas
    // según dónde lo haya colocado el script nativo tras la compilación.
    sourceSets {
        main {
            jniLibs.srcDirs = ['native/jniLibs', 'src/main/jniLibs', 'jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}

tasks.register('prepareNativeEngines') {
    group = 'chatpro'
    description = 'Descarga y compila stable-diffusion.cpp durante el build de Android.'
    doLast {
        if ((System.getenv('CHATPRO_SKIP_NATIVE') ?: '0') == '1') {
            logger.lifecycle('Chat Imagen: CHATPRO_SKIP_NATIVE=1; se omite la preparación nativa.')
            return
        }
        def candidatos = [
            rootProject.file('proyecto-android/app/src/main/native/prepare_native_engines.sh'),
            rootProject.file('proyecto-android/app/native/prepare_native_engines.sh'),
            rootProject.file('app/src/main/native/prepare_native_engines.sh'),
            rootProject.file('app/native/prepare_native_engines.sh'),
            file('native/prepare_native_engines.sh')
        ]
        def scriptFile = candidatos.find { it.exists() }
        if (scriptFile == null) {
            throw new GradleException(
                "No se encontró prepare_native_engines.sh. Rutas probadas:\n" +
                candidatos.collect { "  - ${it.absolutePath}" }.join("\n")
            )
        }
        logger.lifecycle("Chat Imagen: script nativo encontrado en ${scriptFile.absolutePath}")
        exec {
            commandLine 'bash', scriptFile.absolutePath
        }
    }
}

tasks.named('preBuild') {
    dependsOn(tasks.named('prepareNativeEngines'))
}