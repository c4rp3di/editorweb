plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // [PLUGINS:FUNCIONALIDADES]
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.ejemplo.chat'
    compileSdk 34
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId "com.ejemplo.chat"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "v4.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['native/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.ai.edge.litert:litert:2.2.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
    // [DEPENDENCIAS:FUNCIONALIDADES]
}

tasks.register('prepareNativeEngines') {
    group = 'chatpro'
    description = 'Descarga y compila llama.cpp + stable-diffusion.cpp durante el build de Android.'
    doLast {
        if ((System.getenv('CHATPRO_SKIP_NATIVE') ?: '0') == '1') {
            logger.lifecycle('Chat Pro: CHATPRO_SKIP_NATIVE=1; se omite la preparación nativa.')
            return
        }
        exec {
            commandLine 'bash', file('native/prepare_native_engines.sh').absolutePath
        }
    }
}

tasks.named('preBuild') {
    dependsOn(tasks.named('prepareNativeEngines'))
}

