plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    signingConfigs {
        debug {
            storeFile file("../apk-build/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    namespace 'com.laberinto3d.juego'
    compileSdk 34

    defaultConfig {
        applicationId "com.laberinto3d.juego"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "v1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Sin dependencias externas: sólo el SDK de Android y la biblioteca estándar de Kotlin.
dependencies {
}
