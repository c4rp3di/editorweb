plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.perplexus.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.perplexus.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "v2.0"
    }

    signingConfigs {
        debug {
            // Si existe apk-build/debug.keystore se usa para una firma debug estable.
            def ks = rootProject.file('apk-build/debug.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Sin dependencias de runtime (RNF-21). Solo JUnit para tests de JVM.
    testImplementation 'junit:junit:4.13.2'
}
