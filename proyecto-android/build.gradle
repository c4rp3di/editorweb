// Raíz del proyecto. La versión de AGP que se declara aquí la lee el
// pipeline de compilación (Fusion/Actions) para elegir su versión de
// Gradle: 8.7.x exige Gradle 8.9 o superior.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
}
