// :contracts — Kotlin JVM puro, sin Android (ADR-001). Aquí viven los
// contratos congelables del maestro (sección 4) y SUS tests: el
// importador de Fusion descarta los tests del módulo :app, por lo que
// todo el testing unitario de contratos se hace en este módulo.
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Coordenadas explícitas (R0005): la forma corta kotlin('test') es
    // sintaxis del DSL Kotlin y no está garantizada en Groovy.
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit'
}
