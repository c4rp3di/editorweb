// Build independiente del shell, igual que jadx-wrapper/apktool-wrapper.
// A diferencia de esos dos, este módulo no enlaza contra ninguna librería
// nativa JVM — ExecShim.kt de aquí es un STUB compileOnly (ver el aviso
// en ese archivo). El binario real de radare2 (bin/r2) no se compila
// aquí: se descarga ya construido en build-module-radare2.yml y se mete
// tal cual en el ZIP del módulo, junto al classes.dex de este wrapper.
plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    compileOnly files("${System.getenv('ANDROID_HOME')}/platforms/android-34/android.jar")
}

tasks.named('compileKotlin') {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

tasks.register('moduleJar', Jar) {
    dependsOn 'classes'
    from(sourceSets.main.output) {
        // ⚠️ CRÍTICO: excluir el stub de ExecShim del jar final. Si se
        // cuela en el classes.dex del módulo, DexClassLoader lo
        // encontraría ANTES de delegar al padre para esa clase concreta
        // en según qué versiones de ART, y el módulo rompería en runtime
        // con el IllegalStateException del stub. Ver el aviso en
        // ExecShim.kt de este mismo proyecto.
        exclude('com/carpe/panoptes/nativebridge/**')
    }
    archiveFileName.set('radare2-wrapper.jar')
}
