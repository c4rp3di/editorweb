plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vigia.adblock'
    compileSdk 34

    defaultConfig {
        applicationId "com.vigia.adblockplus"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Núcleo de la suite (expone con «api» Material, corrutinas, AndroidX).
    implementation project(':vigia-core')

    // MitM TLS (BouncyCastle vive solo aquí; el AdBlock 1.0 no lo incluye).
    implementation project(':vigia-mitm')

    // Ya llegan con «api» desde :vigia-core; se repiten para que el diagnóstico de Fusión las vea.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Actualización diaria de las listas.
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
