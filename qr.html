<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QR Simple</title>
<style>
:root{--bg:#eef2f5;--ink:#0e1b2b;--mute:#58677a;--line:#cdd6df;--card:#fff;--acc:#0b6b8a;--accink:#fff;--ok:#1b7f4b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b2b;--ink:#e8eef4;--mute:#9db0c3;--line:#2b3d52;--card:#16273b;--acc:#52c1e0;--accink:#06202b;--ok:#6fd49a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:8px 0 14px;font-weight:700;letter-spacing:-.01em}
label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px}
textarea:focus,button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:10px}
button,select{font:inherit;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font-weight:600}
button{flex:1;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:var(--accink)}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.qr{margin:18px 0 6px;background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:center;border:1.5px solid var(--line);cursor:pointer}
canvas{width:100%;max-width:320px;height:auto;aspect-ratio:1;image-rendering:pixelated;display:block}
.empty{margin:18px 0 6px;padding:40px 16px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:16px}
.msg{min-height:1.4em;margin:8px 2px;color:var(--mute);font-size:.95rem}
.msg.ok{color:var(--ok);font-weight:600}.msg.err{color:#c0392b;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mute);font-size:.95rem}
.opt select{min-height:40px;padding:0 10px;font-weight:500}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;margin-bottom:10px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam i{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.res{margin:10px 0;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.restxt{white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;font-size:1.05rem}
[hidden]{display:none!important}

/* Menú de acciones del QR */
.hint{text-align:center;color:var(--mute);font-size:.9rem;margin:8px 2px 0}
.hint::before{content:"👆 "}
.menu-w{position:fixed;inset:0;z-index:200}
.menu-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fadeIn .15s ease}
.menu-sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;
  background:var(--card);border-radius:18px 18px 0 0;
  padding:18px 16px max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  box-shadow:0 -6px 28px rgba(0,0,0,.28);
  border:1.5px solid var(--line);border-bottom:none;
  animation:slideUp .22s cubic-bezier(.2,.8,.2,1);
}
.menu-sheet button{width:100%;min-height:52px;text-align:left;padding:0 18px;font-size:1rem;display:flex;align-items:center;gap:10px;flex:none}
.menu-sheet button.menu-cancel{text-align:center;justify-content:center;color:var(--mute);font-weight:500;background:transparent}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main>
  <h1>QR Simple</h1>
  <div class="tabs" role="tablist">
    <button id="t_leer" type="button" role="tab" aria-selected="true">Leer</button>
    <button id="t_crear" type="button" role="tab" aria-selected="false">Crear</button>
  </div>

  <section id="leer">
    <div id="camBox" class="cam" hidden><video id="vid" playsinline muted></video><i></i></div>
    <div id="resBox" class="res" hidden><div id="resTxt" class="restxt"></div></div>
    <div id="msg2" class="msg" role="status" aria-live="polite"></div>
    <div class="row"><button id="camBtn" class="main" type="button">Abrir cámara</button></div>
    <div class="row"><button id="resCopy" type="button" hidden>Copiar texto o enlace</button></div>
    <div class="row"><button id="fotoBtn" type="button">Leer desde foto</button></div>
    <input id="foto" type="file" accept="image/*" hidden>
  </section>

  <section id="crear" hidden>
  <label for="txt">Texto o enlace</label>
  <textarea id="txt" placeholder="https://ejemplo.com" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  <div class="row">
    <button id="pegar" type="button">Pegar</button>
    <button id="borrar" type="button">Borrar</button>
  </div>

  <div id="vacio" class="empty">Escribe o pega un texto y el código QR aparece aquí.</div>
  <div id="caja" class="qr" hidden><canvas id="cv" role="img" aria-label="Código QR generado"></canvas></div>
  <p id="hintQR" class="hint" hidden>Toca el código para copiar, descargar o compartir</p>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <div class="row">
    <button id="copiar" class="main" type="button" disabled>Copiar</button>
    <button id="descargar" type="button" disabled>Descargar</button>
  </div>

  <div class="opt">
    <label for="nivel" style="margin:0;font-weight:500">Corrección de errores</label>
    <select id="nivel"><option value="L">Baja</option><option value="M" selected>Media</option><option value="Q">Alta</option><option value="H">Máxima</option></select>
  </div>
  </section>
</main>

<div id="menuQR" class="menu-w" hidden>
  <div class="menu-bg" id="menuBg"></div>
  <div class="menu-sheet" role="dialog" aria-modal="true" aria-label="Opciones del código QR">
    <button type="button" id="mCopy">📋 Copiar texto o enlace</button>
    <button type="button" id="mDown">⬇️ Descargar imagen (PNG)</button>
    <button type="button" id="mShare">🔗 Compartir…</button>
    <button type="button" id="mCancel" class="menu-cancel">Cancelar</button>
  </div>
</div>

<script>
/* ===== Codificador QR (modo byte, UTF-8, versiones 1-40) — sin dependencias ===== */
/*QR-START*/
var QR=(function(){
  var FMT={L:1,M:0,Q:3,H:2},ORD={L:0,M:1,Q:2,H:3};
  var ECC=[
   [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
   [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
   [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
   [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  var BLK=[
   [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
   [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
   [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
   [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
  function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
  function dataCw(v,o){return Math.floor(raw(v)/8)-ECC[o][v]*BLK[o][v]}
  function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z}
  function divisor(d){var r=[],i,j,root=1;for(i=0;i<d;i++)r.push(0);r[d-1]=1;
    for(i=0;i<d;i++){for(j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function remainder(data,div){var r=div.map(function(){return 0});
    data.forEach(function(b){var f=b^r.shift();r.push(0);div.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
  function utf8(s){return Array.prototype.slice.call(new TextEncoder().encode(s))}
  function encode(text,level){
    var o=ORD[level],bytes=utf8(text),v,cap;
    for(v=1;;v++){
      if(v>40)throw new Error("Texto demasiado largo para un QR");
      cap=dataCw(v,o)*8;
      if(4+(v<=9?8:16)+8*bytes.length<=cap)break;
    }
    var bits=[];function put(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>>i)&1)}
    put(4,4);put(bytes.length,v<=9?8:16);bytes.forEach(function(b){put(b,8)});
    put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(var pad=0xEC;bits.length<cap;pad^=0xEC^0x11)put(pad,8);
    var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var k=0;k<8;k++)b=(b<<1)|bits[i+k];data.push(b)}
    var nb=BLK[o][v],el=ECC[o][v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),dv=divisor(el),blocks=[];
    for(var bi=0,p=0;bi<nb;bi++){
      var d=data.slice(p,p+sl-el+(bi<ns?0:1));p+=d.length;
      var e=remainder(d,dv);if(bi<ns)d.push(0);blocks.push(d.concat(e));
    }
    var all=[];
    for(i=0;i<blocks[0].length;i++)blocks.forEach(function(bl,j){if(i!=sl-el||j>=ns)all.push(bl[i])});
    var size=v*4+17,m=[],fn=[],y,x;
    for(y=0;y<size;y++){m.push(new Array(size).fill(false));fn.push(new Array(size).fill(false))}
    function set(x,y,c){m[y][x]=c;fn[y][x]=true}
    for(i=0;i<size;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
    function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){
      var dist=Math.max(Math.abs(dx),Math.abs(dy)),xx=cx+dx,yy=cy+dy;
      if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,dist!=2&&dist!=4)}}
    finder(3,3);finder(size-4,3);finder(3,size-4);
    var pos=[];
    if(v>1){var na=Math.floor(v/7)+2,step=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2;pos=[6];
      for(var ps=size-7;pos.length<na;ps-=step)pos.splice(1,0,ps)}
    pos.forEach(function(a,ia){pos.forEach(function(b,ib){
      if((ia==0&&ib==0)||(ia==0&&ib==pos.length-1)||(ia==pos.length-1&&ib==0))return;
      for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)})});
    function bit(n,k){return((n>>>k)&1)!=0}
    function format(mask){
      var d=(FMT[level]<<3)|mask,r=d,k;
      for(k=0;k<10;k++)r=(r<<1)^((r>>>9)*0x537);
      var f=((d<<10)|r)^0x5412;
      for(k=0;k<=5;k++)set(8,k,bit(f,k));
      set(8,7,bit(f,6));set(8,8,bit(f,7));set(7,8,bit(f,8));
      for(k=9;k<15;k++)set(14-k,8,bit(f,k));
      for(k=0;k<8;k++)set(size-1-k,8,bit(f,k));
      for(k=8;k<15;k++)set(8,size-15+k,bit(f,k));
      set(8,size-8,true);
    }
    format(0);
    if(v>=7){var rr=v,k2;for(k2=0;k2<12;k2++)rr=(rr<<1)^((rr>>>11)*0x1F25);
      var vb=(v<<12)|rr;for(k2=0;k2<18;k2++){var c=bit(vb,k2),a=size-11+k2%3,b2=Math.floor(k2/3);set(a,b2,c);set(b2,a,c)}}
    var n=0;
    for(var right=size-1;right>=1;right-=2){
      if(right==6)right=5;
      for(var vert=0;vert<size;vert++)for(var j=0;j<2;j++){
        x=right-j;y=((right+1)&2)==0?size-1-vert:vert;
        if(!fn[y][x]&&n<all.length*8){m[y][x]=bit(all[n>>>3],7-(n&7));n++}
      }
    }
    function mask(mk){for(var yy=0;yy<size;yy++)for(var xx=0;xx<size;xx++){
      if(fn[yy][xx])continue;var inv;
      switch(mk){case 0:inv=(xx+yy)%2==0;break;case 1:inv=yy%2==0;break;case 2:inv=xx%3==0;break;case 3:inv=(xx+yy)%3==0;break;
        case 4:inv=(Math.floor(xx/3)+Math.floor(yy/2))%2==0;break;case 5:inv=xx*yy%2+xx*yy%3==0;break;
        case 6:inv=(xx*yy%2+xx*yy%3)%2==0;break;default:inv=((xx+yy)%2+xx*yy%3)%2==0}
      if(inv)m[yy][xx]=!m[yy][xx]}}
    function penalty(){
      var s=0,a,b,run,line,dark=0;
      function lineScore(get){var sc=0,cnt,prev,i2;
        for(var l=0;l<size;l++){cnt=1;prev=get(l,0);var str=prev?"1":"0";
          for(i2=1;i2<size;i2++){var c2=get(l,i2);str+=c2?"1":"0";if(c2==prev)cnt++;else{if(cnt>=5)sc+=cnt-2;cnt=1;prev=c2}}
          if(cnt>=5)sc+=cnt-2;
          var q=-1;while((q=str.indexOf("10111010000",q+1))>=0)sc+=40;
          q=-1;while((q=str.indexOf("00001011101",q+1))>=0)sc+=40}
        return sc}
      s+=lineScore(function(l,i2){return m[l][i2]});
      s+=lineScore(function(l,i2){return m[i2][l]});
      for(a=0;a<size;a++)for(b=0;b<size;b++){if(m[a][b])dark++;
        if(a<size-1&&b<size-1&&m[a][b]==m[a][b+1]&&m[a][b]==m[a+1][b]&&m[a][b]==m[a+1][b+1])s+=3}
      var tot=size*size;s+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return s}
    var best=0,bestP=1e9;
    for(var mk=0;mk<8;mk++){mask(mk);format(mk);var pn=penalty();if(pn<bestP){bestP=pn;best=mk}mask(mk)}
    mask(best);format(best);
    return m;
  }
  return{encode:encode,raw:raw,ECC:ECC,BLK:BLK};
})();
/*QR-END*/
/*DEC-START*/
var QRD=(function(){
  var EXP=[],LOG=[],i,x=1;
  for(i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(i=255;i<512;i++)EXP[i]=EXP[i-255];
  function gm(a,b){return a&&b?EXP[LOG[a]+LOG[b]]:0}
  function gd(a,b){return a?EXP[(LOG[a]+255-LOG[b])%255]:0}
  function synd(m,ns){var S=[],bad=false,i,j,s;for(i=0;i<ns;i++){s=0;for(j=0;j<m.length;j++)s=gm(s,EXP[i])^m[j];S.push(s);if(s)bad=true}return bad?S:null}
  function rs(msg,ns){
    var n=msg.length,S=synd(msg,ns),i,j,k;
    if(!S)return msg;
    var C=[1],B=[1],L=0,m=1,b=1,d,T,co;
    for(k=0;k<ns;k++){
      d=S[k];for(i=1;i<=L;i++)d^=gm(C[i]||0,S[k-i]);
      if(!d){m++;continue}
      T=C.slice();co=gd(d,b);
      while(C.length<B.length+m)C.push(0);
      for(i=0;i<B.length;i++)C[i+m]^=gm(co,B[i]);
      if(2*L<=k){L=k+1-L;B=T;b=d;m=1}else m++;
    }
    var errs=[],p,v;
    for(p=0;p<n;p++){v=0;for(i=0;i<C.length;i++)v^=gm(C[i],EXP[((255-p%255)*i)%255]);if(!v)errs.push(p)}
    if(!L||errs.length!==L)return null;
    var Om=[];for(i=0;i<ns;i++){Om.push(0);for(j=0;j<C.length&&j<=i;j++)Om[i]^=gm(S[i-j],C[j])}
    var out=msg.slice();
    for(k=0;k<errs.length;k++){
      p=errs[k];var xi=EXP[(255-p%255)%255],num=0,den=0,pw=1;
      for(i=0;i<ns;i++){num^=gm(Om[i],pw);pw=gm(pw,xi)}
      pw=1;for(i=1;i<C.length;i+=2){den^=gm(C[i],pw);pw=gm(pw,gm(xi,xi))}
      if(!den)return null;
      out[n-1-p]^=gm(EXP[p%255],gd(num,den));
    }
    return synd(out,ns)?null:out;
  }
  function binarize(img,w,h){
    var g=new Uint8Array(w*h),n=w*h,p,x,y,row;
    for(i=0,p=0;i<n;i++,p+=4)g[i]=(img[p]*77+img[p+1]*150+img[p+2]*29)>>8;
    var I=new Float64Array((w+1)*(h+1)),W=w+1;
    for(y=0;y<h;y++){row=0;for(x=0;x<w;x++){row+=g[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+row}}
    var r=Math.max(8,Math.round(Math.min(w,h)/10)),bin=new Uint8Array(n);
    for(y=0;y<h;y++){var y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
      for(x=0;x<w;x++){var x0=Math.max(0,x-r),x1=Math.min(w,x+r+1),
        mean=(I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0])/((x1-x0)*(y1-y0));
        bin[y*w+x]=(g[y*w+x]<mean*0.92||g[y*w+x]<40)?1:0}}
    return bin}
  function chk(st){var t=0,i;for(i=0;i<5;i++){if(!st[i])return 0;t+=st[i]}
    var m=t/7,tol=m*0.75;
    return(Math.abs(st[0]-m)<tol&&Math.abs(st[1]-m)<tol&&Math.abs(st[2]-3*m)<1.5*m&&Math.abs(st[3]-m)<tol&&Math.abs(st[4]-m)<tol)?m:0}
  function vcheck(bin,w,h,x,y,m){
    var st=[0,0,0,0,0],yy=y,lim=m*5;
    while(yy>=0&&bin[yy*w+x]===1){st[2]++;yy--}
    if(yy<0)return null;
    while(yy>=0&&bin[yy*w+x]===0&&st[1]<lim){st[1]++;yy--}
    if(yy<0||st[1]>=lim)return null;
    while(yy>=0&&bin[yy*w+x]===1&&st[0]<lim){st[0]++;yy--}
    yy=y+1;
    while(yy<h&&bin[yy*w+x]===1){st[2]++;yy++}
    if(yy>=h)return null;
    while(yy<h&&bin[yy*w+x]===0&&st[3]<lim){st[3]++;yy++}
    if(yy>=h||st[3]>=lim)return null;
    while(yy<h&&bin[yy*w+x]===1&&st[4]<lim){st[4]++;yy++}
    var mm=chk(st);return mm?[yy-st[4]-st[3]-st[2]/2,mm]:null}
  function finders(bin,w,h){
    var cs=[],y,x,i,j;
    for(y=0;y<h;y++){
      var runs=[],c=bin[y*w],st0=0;
      for(x=1;x<=w;x++)if(x===w||bin[y*w+x]!==c){runs.push([c,st0,x-st0]);if(x<w){c=bin[y*w+x];st0=x}}
      for(i=0;i+4<runs.length;i++){
        if(runs[i][0]!==1)continue;

      else if(bd){bd.detect(work).then(function(r){if(r&&r.length){mostrar(r[0].rawValue);aviso2("QR leído","ok")}else aviso2("No se encontró ningún QR en la foto. Acércate y que se vea entero.","err")},function(){aviso2("No se encontró ningún QR en la foto.","err")})}
      else aviso2("No se encontró ningún QR en la foto. Acércate y que se vea entero.","err")};
    img.onerror=function(){aviso2("No se pudo abrir la imagen","err")};
    img.src=url});

  /* ===== Pestañas ===== */
  function pestana(id){
    ["leer","crear"].forEach(function(k){$(k).hidden=(k!==id);$("t_"+k).setAttribute("aria-selected",k===id?"true":"false")});
    if(id!=="leer")parar()}
  $("t_leer").addEventListener("click",function(){pestana("leer")});
  $("t_crear").addEventListener("click",function(){pestana("crear")});
  document.addEventListener("visibilitychange",function(){if(document.hidden)parar()});
  dibujar();
})();
</script>
