name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la app'
        required: true
      app_package:
        description: 'ID de paquete'
        required: true
      app_url:
        description: 'URL a envolver'
        required: true
      app_permisos:
        description: 'Permisos separados por coma'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma y build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generar proyecto Android
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_PACKAGE: ${{ github.event.inputs.app_package }}
          APP_URL: ${{ github.event.inputs.app_url }}
          APP_PERMISOS: ${{ github.event.inputs.app_permisos }}
        run: |
          set -e
          PKG_PATH=$(echo "$APP_PACKAGE" | tr '.' '/')
          mkdir -p "android-app/app/src/main/java/$PKG_PATH"
          mkdir -p android-app/app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "android-app/app/src/main/res/mipmap-$d"; done
          if [ -f apk-build/icon.png ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp apk-build/icon.png "android-app/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp apk-build/icon.png "android-app/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
          fi

          PERMS_XML=""
          PERMS_JAVA_LIST=""
          add_perm() {
            PERMS_XML="$PERMS_XML
                        <uses-permission android:name=\"$1\" />"
            if [ "$2" = "runtime" ]; then
              if [ -n "$PERMS_JAVA_LIST" ]; then PERMS_JAVA_LIST="$PERMS_JAVA_LIST, "; fi
              PERMS_JAVA_LIST="$PERMS_JAVA_LIST\"$1\""
            fi
          }
          case ",$APP_PERMISOS," in *,camara,*) add_perm "android.permission.CAMERA" runtime ;; esac
          case ",$APP_PERMISOS," in *,microfono,*) add_perm "android.permission.RECORD_AUDIO" runtime ;; esac
          case ",$APP_PERMISOS," in *,galeria,*) add_perm "android.permission.READ_MEDIA_IMAGES" runtime; add_perm "android.permission.READ_MEDIA_VIDEO" runtime ;; esac
          case ",$APP_PERMISOS," in *,audio,*) add_perm "android.permission.READ_MEDIA_AUDIO" runtime ;; esac
          case ",$APP_PERMISOS," in *,ubicacion,*) add_perm "android.permission.ACCESS_FINE_LOCATION" runtime ;; esac
          case ",$APP_PERMISOS," in *,notificaciones,*) add_perm "android.permission.POST_NOTIFICATIONS" runtime ;; esac
          case ",$APP_PERMISOS," in *,vibracion,*) add_perm "android.permission.VIBRATE" ;; esac
          case ",$APP_PERMISOS," in *,wakelock,*) add_perm "android.permission.WAKE_LOCK" ;; esac
          case ",$APP_PERMISOS," in *,sensores,*) add_perm "android.permission.BODY_SENSORS" runtime ;; esac

          DOWNLOAD_CODE=""
          case ",$APP_PERMISOS," in *,almacenamiento,*)
            add_perm "android.permission.WRITE_EXTERNAL_STORAGE"
            DOWNLOAD_CODE='
                        webView.setDownloadListener((dlUrl, userAgent, contentDisposition, mimetype, contentLength) -> {
                            android.app.DownloadManager.Request request = new android.app.DownloadManager.Request(Uri.parse(dlUrl));
                            request.setMimeType(mimetype);
                            request.addRequestHeader("User-Agent", userAgent);
                            request.setTitle(android.webkit.URLUtil.guessFileName(dlUrl, contentDisposition, mimetype));
                            request.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                            request.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, android.webkit.URLUtil.guessFileName(dlUrl, contentDisposition, mimetype));
                            android.app.DownloadManager dm = (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                            dm.enqueue(request);
                        });'
            ;;
          esac

          WAKELOCK_CODE=""
          case ",$APP_PERMISOS," in *,wakelock,*)
            WAKELOCK_CODE='
                        getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);'
            ;;
          esac

          cat > android-app/settings.gradle <<'          GEOF'
                    rootProject.name = "app"
                    include ':app'
                    GEOF

          cat > android-app/build.gradle <<'          GEOF'
                    buildscript {
                        repositories { google(); mavenCentral() }
                        dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
                    }
                    allprojects {
                        repositories { google(); mavenCentral() }
                    }
                    GEOF

          cat > android-app/app/build.gradle <<'          GEOF'
                    apply plugin: 'com.android.application'
                    android {
                        namespace '__APP_PACKAGE__'
                        compileSdk 34
                        defaultConfig {
                            applicationId '__APP_PACKAGE__'
                            minSdk 23
                            targetSdk 34
                            versionCode 1
                            versionName "1.0"
                        }
                    }
                    GEOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'          GEOF'
                    <?xml version="1.0" encoding="utf-8"?>
                    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                        <uses-permission android:name="android.permission.INTERNET" />__PERMS_XML__
                        <application
                            android:label="@string/app_name"
                            android:icon="@mipmap/ic_launcher"
                            android:roundIcon="@mipmap/ic_launcher_round">
                            <activity android:name=".MainActivity"
                                android:exported="true"
                                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                                <intent-filter>
                                    <action android:name="android.intent.action.MAIN" />
                                    <category android:name="android.intent.category.LAUNCHER" />
                                </intent-filter>
                            </activity>
                        </application>
                    </manifest>
                    GEOF

          cat > "android-app/app/src/main/java/$PKG_PATH/MainActivity.java" <<'          GEOF'
                    package __APP_PACKAGE__;
                    import android.app.Activity;
                    import android.content.Intent;
                    import android.net.Uri;
                    import android.os.Bundle;
                    import android.webkit.GeolocationPermissions;
                    import android.webkit.PermissionRequest;
                    import android.webkit.ValueCallback;
                    import android.webkit.WebChromeClient;
                    import android.webkit.WebView;
                    import android.webkit.WebViewClient;
                    import android.webkit.WebSettings;
                    import android.view.ViewGroup;
                    public class MainActivity extends Activity {
                        private static final String[] PERMS = { __PERMS_JAVA_LIST__ };
                        private static final int FILE_CHOOSER_CODE = 51426;
                        private ValueCallback<Uri[]> filePathCallback;
                        @Override
                        protected void onCreate(Bundle savedInstanceState) {
                            super.onCreate(savedInstanceState);
                            if (PERMS.length > 0) {
                                requestPermissions(PERMS, 1001);
                            }__WAKELOCK_CODE__
                            WebView webView = new WebView(this);
                            webView.setLayoutParams(new ViewGroup.LayoutParams(
                                ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                            WebSettings settings = webView.getSettings();
                            settings.setJavaScriptEnabled(true);
                            settings.setDomStorageEnabled(true);
                            settings.setGeolocationEnabled(true);
                            settings.setAllowFileAccess(true);
                            webView.setWebViewClient(new WebViewClient());
                            webView.setWebChromeClient(new WebChromeClient() {
                                @Override
                                public void onPermissionRequest(final PermissionRequest request) {
                                    runOnUiThread(() -> request.grant(request.getResources()));
                                }
                                @Override
                                public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                                    callback.invoke(origin, true, false);
                                }
                                @Override
                                public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> callback, WebChromeClient.FileChooserParams params) {
                                    filePathCallback = callback;
                                    Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                                    intent.setType("*/*");
                                    startActivityForResult(Intent.createChooser(intent, "Elegir archivo"), FILE_CHOOSER_CODE);
                                    return true;
                                }
                            });__DOWNLOAD_CODE__
                            webView.loadUrl("__APP_URL__");
                            setContentView(webView);
                        }
                        @Override
                        protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                            super.onActivityResult(requestCode, resultCode, data);
                            if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                                Uri[] result = null;
                                if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                                    result = new Uri[]{ data.getData() };
                                }
                                filePathCallback.onReceiveValue(result);
                                filePathCallback = null;
                            }
                        }
                    }
                    GEOF

          NOMBRE_ESCAPADO=$(printf '%s' "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          cat > android-app/app/src/main/res/values/strings.xml <<'          GEOF'
                    <resources>
                        <string name="app_name">__NOMBRE_ESCAPADO__</string>
                    </resources>
                    GEOF

          export APP_PACKAGE APP_URL PERMS_XML PERMS_JAVA_LIST DOWNLOAD_CODE WAKELOCK_CODE NOMBRE_ESCAPADO PKG_PATH
          python3 <<'          PYEOF'
          import os
          reemplazos = {
              '__APP_PACKAGE__': os.environ.get('APP_PACKAGE', ''),
              '__APP_URL__': os.environ.get('APP_URL', ''),
              '__PERMS_XML__': os.environ.get('PERMS_XML', ''),
              '__PERMS_JAVA_LIST__': os.environ.get('PERMS_JAVA_LIST', ''),
              '__DOWNLOAD_CODE__': os.environ.get('DOWNLOAD_CODE', ''),
              '__WAKELOCK_CODE__': os.environ.get('WAKELOCK_CODE', ''),
              '__NOMBRE_ESCAPADO__': os.environ.get('NOMBRE_ESCAPADO', ''),
          }
          archivos = [
              'android-app/settings.gradle',
              'android-app/build.gradle',
              'android-app/app/build.gradle',
              'android-app/app/src/main/AndroidManifest.xml',
              'android-app/app/src/main/java/' + os.environ['PKG_PATH'] + '/MainActivity.java',
              'android-app/app/src/main/res/values/strings.xml',
          ]
          PREFIJO = ' ' * 10
          for ruta in archivos:
              with open(ruta, encoding='utf-8') as f:
                  contenido = f.read()
              for token, valor in reemplazos.items():
                  contenido = contenido.replace(token, valor)
              # Quita la sangría de 10 espacios que exige el bloque YAML pero que no
              # pertenece al contenido real del archivo (imprescindible para XML: la
              # declaración <?xml ...?> debe ser literalmente el primer carácter).
              lineas = contenido.split('\n')
              lineas = [l[len(PREFIJO):] if l.startswith(PREFIJO) else l for l in lineas]
              contenido = '\n'.join(lineas)
              with open(ruta, 'w', encoding='utf-8') as f:
                  f.write(contenido)
          print("Sustitución completada")
                    PYEOF
      - name: Compilar APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
      - name: Crear release con el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="apk-$(date +%s)"
          APK_PATH=$(find android-app -name "*.apk" | head -n1)
          gh release create "$TAG" "$APK_PATH" --title "APK $TAG" --notes "Generado automáticamente por el editor"
