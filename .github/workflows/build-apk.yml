name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la app'
        required: true
      app_package:
        description: 'ID de paquete'
        required: true
      app_url:
        description: 'URL a envolver'
        required: true
      app_permisos:
        description: 'Permisos separados por coma'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma y build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generar proyecto Android
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_PACKAGE: ${{ github.event.inputs.app_package }}
          APP_URL: ${{ github.event.inputs.app_url }}
          APP_PERMISOS: ${{ github.event.inputs.app_permisos }}
        run: |
          set -e
          PKG_PATH=$(echo "$APP_PACKAGE" | tr '.' '/')
          mkdir -p "android-app/app/src/main/java/$PKG_PATH"
          mkdir -p android-app/app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p "android-app/app/src/main/res/mipmap-$d"; done
          if [ -f apk-build/icon.png ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp apk-build/icon.png "android-app/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp apk-build/icon.png "android-app/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
          fi
          PERMS_XML=""
          PERMS_JAVA_LIST=""
          DOWNLOAD_CODE=""
          NOTIFICATION_INIT=""
          add_perm() {
            local nombre="$1"
            local maxsdk="$2"
            if [ -n "$maxsdk" ]; then
              PERMS_XML=$(printf '%s    <uses-permission android:name="%s" android:maxSdkVersion="%s" />\n' "$PERMS_XML" "$nombre" "$maxsdk")
            else
              PERMS_XML=$(printf '%s    <uses-permission android:name="%s" />\n' "$PERMS_XML" "$nombre")
            fi
          }
          add_runtime() {
            if [ -n "$PERMS_JAVA_LIST" ]; then
              PERMS_JAVA_LIST="$PERMS_JAVA_LIST, \"$1\""
            else
              PERMS_JAVA_LIST="\"$1\""
            fi
          }
          case ",$APP_PERMISOS," in
            *,camara,*)
              add_perm "android.permission.CAMERA" ""
              add_runtime "android.permission.CAMERA"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,microfono,*)
              add_perm "android.permission.RECORD_AUDIO" ""
              add_runtime "android.permission.RECORD_AUDIO"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,galeria,*)
              add_perm "android.permission.READ_EXTERNAL_STORAGE" "32"
              add_perm "android.permission.READ_MEDIA_IMAGES" ""
              add_perm "android.permission.READ_MEDIA_VIDEO" ""
              add_perm "android.permission.READ_MEDIA_VISUAL_USER_SELECTED" ""
              add_runtime "android.permission.READ_EXTERNAL_STORAGE"
              add_runtime "android.permission.READ_MEDIA_IMAGES"
              add_runtime "android.permission.READ_MEDIA_VIDEO"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,audio,*)
              add_perm "android.permission.READ_MEDIA_AUDIO" ""
              add_runtime "android.permission.READ_MEDIA_AUDIO"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,ubicacion,*)
              add_perm "android.permission.ACCESS_FINE_LOCATION" ""
              add_perm "android.permission.ACCESS_COARSE_LOCATION" ""
              add_runtime "android.permission.ACCESS_FINE_LOCATION"
              add_runtime "android.permission.ACCESS_COARSE_LOCATION"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,notificaciones,*)
              add_perm "android.permission.POST_NOTIFICATIONS" ""
              add_runtime "android.permission.POST_NOTIFICATIONS"
              NOTIFICATION_INIT=$'\n        if (android.os.Build.VERSION.SDK_INT >= 26) {\n            android.app.NotificationChannel canal = new android.app.NotificationChannel(\n                "webview_default", "Notificaciones", android.app.NotificationManager.IMPORTANCE_DEFAULT);\n            ((android.app.NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(canal);\n        }'
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,vibracion,*)
              add_perm "android.permission.VIBRATE" ""
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,wakelock,*)
              add_perm "android.permission.WAKE_LOCK" ""
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,bluetooth,*)
              add_perm "android.permission.BLUETOOTH" "30"
              add_perm "android.permission.BLUETOOTH_ADMIN" "30"
              add_perm "android.permission.BLUETOOTH_CONNECT" ""
              add_perm "android.permission.BLUETOOTH_SCAN" ""
              add_runtime "android.permission.BLUETOOTH_CONNECT"
              add_runtime "android.permission.BLUETOOTH_SCAN"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,nfc,*)
              add_perm "android.permission.NFC" ""
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,sensores,*)
              add_perm "android.permission.BODY_SENSORS" ""
              add_runtime "android.permission.BODY_SENSORS"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,actividad,*)
              add_perm "android.permission.ACTIVITY_RECOGNITION" ""
              add_runtime "android.permission.ACTIVITY_RECOGNITION"
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,descargas,*)
              add_perm "android.permission.WRITE_EXTERNAL_STORAGE" "28"
              DOWNLOAD_CODE=$'\n        webView.setDownloadListener((dlUrl, userAgent, contentDisposition, mimetype, contentLength) -> {\n            android.app.DownloadManager.Request request = new android.app.DownloadManager.Request(Uri.parse(dlUrl));\n            request.setMimeType(mimetype);\n            request.addRequestHeader("User-Agent", userAgent);\n            String nombreArchivo = android.webkit.URLUtil.guessFileName(dlUrl, contentDisposition, mimetype);\n            request.setTitle(nombreArchivo);\n            request.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);\n            request.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, nombreArchivo);\n            android.app.DownloadManager dm = (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);\n            dm.enqueue(request);\n        });'
              ;;
          esac
          case ",$APP_PERMISOS," in
            *,almacenamientototal,*)
              add_perm "android.permission.MANAGE_EXTERNAL_STORAGE" ""
              ;;
          esac
          cat > android-app/settings.gradle << 'GEOF'
          rootProject.name = "app"
          include ':app'
          GEOF
          cat > android-app/build.gradle << 'GEOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          GEOF
          cat > android-app/app/build.gradle << GEOF
          apply plugin: 'com.android.application'
          android {
              namespace '$APP_PACKAGE'
              compileSdk 34
              defaultConfig {
                  applicationId '$APP_PACKAGE'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GEOF
          cat > android-app/app/src/main/AndroidManifest.xml << GEOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          $PERMS_XML    <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GEOF
          cat > "android-app/app/src/main/java/$PKG_PATH/MainActivity.java" << GEOF
          package $APP_PACKAGE;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Message;
          import android.util.Log;
          import android.view.ViewGroup;
          import android.webkit.ConsoleMessage;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import java.util.List;
          public class MainActivity extends Activity {
              private static final String[] PERMS = { $PERMS_JAVA_LIST };
              private static final int RUNTIME_PERMS_CODE = 1001;
              private static final int FILE_CHOOSER_CODE = 51426;
              private ValueCallback<Uri[]> filePathCallback;
              private WebView webView;
              private String urlPendiente;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }$NOTIFICATION_INIT
                  urlPendiente = "$APP_URL";
                  if (PERMS.length > 0) {
                      requestPermissions(PERMS, RUNTIME_PERMS_CODE);
                  } else {
                      cargarWebView();
                  }
              }
              private void cargarWebView() {
                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                          String host = request.getUrl().getHost();
                          if (host != null && host.equals(Uri.parse("$APP_URL").getHost())) {
                              return false;
                          }
                          startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              String[] recursos = request.getResources();
                              List<String> permitidos = new ArrayList<>();
                              for (String r : recursos) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)
                                      && tienePermiso("android.permission.CAMERA")) {
                                      permitidos.add(r);
                                  } else if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)
                                      && tienePermiso("android.permission.RECORD_AUDIO")) {
                                      permitidos.add(r);
                                  } else if (PermissionRequest.RESOURCE_PROTECTED_MEDIA_ID.equals(r)) {
                                      permitidos.add(r);
                                  }
                              }
                              if (permitidos.isEmpty()) {
                                  request.deny();
                              } else {
                                  request.grant(permitidos.toArray(new String[0]));
                              }
                          });
                      }
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          boolean concedido = tienePermiso("android.permission.ACCESS_FINE_LOCATION")
                              || tienePermiso("android.permission.ACCESS_COARSE_LOCATION");
                          callback.invoke(origin, concedido, false);
                      }
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Elegir archivo"), FILE_CHOOSER_CODE);
                          return true;
                      }
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView temporal = new WebView(MainActivity.this);
                          temporal.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                                  temporal.destroy();
                                  return true;
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(temporal);
                          resultMsg.sendToTarget();
                          return true;
                      }
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (d, w) -> result.confirm())
                              .setCancelable(false).show();
                          return true;
                      }
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (d, w) -> result.confirm())
                              .setNegativeButton("Cancelar", (d, w) -> result.cancel())
                              .setCancelable(false).show();
                          return true;
                      }
                      @Override
                      public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, final JsPromptResult result) {
                          final android.widget.EditText input = new android.widget.EditText(MainActivity.this);
                          input.setText(defaultValue);
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setView(input)
                              .setPositiveButton("OK", (d, w) -> result.confirm(input.getText().toString()))
                              .setNegativeButton("Cancelar", (d, w) -> result.cancel())
                              .setCancelable(false).show();
                          return true;
                      }
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage m) {
                          Log.d("WebView", m.message() + " @ línea " + m.lineNumber());
                          return true
                      }
                  });$DOWNLOAD_CODE
                  webView.loadUrl(urlPendiente);
                  setContentView(webView);
              }
              private boolean tienePermiso(String permiso) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true;
                  return checkSelfPermission(permiso) == PackageManager.PERMISSION_GRANTED;
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == RUNTIME_PERMS_CODE) {
                      cargarWebView();
                  }
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }
          }
          GEOF
          NOMBRE_ESCAPADO=$(printf '%s' "$APP_NAME" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          cat > android-app/app/src/main/res/values/strings.xml << EOF2
          <resources>
              <string name="app_name">$NOMBRE_ESCAPADO</string>
          </resources>
          EOF2
      - name: Compilar APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
      - name: Crear release con el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="apk-$(date +%s)"
          APK_PATH=$(find android-app -name "*.apk" | head -n1)
          gh release create "$TAG" "$APK_PATH" --title "APK $TAG" --notes "Generado automáticamente por el editor"
