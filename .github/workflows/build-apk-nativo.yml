name: Build APK Nativo
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nombre de la app'
        required: true
      app_package:
        description: 'Paquete de la app'
        required: false
        default: ''
      app_version_code:
        description: 'Código de versión (informativo; ya va horneado en build.gradle)'
        required: false
        default: ''
      app_version_name:
        description: 'Nombre de versión, usado para el nombre del APK del release'
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK de Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          CMDLINE_TOOLS_BIN=$(find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 3 -name sdkmanager -exec dirname {} \; | sort -V | tail -1)
          if [ -z "$CMDLINE_TOOLS_BIN" ]; then
            echo "::error::No se encontró sdkmanager bajo /usr/local/lib/android/sdk/cmdline-tools"
            exit 1
          fi
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
      - name: Aceptar licencias e instalar plataforma y build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Generar keystore debug si no existe
        working-directory: proyecto-android
        run: |
          set -e
          mkdir -p apk-build
          if [ -f apk-build/debug.keystore ]; then
            echo "Ya existe apk-build/debug.keystore en el repo, se reutiliza para que la firma sea estable entre builds."
          else
            echo "No hay keystore en el repo todavía: se genera uno nuevo y se sube para que quede fijo a partir de ahora."
            keytool -genkeypair -v \
              -keystore apk-build/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apk-build/debug.keystore
            git commit -m "Añade keystore debug estable para firmar APKs"
            git push || echo "::warning::No se pudo subir el keystore al repo (posible protección de rama). La firma NO quedará fija entre builds hasta que subas apk-build/debug.keystore manualmente con estos mismos parámetros."
          fi
      - name: Compilar APK
        working-directory: proyecto-android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
      - name: Crear release con el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_PACKAGE: ${{ github.event.inputs.app_package }}
          APP_VERSION_NAME: ${{ github.event.inputs.app_version_name }}
        run: |
          set -e
          TAG="apk-nativo-$(date +%s)"
          APK_PATH=$(find . -name "*.apk" | head -n1)
          SAFE_NAME=$(echo "$APP_NAME" | tr -c 'A-Za-z0-9._-' '_')
          if [ -n "$APP_VERSION_NAME" ]; then
            APK_FINAL="$SAFE_NAME-$APP_VERSION_NAME.apk"
          else
            APK_FINAL="$SAFE_NAME.apk"
          fi
          cp "$APK_PATH" "$APK_FINAL"
          gh release create "$TAG" "$APK_FINAL" --title "APK nativo: $APP_NAME" --notes "Paquete: $APP_PACKAGE. Compilado desde el código Kotlin/XML/Gradle generado por el editor."
