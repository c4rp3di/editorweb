# Workflow de respaldo (manual). Si ya usas build-apk-nativo.yml del editor, no hace falta.
name: Build APK (fallback manual)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Tests unitarios (JVM)
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: perplexus3d-debug-apk
          path: app/build/outputs/apk/debug/*.apk
