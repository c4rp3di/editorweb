name: Diagnóstico E2E del proyecto

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Nombre del proyecto'
        required: true
        type: string
      project_slug:
        description: 'Slug del proyecto'
        required: true
        type: string
      run_folder:
        description: 'Carpeta de ejecución'
        required: true
        type: string
      project_type:
        description: 'Tipo de proyecto'
        required: true
        type: string
      entry_file:
        description: 'HTML de entrada'
        required: true
        type: string
      targets_json:
        description: 'Elementos interactivos seleccionados en el editor'
        required: false
        default: '[]'
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROJECT_NAME: ${{ github.event.inputs.project_name }}
      PROJECT_SLUG: ${{ github.event.inputs.project_slug }}
      RUN_FOLDER: ${{ github.event.inputs.run_folder }}
      ENTRY_FILE: ${{ github.event.inputs.entry_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright y Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.47.0 > /dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Preparar servidor
        run: |
          export PACKAGE_DIR="verificaciones-e2e/$PROJECT_SLUG/$RUN_FOLDER"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          test -f "$PACKAGE_DIR/$ENTRY_FILE"
          cd "$PACKAGE_DIR"
          nohup python3 -m http.server 8080 > /tmp/e2e-server.log 2>&1 &
          sleep 1
      - name: Explorar con Playwright
        run: |
          cat > e2e.js <<'E2EJS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = 'http://127.0.0.1:8080/' + process.env.ENTRY_FILE;
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage();
            const errores=[], avisos=[], acciones=[], estados=[], vistos=new Set();
            let ultimaAccion=null, ultimaAccionMs=0;
            const safe=(t)=>!(/\\b(eliminar|borrar|delete|destroy|comprar|pagar|logout|cerrar sesión|salir)\\b/i.test(t||''));
            let seleccion=[]; try{seleccion=JSON.parse(process.env.TARGETS_JSON||'[]');if(!Array.isArray(seleccion))seleccion=[];}catch(_){seleccion=[];avisos.push({mensaje:'La selección E2E no era JSON válido; se explorará de forma heurística.'});}
            const agregarError=(tipo,mensaje,extra={})=>errores.push({tipo,mensaje:String(mensaje||tipo||'Error'),url:page.url(),accion:ultimaAccion?.texto||null,estado:estados.length||1,...extra});
            page.on('pageerror',e=>agregarError('pageerror',e.message||e,{stack:e.stack||''}));
            page.on('console',m=>{if(m.type()==='error')agregarError('console',m.text()); if(m.type()==='warning')avisos.push({mensaje:m.text(),url:page.url(),accion:ultimaAccion?.texto||null});});
            page.on('requestfailed',r=>agregarError('requestfailed',r.url()+' '+(r.failure()?.errorText||''),{recurso:r.url()}));
            await page.goto(url,{waitUntil:'load',timeout:30000}).catch(e=>agregarError('load',e.message||e,{stack:e.stack||''}));
            const firma=async()=>page.evaluate(()=>[location.href,document.title,(document.body?.innerText||'').replace(/\\s+/g,' ').trim().slice(0,700),document.querySelectorAll('*').length].join('|'));
            estados.push({indice:1,firma:await firma(),url:page.url(),titulo:await page.title()}); vistos.add(estados[0].firma);
            const candidatosIniciales=page.locator('button,[role="button"],summary,a[href]');
            const nInicial=await candidatosIniciales.count();
            const elementos=[]; for(let i=0;i<nInicial;i++){const el=candidatosIniciales.nth(i);if(!(await el.isVisible().catch(()=>false)))continue;const tag=await el.evaluate(e=>e.tagName.toLowerCase()).catch(()=>'?');const txt=((await el.innerText().catch(()=>''))||'').replace(/\\s+/g,' ').trim().slice(0,120);const h=await el.getAttribute('href').catch(()=>null);if(!safe(txt))continue;if(tag==='a'&&h&&!h.startsWith('#')&&h!=='')continue;elementos.push(await el.evaluate(e=>({tag,texto:((e.innerText||e.getAttribute('aria-label')||e.title||e.name||'')||'').replace(/\\s+/g,' ').trim().slice(0,120),id:e.id||'',name:e.getAttribute('name')||'',href:e.getAttribute('href')||''})).catch(()=>({tag,texto:txt,id:'',name:'',href:h||''})));}
            const seleccionado=new Set(seleccion); const usarSeleccion=seleccionado.size>0;
            const diagnostico={seleccionRecibida:seleccion.length,candidatosPorRonda:[],visiblesPorRonda:[],coincidenciasSeleccionPorRonda:[]}; const basesSeleccion=new Set([...seleccionado].map(k=>String(k).replace(/#\d+$/,"")));
            for(let ronda=0;ronda<5 && acciones.length<100;ronda++){
              const loc=page.locator('button,[role="button"],summary,a[href]'); const n=await loc.count(); const clavesDisponibles=[];
              for(let i=0;i<n;i++){const el=loc.nth(i);if(!(await el.isVisible().catch(()=>false)))continue;const txt=((await el.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim().slice(0,120);if(!safe(txt))continue;const tag=await el.evaluate(e=>e.tagName.toLowerCase()).catch(()=>'?');const h=await el.getAttribute('href').catch(()=>null);if(tag==='a'&&h&&!h.startsWith('#')&&h!=='')continue;const key=await el.evaluate(e=>{const all=[...document.querySelectorAll('button,[role="button"],summary,a[href],input:not([type=hidden]):not([type=file]),select,textarea')];const m=new Map();for(const x of all){const b=[x.tagName.toLowerCase(),x.id||'',x.getAttribute('name')||'',x.getAttribute('href')||'',((x.innerText||x.getAttribute('aria-label')||x.title||x.name||'')||'').replace(/\s+/g,' ').trim().slice(0,120)].join('|');const k=(m.get(b)||0)+1;m.set(b,k);if(x===e)return b+'#'+k;}return '';}).catch(()=> '');if(key)clavesDisponibles.push(key);}
              const coincidenciasExactas=clavesDisponibles.filter(k=>seleccionado.has(k)).length; const coincidenciasBase=clavesDisponibles.filter(k=>basesSeleccion.has(String(k).replace(/#\d+$/,''))).length; diagnostico.candidatosPorRonda.push(clavesDisponibles.length); diagnostico.visiblesPorRonda.push(n); diagnostico.coincidenciasSeleccionPorRonda.push(usarSeleccion?(coincidenciasExactas||coincidenciasBase):clavesDisponibles.length);
              if(usarSeleccion && coincidenciasExactas===0 && coincidenciasBase>0 && ronda===0)avisos.push({mensaje:'La selección E2E se reconcilió con el DOM actual usando la identidad base; cambió la numeración de ocurrencias.',ronda});
              const localizarClave=async key=>{const actual=page.locator('button,[role="button"],summary,a[href]');const total=await actual.count();for(let i=0;i<total;i++){const e=actual.nth(i);const k=await e.evaluate(el=>{const all=[...document.querySelectorAll('button,[role="button"],summary,a[href],input:not([type=hidden]):not([type=file]),select,textarea')];const m=new Map();for(const x of all){const b=[x.tagName.toLowerCase(),x.id||'',x.getAttribute('name')||'',x.getAttribute('href')||'',((x.innerText||x.getAttribute('aria-label')||x.title||x.name||'')||'').replace(/\s+/g,' ').trim().slice(0,120)].join('|');const n=(m.get(b)||0)+1;m.set(b,n);if(x===el)return b+'#'+n;}return '';},e).catch(()=> '');if(k===key)return e;}return null;};
              let hizo=0;
              for(const key of clavesDisponibles){if(acciones.length>=100)break;if(usarSeleccion&&!seleccionado.has(key)&&!basesSeleccion.has(String(key).replace(/#\d+$/,"")))continue;if(acciones.some(a=>a.key===key&&a.ronda===ronda))continue;
                let el=await localizarClave(key);
                if(!el){
                  const base=String(key).replace(/#\d+$/,'');
                  const actual=page.locator('button,[role="button"],summary,a[href]');
                  const total=await actual.count();
                  for(let i=0;i<total;i++){const cand=actual.nth(i);if(!(await cand.isVisible().catch(()=>false)))continue;const ckey=await cand.evaluate(el=>{const b=[el.tagName.toLowerCase(),el.id||'',el.getAttribute('name')||'',el.getAttribute('href')||'',((el.innerText||el.getAttribute('aria-label')||el.title||el.name||'')||'').replace(/\s+/g,' ').trim().slice(0,120)].join('|');return b;}).catch(()=> '');if(ckey===base){el=cand;break;}}
                }
                if(!el)continue;
                let visible=false;try{visible=await el.isVisible({timeout:300});}catch(_){visible=false;}if(!visible)continue;
                const txt=((await el.innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim().slice(0,120);const tag=await el.evaluate(e=>e.tagName.toLowerCase()).catch(()=>'?');const href=await el.getAttribute('href').catch(()=>null);const antes=await firma();ultimaAccion={tipo:'click',texto:txt,key};ultimaAccionMs=Date.now();
                try{await el.scrollIntoViewIfNeeded({timeout:700}).catch(()=>{});if(!(await el.isVisible().catch(()=>false)))continue;await el.click({timeout:1200});await page.waitForTimeout(120);const despues=await firma();acciones.push({tipo:'click',elemento:tag,texto:txt,href:href||'',cambio:antes!==despues,key,ronda});if(!vistos.has(despues)){vistos.add(despues);estados.push({indice:estados.length+1,firma:despues,url:page.url(),titulo:await page.title(),accion:txt});}hizo++;}catch(err){const msg=String(err?.message||err);if(/not visible|not attached|detached|not stable|element is outside|Timeout .*click/i.test(msg)){avisos.push({mensaje:'Acción omitida: el elemento dejó de ser visible o accionable antes del click.',accion:txt,key,ronda});}else{agregarError('click',msg,{stack:err.stack||'',elemento:txt,key});}}
              }
              }
              if(!hizo)break;
            }
            if(!acciones.length && diagnostico.candidatosPorRonda.some(n=>n>0))avisos.push({mensaje:usarSeleccion?'Se detectaron candidatos interactivos en el DOM, pero ninguna acción llegó a ejecutarse con la selección recibida.':'Se detectaron candidatos interactivos en el DOM, pero ninguna acción llegó a ejecutarse.',diagnostico});
            const r={modo:'nube',run_id:process.env.GITHUB_RUN_ID||null,run_url:(process.env.GITHUB_SERVER_URL&&process.env.GITHUB_REPOSITORY&&process.env.GITHUB_RUN_ID)?(process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID):null,url,titulo:await page.title(),acciones,estados,errores,avisos,resumen:{estados:estados.length,acciones:acciones.length,errores:errores.length,avisos:avisos.length}};
            fs.writeFileSync('resultado.json',JSON.stringify(r,null,2));
            await browser.close();
          })().catch(e=>{fs.writeFileSync('resultado.json',JSON.stringify({modo:'nube',run_id:process.env.GITHUB_RUN_ID||null,run_url:(process.env.GITHUB_SERVER_URL&&process.env.GITHUB_REPOSITORY&&process.env.GITHUB_RUN_ID)?(process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID):null,errores:[{tipo:'infraestructura',mensaje:String(e.message||e)}],resumen:{estados:0,acciones:0,errores:1,avisos:0}},null,2));process.exit(1)});
          E2EJS
          node e2e.js
      - name: Publicar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f resultado.json ]; then
            echo "No se genero resultado.json (fallo de infraestructura); el run queda como failure."
            exit 1
          fi
          node --input-type=commonjs <<'PUBLISH_E2E_RESULT'
          (async () => {
          const fs = require('fs');
          const token = process.env.GH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;
          const apiBase = process.env.GITHUB_API_URL || 'https://api.github.com';
          const branch = process.env.GITHUB_REF_NAME;
          const packageDir = process.env.PACKAGE_DIR;
          if (!token || !repo || !branch || !packageDir) throw new Error('Faltan variables para publicar resultado.json');
          const path = packageDir.replace(/^\/+|\/+$/g, '') + '/resultado.json';
          const endpoint = apiBase.replace(/\/$/, '') + '/repos/' + repo + '/contents/' + path.split('/').map(encodeURIComponent).join('/');
          const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const existing = await fetch(endpoint + '?ref=' + encodeURIComponent(branch), { headers });
          let sha = null;
          if (existing.ok) {
            const actual = await existing.json();
            sha = actual.sha || null;
          } else if (existing.status !== 404) {
            throw new Error('No se pudo comprobar resultado.json antes de publicar: HTTP ' + existing.status + ' ' + await existing.text());
          }
          const body = {
            message: 'Resultado E2E: ' + (process.env.PROJECT_NAME || 'proyecto'),
            content: fs.readFileSync('resultado.json').toString('base64'),
            branch
          };
          if (sha) body.sha = sha;
          const response = await fetch(endpoint, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!response.ok) throw new Error('No se pudo publicar resultado.json: HTTP ' + response.status + ' ' + await response.text());
          const published = await response.json();
          console.log('Resultado E2E publicado:', published.content?.path || path);
          })().catch(error => {
            console.error('No se pudo publicar el resultado E2E:', error);
            process.exitCode = 1;
          });
          PUBLISH_E2E_RESULT